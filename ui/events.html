<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CFOperator · Events</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<!-- Tokens, the rail and the shared kit: one copy, see ui/console.css. -->
<link rel="stylesheet" href="/console.css">
<style>
  .toolbar { display:flex; flex-wrap:wrap; align-items:center; gap:8px; }
  .toolbar .tabs { flex-basis:100%; }
  .fld.check { font-size:13px; min-height:36px; cursor:pointer; }
  .summ { max-width:640px; }
  .outcome { display:flex; flex-wrap:wrap; align-items:center; gap:6px; }
  .more { padding:12px 16px; text-align:center; border-top:1px solid var(--border-faint); }
  /* A sweep's burst of findings folds under one row (CFOP-696). The header is
     a button so the fold is reachable by Tab and says its state. */
  tr.grp td { padding:0; background:var(--bg-row); border-bottom-color:var(--border-subtle); }
  .grp-btn { all:unset; box-sizing:border-box; display:flex; flex-wrap:wrap; align-items:center; gap:10px;
    width:100%; min-height:48px; padding:6px 16px; cursor:pointer; font-size:13px; }
  .grp-btn:focus-visible { outline:2px solid var(--cyan); outline-offset:-2px; }
  .grp-btn .chev { width:14px; height:14px; color:var(--text-secondary); transition:transform .15s; flex:none; }
  .grp-btn[aria-expanded="true"] .chev { transform:rotate(90deg); }
  .grp-btn b { font-weight:600; font-size:14px; }
  .grp-btn .end { margin-left:auto; }
  tr.in-grp > td:first-child { padding-left:40px; }
  .prose { margin:0 0 8px; line-height:1.55; white-space:pre-wrap; word-break:break-word; }
  ol.tl { list-style:none; padding:0; margin:0 0 8px; } ol.tl li { margin:0 0 6px; line-height:1.5; }
  ol.tl .when { color:var(--text-secondary); } ol.tl .note { display:block; margin-left:12px; white-space:pre-wrap; word-break:break-word; }
</style>
</head>
<body>
<header>
  <h1 class="page-title">Events</h1>
  <span class="muted" id="updated"></span>
  <!-- The rail: section nav, status, identity and logout — see ui/nav.js -->
  <div id="cfop-nav"></div>
</header>
<script src="/nav.js" defer></script>
<main class="page">
<div id="banner" role="status" hidden></div>
<div class="toolbar">
  <div class="tabs" id="filters" aria-label="Status"></div>
  <label class="fld">Decision <select id="f-action" aria-label="Decision" onchange="setFilter('action', this.value)"></select></label>
  <label class="fld">Source <select id="f-source" aria-label="Source" onchange="setFilter('source', this.value)"></select></label>
  <label class="fld">Severity <select id="f-severity" aria-label="Severity" onchange="setFilter('severity', this.value)"></select></label>
  <label class="fld">Time <select id="f-window" aria-label="Time window" onchange="setFilter('window', this.value)"></select></label>
  <label class="fld check"><input type="checkbox" id="f-group" onchange="setGroup(this.checked)"> Group sweep findings</label>
</div>
<section class="card" aria-label="Event feed">
  <div class="card-head">
    <input type="search" id="f-q" aria-label="Search alerts" placeholder="Summary, resource, alert id" oninput="searchInput(this.value)">
  </div>
  <!-- Sortable headers (CFOP-412): data-sort names a key the script defines for listKit.
       The sort is over the rows loaded so far (the server pages newest first). -->
  <table>
    <thead><tr><th data-sort="when">Time</th><th data-sort="severity">Severity</th><th data-sort="alert">Alert</th><th data-sort="source">Source</th><th data-sort="decision">Outcome</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <div id="empty" class="empty" hidden>No alerts match these filters.</div>
  <div id="more" class="more" hidden><button type="button" class="chip" onclick="loadMore()">Load older alerts</button></div>
</section>
</main>
<div id="backdrop" onclick="closeDetail()" aria-hidden="true"></div>
<!-- A dialog (CFOP-94): inert while closed so its off-screen controls are not in the tab
     order; detail() lifts it, closeDetail() restores it. Labelled by the h2 detail() paints. -->
<div id="detail" role="dialog" aria-modal="true" aria-labelledby="detail-title" inert></div>
<div id="toasts"></div>

<!-- esc/badge/fmtTs/listKit/toast/trapFocus/copyIcon — one copy, see ui/common.js. Not deferred:
     the script below calls them at top level. -->
<script src="/common.js"></script>
<script>
// Every alert the event runtime received and what it decided (CFOP-215):
// the ones triaged to log_only or notify, suppressed as duplicates, gated as
// info or handed to a deep investigation, as well as the ones that became
// investigations. Read through /api/events, which proxies the runtime's
// per-alert read model — filters and paging run there, over every alert, so
// what a filter shows is everything that matches rather than whatever fitted
// in a window of recent events.
const PAGE=50;
// A poll re-reads what is on screen. Past this many rows (the server's page
// cap) it would be a partial re-read, so it stops and says so.
const MAX_POLLED=200;
const STATUSES=['completed','failed','suppressed','logged','running','queued','received'];
const STATUS_COLOR={completed:'--accent',failed:'--red',suppressed:'--text-muted',logged:'--text-secondary',
  running:'--cyan',queued:'--cyan',received:'--cyan'};
const ACTIONS=['investigate','deep_investigate','notify','escalate','log_only','suppressed'];
const ACTION_COLOR={investigate:'--cyan',deep_investigate:'--purple',notify:'--orange',escalate:'--red',
  log_only:'--text-muted',suppressed:'--text-muted'};
const SEVERITY_COLOR={critical:'--red',warning:'--orange',info:'--cyan'};
const KNOWN_SOURCES=['alertmanager','cfoperator-sweep','boot-forensics','manual'];
const WINDOWS={'1h':3600,'24h':86400,'7d':604800,'30d':2592000};
// What /api/events says went wrong, in the words that tell the operator what
// to do. "unauthorized" is the agent's token being refused by the runtime —
// a deploy fix, not a reason to sign in again.
const REASONS={
  not_configured:'This console has no event runtime configured, so there are no events to show.',
  unreachable:'The event runtime is not answering.',
  unauthorized:'The event runtime refused this console. The agent needs the runtime’s CFOP_RUNTIME_TOKEN (docs/auth.md).',
  store_unavailable:'The event runtime cannot answer queries right now.',
  bad_request:'The event runtime rejected this filter.'
};

// Filters live in the query string and the open alert in the hash, so a URL
// is a view you can paste and a reload comes back to (the CFOP-73 pattern).
const F={status:'',action:'',source:'',severity:'',window:'',q:''};
let ROWS=[], CURSOR=null, LAST_SIG=null, SEEN_SOURCES=new Set(KNOWN_SOURCES), PAUSED=false;

// Sortable headers (CFOP-412): one kit in common.js, the page supplies what
// each column sorts by. Severity sorts by rank, not alphabet. The sort is
// over the rows loaded so far: the server pages newest first and the default
// keeps that, so nothing changes until a header is clicked. The search box
// is the server's (q in the query string), not the kit's.
const SEV_RANK={critical:3,warning:2,info:1};
const KIT=listKit({page:'events', initial:{key:'when',dir:'desc'},
  dir:{when:'desc',severity:'desc',investigation:'desc'},
  keys:{when:r=>tsKey(r.latest_event_at), source:r=>r.source, severity:r=>SEV_RANK[r.severity]||null,
    alert:r=>r.summary, decision:r=>r.action, llm:r=>{ const s=llmStamps(r); return s.investigated||s.triaged||null; },
    status:r=>r.status, investigation:r=>investigationOf(r)},
  onChange:()=>paint()});

function parseQuery(search){
  const out={};
  String(search||'').replace(/^\?/,'').split('&').forEach(pair=>{
    if(!pair) return;
    const i=pair.indexOf('=');
    const dec=v=>{ try{ return decodeURIComponent(v.replace(/\+/g,' ')); }catch(e){ return ''; } };
    out[dec(i<0?pair:pair.slice(0,i))]=dec(i<0?'':pair.slice(i+1));
  });
  return out;
}
function encodePairs(obj){
  return Object.keys(obj).filter(k=>obj[k]!==''&&obj[k]!=null)
    .map(k=>encodeURIComponent(k)+'='+encodeURIComponent(obj[k])).join('&');
}
// The page's own URL: filters as written, window included.
function pageQuery(){ return encodePairs(F); }
// The API's: the window becomes a since bound; everything else passes as is.
function apiQuery(extra){
  const p={status:F.status, action:F.action, source:F.source, severity:F.severity, q:F.q};
  if(WINDOWS[F.window]) p.since=new Date(Date.now()-WINDOWS[F.window]*1000).toISOString();
  return encodePairs(Object.assign(p, extra||{}));
}
function writeUrl(){
  const q=pageQuery();
  history.replaceState(null,'',location.pathname+(q?'?'+q:'')+(OPEN!==null?'#'+encodeURIComponent(OPEN):''));
}
(function readFilters(){
  const q=parseQuery(location.search);
  Object.keys(F).forEach(k=>{ F[k]=q[k]||''; });
})();

// A non-OK body is JSON with a reason; say what it means.
async function getJson(url){
  const res=await fetch(url);
  let body=null; try{ body=await res.json(); }catch(e){ body=null; }
  if(res.ok===false){
    const reason=body&&body.reason, detail=body&&body.error;
    const msg=res.status===401?'Signed out — sign in again.'
      :REASONS[reason]?REASONS[reason]+(detail?' ('+detail+')':'')
      :(detail||('HTTP '+res.status));
    const err=new Error(msg); err.status=res.status; throw err;
  }
  return body||{};
}
function setBanner(msg, isError){
  const b=document.getElementById('banner');
  b.hidden=!msg; b.className=isError?'err':''; b.textContent=msg||'';
}
function storeNote(body){
  if(PAUSED) return 'Auto-refresh is paused while more than '+MAX_POLLED+' alerts are loaded. Reload to resume.';
  if(body.store==='outbox') return 'The event runtime’s Postgres is unavailable, so this is its local outbox: complete, but slower to query.';
  if(body.lagging) return 'The event runtime’s Postgres copy is catching up; the newest events may be missing for a moment.';
  return '';
}

// A poll that brought nothing new does not rebuild the table (CFOP-95).
function signature(){
  return ROWS.map(r=>{ const s=llmStamps(r);
    return [r.alert_id,r.status,r.action,r.latest_event_at,r.event_count,investigationOf(r),s.triaged,s.investigated].join('\u0001'); }).join('\n')
    +'\n'+(CURSOR||'');
}
async function load(){
  if(document.hidden) return;
  if(ROWS.length>MAX_POLLED){ PAUSED=true; return; }
  PAUSED=false;
  const limit=Math.min(Math.max(PAGE, Math.ceil(ROWS.length/PAGE)*PAGE), MAX_POLLED);
  let body;
  try{ body=await getJson('/api/events?'+apiQuery({limit:limit})); }
  catch(e){ setBanner(e.message,true); return; }
  ROWS=body.alerts||[]; CURSOR=body.next_cursor||null;
  setBanner(storeNote(body),false);
  const sig=signature();
  if(sig!==LAST_SIG){ LAST_SIG=sig; paint(); } else refreshAges();
  document.getElementById('updated').textContent='updated '+new Date().toLocaleTimeString();
}
async function loadMore(){
  if(!CURSOR) return;
  let body;
  try{ body=await getJson('/api/events?'+apiQuery({limit:PAGE, cursor:CURSOR})); }
  catch(e){ toast(e.message,'err'); return; }
  const have=new Set(ROWS.map(r=>r.alert_id));
  ROWS=ROWS.concat((body.alerts||[]).filter(r=>!have.has(r.alert_id)));
  CURSOR=body.next_cursor||null;
  LAST_SIG=signature(); paint();
}
function setFilter(key, value){
  F[key]=value||''; writeUrl();
  ROWS=[]; CURSOR=null; LAST_SIG=null;
  paintFilters(); load();
}
// Typing searches after a pause, not per keystroke.
let SEARCH_TIMER=null;
function searchInput(value){
  clearTimeout(SEARCH_TIMER);
  SEARCH_TIMER=setTimeout(()=>setFilter('q', String(value||'').trim()), 300);
}

function investigationOf(r){
  const v=((r.result||{}).details||{}).investigation_id;
  return /^\d+$/.test(String(v==null?'':v))&&Number(v)>0?Number(v):null;
}
// The models that produced this alert's output. Triage chose the action;
// the investigation model wrote the result. Either half can be missing —
// a log-only skip never called a model — and absence stays a blank, not
// "unknown". The list shows the investigation model when there is one,
// since that is the output; the drawer names both.
function llmStamps(a){
  const params=(a.decision||{}).params||{};
  const triaged=[params.triage_backend, params.triage_model].map(x=>String(x||'').trim()).filter(Boolean).join('/');
  const investigated=String((((a.result||{}).details)||{}).provider||'').trim();
  return {triaged, investigated};
}
// Under the summary, in the row: what it is about and which model answered.
function subLine(a){
  const s=llmStamps(a), res=resource(a), llm=s.investigated||s.triaged;
  const parts=[res?esc(res):'', llm?`<span title="${s.investigated?'investigated by':'triaged by'}">${esc(llm)}</span>`:''].filter(Boolean);
  return parts.length?`<span class="sub">${parts.join(' · ')}</span>`:'';
}
// One cell for what became of the alert: the decision, the status when it
// adds something (a completed investigate is just "investigate"; a failed or
// running one says so; suppressed/suppressed and log_only/logged say it
// once), and the investigation it opened.
const STATUS_SAYS_NOTHING={completed:1};
const SAME_THING={suppressed:'suppressed', log_only:'logged'};
function outcomeCell(r){
  const inv=investigationOf(r), parts=[];
  if(r.action) parts.push(badge(r.action, ACTION_COLOR[r.action]||'--text-muted'));
  if(!r.action || (!STATUS_SAYS_NOTHING[r.status] && SAME_THING[r.action]!==r.status))
    parts.push(badge(r.status, STATUS_COLOR[r.status]||'--text-muted'));
  if(inv) parts.push(`<a class="mono" href="/investigations#${inv}" onclick="event.stopPropagation()">#${inv}</a>`);
  return `<span class="outcome">${parts.join('')}</span>`;
}
function dot(text, varname){ return `<span class="sev" style="--tone:var(${varname})">${esc(text)||'—'}</span>`; }
function sourceLabel(s){ return s==='cfoperator-sweep'?'sweep':(s||'—'); }
function resource(r){ return [r.namespace, r.resource_name].filter(Boolean).join('/'); }
// LLM- and alert-adjacent URLs: only http(s) reaches an href (same posture as
// the investigations and remediations pages).
function safeUrl(u){ const s=String(u==null?'':u).trim(); if(!s) return '';
  try{ const p=new URL(s, window.location.href);
  return (p.protocol==='http:'||p.protocol==='https:')?p.href:''; }catch(e){ return ''; } }

function chip(value, label){
  const on=F.status===value;
  return `<button type="button" class="tab" aria-pressed="${on}" data-status="${esc(value)}" onclick="setFilter('status', this.getAttribute('data-status'))">${esc(label)}</button>`;
}
function options(id, values, allLabel, current, label){
  const el=document.getElementById(id);
  el.innerHTML=`<option value="">${esc(allLabel)}</option>`+values.map(v=>
    `<option value="${esc(v)}"${v===current?' selected':''}>${esc(label?label(v):v)}</option>`).join('');
  el.value=current;
}
function paintFilters(){
  document.getElementById('filters').innerHTML=chip('','All')+STATUSES.map(s=>chip(s,s[0].toUpperCase()+s.slice(1))).join('');
  options('f-action', ACTIONS, 'Any', F.action);
  options('f-source', Array.from(SEEN_SOURCES), 'Any', F.source, sourceLabel);
  options('f-severity', ['critical','warning','info'], 'Any', F.severity);
  options('f-window', Object.keys(WINDOWS), 'All time', F.window, w=>'Last '+w);
  const q=document.getElementById('f-q'); if(q.value!==F.q) q.value=F.q;
  const g=document.getElementById('f-group'); if(g) g.checked=GROUP;
}
// ---- grouping (CFOP-696) ---------------------------------------------------
// A sweep posts its findings in one burst, and the feed used to show that as
// seven near-identical rows. With the box ticked, a run of sweep-sourced
// alerts close together in time folds under one header row. The alerts carry
// no sweep id, so "close together" is the definition: within GROUP_GAP_MS of
// the run's first row. Of its first row, not of the row before: chained, a
// sweep every few minutes would fold the whole loaded history into one row,
// and the interval can be set as low as a minute. Only in time order — under
// any other sort a run is not a sweep — and only over the rows loaded so far.
const GROUP_GAP_MS=5*60*1000, SWEEP='cfoperator-sweep', GROUP_STORE='cfop.events.group';
let GROUP=true; try{ GROUP=localStorage.getItem(GROUP_STORE)!=='0'; }catch(e){ GROUP=true; }
const FOLDED=new Set();
function setGroup(on){ GROUP=!!on; try{ localStorage.setItem(GROUP_STORE, GROUP?'1':'0'); }catch(e){} paint(); }
// Pure: rows in display order -> [{rows:[...], group:bool}]. A run of one is
// not a group. A row from another source is emitted on its own and leaves the
// open run alone: an alertmanager firing while a sweep is still posting must
// not cut that sweep in two. The run's rows sit together where its first one
// was, so such a row shows just after the group it fell inside.
function groupRuns(rows){
  const out=[]; let run=null;
  rows.forEach(r=>{
    const t=tsKey(r.latest_event_at);
    if(r.source!==SWEEP || t==null){ out.push({rows:[r]}); return; }
    if(run && Math.abs(run.anchor-t)<=GROUP_GAP_MS){ run.rows.push(r); return; }
    run={rows:[r], anchor:t}; out.push(run);
  });
  return out.map(g=>({rows:g.rows, group:g.rows.length>1}));
}
function hhmm(iso){ const d=parseTs(iso); if(!d) return ''; const p=n=>String(n).padStart(2,'0'); return p(d.getHours())+':'+p(d.getMinutes()); }
const CHEV='<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>';
function groupHead(rows){
  // Named by its oldest member: a sweep still arriving grows at the new end.
  const key=rows[rows.length-1].alert_id, open=!FOLDED.has(key);
  const times=rows.map(r=>r.latest_event_at).filter(Boolean).sort();
  const from=hhmm(times[0]), to=hhmm(times[times.length-1]);
  const c={}; rows.forEach(r=>{ const k=r.action||r.status; c[k]=(c[k]||0)+1; });
  const worst=rows.reduce((m,r)=>(SEV_RANK[r.severity]||0)>(SEV_RANK[m]||0)?r.severity:m, 'info');
  return `<tr class="grp"><td colspan="5"><button type="button" class="grp-btn" aria-expanded="${open}" data-grp="${esc(key)}" onclick="toggleGroup(this)">${CHEV}
      <span class="mono muted">${esc(from===to?from:from+'–'+to)}</span><b>Sweep</b>
      <span class="muted">${rows.length} findings · ${Object.keys(c).map(k=>c[k]+' '+esc(k)).join(' · ')}</span>
      <span class="end">${dot(worst, SEVERITY_COLOR[worst]||'--text-muted')}</span></button></td></tr>`;
}
function toggleGroup(btn){
  const key=btn.getAttribute('data-grp');
  if(FOLDED.has(key)) FOLDED.delete(key); else FOLDED.add(key);
  paint();
  const again=document.querySelector?document.querySelector('.grp-btn[data-grp="'+String(key).replace(/["\\]/g,'\\$&')+'"]'):null;
  if(again&&again.focus) again.focus();
}
function rowHtml(r, inGroup){
  // The alert id reaches the handler through data-id, never through the
  // inline JS: ids come from alert sources, and a quote in one must not be
  // able to become script.
  return `
    <tr id="row-${esc(r.alert_id)}" data-id="${esc(r.alert_id)}"${inGroup?' class="in-grp"':''} tabindex="0" onclick="openRow(this)" onkeydown="rowKey(event,this)">
      <td class="mono muted">${fmtTs(r.latest_event_at)}</td>
      <td>${dot(r.severity, SEVERITY_COLOR[r.severity]||'--text-muted')}</td>
      <td class="summ">${esc(String(r.summary||'').slice(0,160))}${subLine(r)}</td>
      <td class="mono muted" style="white-space:nowrap">${esc(sourceLabel(r.source))}</td>
      <td>${outcomeCell(r)}</td></tr>`;
}
function paint(){
  ROWS.forEach(r=>{ if(r.source && !SEEN_SOURCES.has(r.source)){ SEEN_SOURCES.add(r.source); paintFilters(); } });
  document.getElementById('empty').hidden=ROWS.length>0;
  document.getElementById('more').hidden=!CURSOR;
  const focused=focusedRow();
  const sorted=KIT.sort(ROWS);
  const runs=(GROUP && KIT.state.key==='when')?groupRuns(sorted):sorted.map(r=>({rows:[r], group:false}));
  document.getElementById('rows').innerHTML=runs.map(g=>{
    if(!g.group) return rowHtml(g.rows[0], false);
    const folded=FOLDED.has(g.rows[g.rows.length-1].alert_id);
    return groupHead(g.rows)+(folded?'':g.rows.map(r=>rowHtml(r, true)).join(''));
  }).join('');
  refocusRow(focused);
}
function openRow(tr){ detail(tr.getAttribute('data-id')); }
// Rows are focusable rather than links (CFOP-94); Enter and Space open, as on
// a button. A key pressed on a link inside the row is the link's own.
function rowKey(e,tr){
  if(e.target!==e.currentTarget) return;
  if(e.key==='Enter'||e.key===' '){ e.preventDefault(); openRow(tr); }
}
function focusedRow(){ const a=document.activeElement; return (a&&a.id&&a.id.indexOf('row-')===0)?a.id:null; }
function refocusRow(id){ if(!id) return; const el=document.getElementById(id); if(el&&el.focus) el.focus(); }
function focusDetailClose(){ const x=document.getElementById('detail-close'); if(x&&x.focus) x.focus(); }

// The open drawer names itself in the URL: /events#<alert id>. replaceState,
// not location.hash — assigning fires hashchange, which would re-enter
// detail() and refetch, and fill the back button with every row glanced at.
let OPEN=null;
// The element that opened the drawer, so closing can hand focus back (CFOP-94).
let OPENER=null;
function closeDetail(){
  const d=document.getElementById('detail'); d.classList.remove('open'); d.inert=true;
  document.getElementById('backdrop').classList.remove('open');
  if(OPEN===null) return;
  OPEN=null; history.replaceState(null,'',location.pathname+location.search); restoreFocus();
}
function restoreFocus(){
  const o=OPENER; OPENER=null; if(!o) return;
  const t=(o.isConnected===false && o.id)?document.getElementById(o.id):o;
  if(t&&t.focus) t.focus();
}
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeDetail(); });
trapFocus(document.getElementById('detail'));
bindCopyIcons(document);

function closeButton(){ return '<button type="button" class="x" id="detail-close" onclick="closeDetail()" aria-label="Close">×</button>'; }

async function detail(id){
  id=String(id);
  const d=document.getElementById('detail'); d.innerHTML='<span class="muted">loading…</span>';
  if(OPEN===null) OPENER=document.activeElement||null;
  d.classList.add('open'); d.inert=false; document.getElementById('backdrop').classList.add('open');
  OPEN=id; history.replaceState(null,'','#'+encodeURIComponent(id));
  let body;
  try{
    body=await getJson('/api/events/'+encodeURIComponent(id));
    if(!body || !body.alert) throw new Error('empty response');
  }catch(e){
    if(OPEN===id){ d.innerHTML=closeButton()+'<span class="muted">error loading this alert'+(e&&e.message?' ('+esc(e.message)+')':'')+'</span>'; focusDetailClose(); }
    return;
  }
  // Two clicks in quick succession: last click wins, a stale answer is dropped.
  if(OPEN!==id) return;
  d.innerHTML=renderDetail(body.alert, body.events||[]);
  focusDetailClose();
}
function renderDetail(a, events){
  const dec=a.decision||{}, res=a.result||{}, det=res.details||{}, llm=llmStamps(a);
  const inv=investigationOf(a);
  const links=['html_url','url','investigation_url'].map(k=>safeUrl(det[k])).filter(Boolean);
  const source=(events.find(e=>(e.payload||{}).alert)||{}).payload;
  const alertDetails=((source||{}).alert||{}).details||{};
  const title=a.summary||a.alert_id;
  return `${closeButton()}
    <h2 id="detail-title">${esc(title)}${copyIcon('summary',{text:title})}</h2>
    <div class="kv">${badge(a.status, STATUS_COLOR[a.status]||'--text-muted')}
      ${a.action?badge(a.action, ACTION_COLOR[a.action]||'--text-muted'):''}
      ${badge(a.severity, SEVERITY_COLOR[a.severity]||'--text-muted')}
      <span class="muted">${esc(a.source||'')}</span></div>
    <div class="kv"><b>alert</b> <span id="alert-id">${esc(a.alert_id)}</span>${copyIcon('alert id',{from:'alert-id'})}</div>
    ${resource(a)?`<div class="kv"><b>resource</b> ${esc(resource(a))}${a.resource_type?' <span class="muted">('+esc(a.resource_type)+')</span>':''}</div>`:''}
    <div class="kv"><b>first seen</b> ${fmtTs(a.first_event_at,{seconds:true})}</div>
    <div class="kv"><b>latest</b> ${fmtTs(a.latest_event_at,{seconds:true})} <span class="muted">· ${esc(a.event_count)} events</span></div>
    ${a.reason?`<div class="kv"><b>reason</b> ${esc(a.reason)}</div>`:''}
    ${dec.action?`<h3>Triage</h3>
      <div class="kv"><b>decision</b> ${badge(dec.action, ACTION_COLOR[dec.action]||'--text-muted')}${dec.confidence!=null?' <span class="muted">confidence '+esc(dec.confidence)+'</span>':''}</div>
      ${llm.triaged?`<div class="kv"><b>triaged by</b> <span class="mono">${esc(llm.triaged)}</span></div>`:''}
      ${dec.reasoning?`<div class="prose">${esc(dec.reasoning)}</div>`:''}`:''}
    ${(a.message||inv||links.length||llm.investigated)?`<h3>Outcome</h3>
      ${llm.investigated?`<div class="kv"><b>investigated by</b> <span class="mono">${esc(llm.investigated)}</span></div>`:''}
      ${inv?`<div class="kv"><b>investigation</b> <a href="/investigations#${inv}">#${inv}</a></div>`:''}
      ${links.map(u=>`<div class="kv"><b>link</b> <a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(u)} ↗</a></div>`).join('')}
      ${a.message?`<div class="prose">${esc(a.message)}</div>`:''}`:''}
    <h3>Timeline</h3>
    <ol class="tl">${(a.timeline||[]).map(t=>`<li><span class="when">${fmtTs(t.created_at,{seconds:true})}</span> ${esc(t.event_type)}${t.note?`<span class="note">${esc(t.note)}</span>`:''}</li>`).join('')}</ol>
    ${Object.keys(alertDetails).length?`<details><summary>Alert details${copyIcon('alert details',{from:'alert-details'})}</summary>
      <pre id="alert-details">${esc(JSON.stringify(alertDetails,null,2))}</pre></details>`:''}
    <details><summary>Raw events (${events.length})${copyIcon('raw events',{from:'raw-events'})}</summary>
      <pre id="raw-events">${esc(JSON.stringify(events,null,2))}</pre></details>`;
}
function openFromHash(){
  let id=''; try{ id=decodeURIComponent(location.hash.replace(/^#/,'')); }catch(e){ id=''; }
  if(id && id!==OPEN) detail(id);
}
window.addEventListener('hashchange', openFromHash);
// A hidden tab has nobody looking; coming back catches up at once.
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) load(); });
setInterval(load, 20000);
paintFilters();
load();
openFromHash();
</script>
</body>
</html>
