<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CFOperator</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <!-- Vendored (ui/vendor/manifest.json pins the version and hash): the
         console is what gets opened when the WAN is down, so nothing here
         may reach a CDN. Not deferred - the main script configures it at
         top level. -->
    <script src="/vendor/marked.min.js"></script>
    <!-- toast (and the other shared helpers) — one copy, see ui/common.js. Not deferred. -->
    <script src="/common.js"></script>
    <script src="/nav.js" defer></script>
    <!-- Embedded (CFOP-711): this page inside the Ask panel on another page
         (nav.js asks for ?embed=1). Marked here, before the first paint, so
         the frame never flashes a rail and a title the host already has. A
         link in the frame that is not a new tab navigates the host page, not
         the frame: "Defaults and seats in Admin" opened in the panel would be
         Admin, rail and all, 480px wide. Its own small block with an id: the
         page's script is the one further down, and stays the page's first
         bare script tag, which is how the chat tests find it. -->
    <script id="embed-mode">
        if (/(?:^|[?&])embed=1(?:&|$)/.test(location.search)) {
            document.documentElement.classList.add('embed');
            const base = document.createElement('base');
            base.target = '_top';
            document.head.appendChild(base);
        }
    </script>
    <!-- Tokens, the rail and the shared kit: one copy, see ui/console.css. -->
    <link rel="stylesheet" href="/console.css">
    <style>
        /* Tokens, the rail and the kit come from /console.css. What is set
           here is the chat's own: its dims, and the bar-and-pane frame the
           other pages do not have. */
        :root {
            --accent-glow: rgba(34, 197, 94, 0.12);
            --cyan-dim: #164e63;
            --orange-dim: #78350f;
            --red-dim: #7f1d1d;
            --sidebar-width: 260px;
            --header-height: 56px;
            --radius-sm: 6px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        ::selection { background: var(--accent-dim); color: var(--accent); }

        body {
            /* One face for the whole page (CFOP-113): the chat, its composer, the
               controls and the chrome are all JetBrains Mono. A second family for
               the message text read as the odd one out beside everything else. */
            font-family: 'JetBrains Mono', monospace;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ── Header ── */
        header {
            height: var(--header-height);
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 16px;
            flex-shrink: 0;
            flex-wrap: nowrap;
            z-index: 10;
        }
        header .page-title { font-family: var(--font-ui); font-size: 18px; }

        /* Embedded in the Ask panel (CFOP-711). The host page has the rail,
           a title and the agent's status; the frame keeps the conversation
           and the controls that act on it. The sidebar lies over the chat
           when opened: at the panel's width, beside it would leave the chat
           a third of the frame. */
        html.embed body { padding-left: 0; }
        html.embed #cfop-nav, html.embed header .page-title { display: none; }
        html.embed header { height: 44px; padding: 0 10px; gap: 8px; }
        html.embed .main-layout { position: relative; }
        html.embed .sidebar { position: absolute; top: 0; bottom: 0; left: 0; z-index: 5;
            max-width: 86%; box-shadow: 8px 0 24px rgba(0,0,0,.5); }

        /* Controls do not inherit a family from body (a bare <button> renders in
           the browser's own), so the element rule is what makes them match. */
        button, input, select, textarea { font-family: inherit; }
        /* LLM chip + popover (CFOP-19). Full OODA/pool/fallback stay in Admin. */
        .llm-switcher { position: relative; flex-shrink: 1; min-width: 0; }
        .llm-chip {
            display: inline-flex; align-items: center; gap: 6px;
            max-width: min(320px, 40vw);
            background: var(--bg-tertiary); color: var(--text-primary);
            border: 1px solid var(--border); border-radius: var(--radius-sm);
            padding: 6px 10px; cursor: pointer;
            font-family: 'JetBrains Mono', monospace; font-size: 12px;
            transition: border-color .15s, color .15s, background .15s;
        }
        .llm-chip:hover:not(:disabled) { border-color: var(--text-secondary); }
        .llm-chip[aria-expanded="true"] {
            border-color: var(--accent);
            background: color-mix(in srgb, var(--accent) 12%, var(--bg-tertiary));
        }
        .llm-chip:disabled { cursor: default; opacity: .85; }
        .llm-chip-label {
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
            color: var(--text-secondary);
        }
        .llm-chip-label.ready { color: var(--text-primary); }
        .llm-chip-caret { color: var(--text-muted); font-size: 10px; flex-shrink: 0; }
        .llm-chip:disabled .llm-chip-caret { display: none; }
        /* The session is off the plain-chat seat (CFOP-417): a handed row,
           or a chip override. Coloured so a frontier session is never a
           surprise on the bill, and gone with the session. */
        .llm-chip.session { border-color: var(--orange); }
        .llm-chip-badge {
            display: none; flex-shrink: 0;
            background: var(--orange-dim); color: var(--orange);
            border-radius: 999px; padding: 1px 7px; font-size: 10px;
            text-transform: uppercase; letter-spacing: .04em;
        }
        .llm-chip.session .llm-chip-badge { display: inline-block; }
        .llm-popover .llm-scope {
            color: var(--text-secondary); font-size: 11px; margin: 0 0 10px; line-height: 1.4;
        }
        .llm-popover .llm-reset {
            background: none; border: 1px solid var(--border); color: var(--text-secondary);
            border-radius: var(--radius-sm); padding: 4px 8px; cursor: pointer;
            font-family: 'JetBrains Mono', monospace; font-size: 11px; margin-top: 8px;
        }
        .llm-popover .llm-reset:hover { border-color: var(--text-secondary); color: var(--text-primary); }
        .llm-popover .llm-reset[hidden] { display: none; }

        .llm-popover {
            position: absolute; top: calc(100% + 8px); left: 0; z-index: 40;
            width: min(300px, 90vw);
            background: var(--bg-secondary); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 12px 14px;
            box-shadow: 0 8px 24px #000a;
        }
        .llm-popover[hidden] { display: none; }
        .llm-popover .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
        .llm-popover .field:last-of-type { margin-bottom: 0; }
        .llm-popover label { color: var(--text-secondary); font-size: 11px;
            text-transform: uppercase; letter-spacing: .04em; font-weight: 600; }
        .llm-popover select, .llm-popover input[type="text"] {
            background: var(--bg-tertiary); color: var(--text-primary);
            border: 1px solid var(--border); border-radius: var(--radius-sm);
            padding: 6px 8px; font-family: 'JetBrains Mono', monospace;
            font-size: 12px; outline: none; width: 100%;
        }
        .llm-popover select:focus, .llm-popover input:focus { border-color: var(--accent); }
        .llm-popover .llm-err {
            color: var(--orange); font-size: 11px; margin: 0 0 8px;
            font-family: 'JetBrains Mono', monospace; line-height: 1.35;
            word-break: break-word;
        }
        .llm-popover .llm-err:empty { display: none; }
        .llm-popover .llm-more {
            display: block; margin-top: 12px; padding-top: 10px;
            border-top: 1px solid var(--border-subtle);
            font-size: 12px; color: var(--cyan); text-decoration: none;
        }
        .llm-popover .llm-more:hover { text-decoration: underline; }

        .sidebar-toggle {
            background: none;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            width: 34px;
            height: 34px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            font-size: 16px;
        }
        .sidebar-toggle:hover { background: var(--bg-hover); color: var(--text-primary); }

        /* ── Main layout ── */
        .main-layout {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        /* ── Sidebar ── */
        .sidebar {
            width: var(--sidebar-width);
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            overflow-y: auto;
            transition: margin-left 0.3s ease;
        }

        .sidebar.collapsed {
            margin-left: calc(-1 * var(--sidebar-width));
        }

        .sidebar-section {
            padding: 16px;
            border-bottom: 1px solid var(--border-subtle);
        }

        .sidebar-section h3 {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 12px;
        }
        /* A folded sidebar section (CFOP-113): the heading is the summary, with
           the tool log's chevron; the heading's margin applies only when open. */
        details.sidebar-section > summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 6px; }
        details.sidebar-section > summary::-webkit-details-marker { display: none; }
        details.sidebar-section > summary h3 { margin-bottom: 0; }
        details.sidebar-section[open] > summary { margin-bottom: 12px; }
        details.sidebar-section > summary::before { content: '\25B6'; font-size: 10px; color: var(--text-muted); transition: transform 0.2s; }
        details.sidebar-section[open] > summary::before { transform: rotate(90deg); }

        .sidebar-field {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .sidebar-field:last-child { margin-bottom: 0; }

        .sidebar-field label {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .sidebar-field select, .sidebar-field input[type="number"] {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border);
            padding: 5px 8px;
            border-radius: var(--radius-sm);
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            outline: none;
        }

        .sidebar-field input[type="number"] { width: 60px; text-align: center; }
        .sidebar-field select { max-width: 140px; }

        .skill-list { list-style: none; }
        .skill-list li {
            padding: 8px 10px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 13px;
            font-family: 'JetBrains Mono', monospace;
            color: var(--text-secondary);
            transition: all 0.15s;
            margin-bottom: 2px;
        }
        .skill-list li:hover { background: var(--bg-hover); color: var(--accent); }
        .skill-list .skill-desc {
            display: block;
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        /* ── Chat area ── */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        /* ── Sweep panel ── */
        #sweep-panel {
            display: none;
            margin: 12px 20px 0;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--bg-secondary);
            overflow: hidden;
        }

        #sweep-panel.active { display: block; }

        .sweep-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 16px;
            cursor: pointer;
            transition: background 0.15s;
        }
        .sweep-header:hover { background: var(--bg-hover); }

        .sweep-severity {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 0.5px;
            padding: 2px 8px;
            border-radius: 4px;
        }
        .sweep-severity.critical { color: var(--red); background: var(--red-dim); }
        .sweep-severity.warning { color: var(--orange); background: var(--orange-dim); }
        .sweep-severity.info { color: var(--cyan); background: var(--cyan-dim); }

        .sweep-time { color: var(--text-muted); font-size: 12px; }

        .sweep-body {
            display: none;
            padding: 12px 16px;
            max-height: 300px;
            overflow-y: auto;
            border-top: 1px solid var(--border-subtle);
        }
        .sweep-body.open { display: block; }

        .sweep-finding {
            padding: 8px 0;
            font-size: 13px;
            border-bottom: 1px solid var(--border-subtle);
            line-height: 1.6;
            display: flex; gap: 8px; align-items: flex-start;
        }
        .sweep-finding:last-child { border-bottom: none; }
        .sweep-finding-body { flex: 1; min-width: 0; }
        /* Hand a finding to the chat (CFOP-115): a quiet chat glyph at the right
           of the row, the weight of the drawer's copy icons, not a button bar. */
        .sweep-finding .ask {
            flex-shrink: 0; background: none; border: 0; padding: 3px; margin-top: 2px; line-height: 0;
            color: var(--text-muted); cursor: pointer; border-radius: var(--radius-sm);
        }
        .sweep-finding .ask:hover { color: var(--accent); background: var(--bg-hover); }
        .sweep-finding .ask:focus-visible { outline: 2px solid var(--cyan); outline-offset: 1px; }
        .sweep-finding .ask svg { width: 15px; height: 15px; }

        .sweep-badge {
            display: inline-block;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            font-weight: 600;
            padding: 2px 6px;
            border-radius: 4px;
            margin-right: 8px;
            letter-spacing: 0.3px;
        }
        .sweep-badge.critical { background: var(--red-dim); color: var(--red); }
        .sweep-badge.warning { background: var(--orange-dim); color: var(--orange); }
        .sweep-badge.info { background: var(--cyan-dim); color: var(--cyan); }

        .finding-id { color: var(--text-muted); font-size: 11px; margin-right: 6px; font-family: 'JetBrains Mono', monospace; }

        .finding-status {
            display: inline-block;
            font-size: 10px;
            padding: 1px 6px;
            border-radius: 4px;
            margin-right: 6px;
            font-weight: 500;
        }
        .finding-status.resolved { background: var(--accent-dim); color: var(--accent); }
        .finding-status.acknowledged { background: var(--bg-tertiary); color: var(--text-muted); }
        .finding-status.investigating { background: var(--orange-dim); color: var(--orange); }
        .finding-status.false_positive { background: var(--bg-tertiary); color: var(--text-muted); }
        .finding-resolved { opacity: 0.5; }
        .finding-false_positive { opacity: 0.4; }

        .sweep-remediation { color: var(--accent); font-size: 12px; margin-top: 4px; padding-left: 4px; opacity: 0.8; }

        .sweep-meta {
            color: var(--text-muted);
            font-size: 11px;
            padding: 8px 16px;
            border-top: 1px solid var(--border-subtle);
            font-family: 'JetBrains Mono', monospace;
        }

        /* ── Questions panel ── */
        #questions-panel {
            display: none;
            margin: 12px 20px 0;
        }
        #questions-panel.active { display: block; }

        .question-card {
            background: var(--bg-secondary);
            padding: 14px 16px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            border-left: 3px solid var(--accent);
            margin-bottom: 10px;
        }
        .question-card h4 {
            color: var(--accent);
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
        }
        .question-card p { font-size: 14px; margin-bottom: 8px; }
        .question-card .context { font-size: 12px; color: var(--text-muted); margin-bottom: 10px; }

        .answer-input { display: flex; gap: 8px; }
        .answer-input input {
            flex: 1;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 8px 12px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            outline: none;
        }
        .answer-input input:focus { border-color: var(--accent); }
        .answer-input button {
            background: var(--accent);
            color: var(--bg-primary);
            border: none;
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-family: inherit;
            font-size: 13px;
            font-weight: 600;
            transition: opacity 0.15s;
        }
        .answer-input button:hover { opacity: 0.85; }

        /* ── The Palette layout (CFOP-719) ──
           cfassist's terminal convention (cfassist-go/internal/tui, CFOP-69),
           on the web. Top to bottom: a flat transcript, the input in a
           rounded box, the menu when one is open, one footer line. No
           bubbles: a question is "> text", a tool call is a row, an answer is
           text, and under each answer a dim line says what it cost. */
        #chat-container {
            flex: 1; min-height: 0; overflow-y: auto;
            padding: 18px 28px 6px;
            display: flex; flex-direction: column; gap: 2px;
            font-size: 13px; line-height: 1.65;
        }
        /* One column, capped and centred, for the transcript and everything
           under it: a 1700px line of monospace is not readable. */
        #chat-container > *, #thinking > *, #input-area > * {
            width: 100%; max-width: 900px; margin-left: auto; margin-right: auto; flex: none;
        }

        /* What cfassist's banner says, without the ASCII art: the rail has
           the brand. */
        /* Not ".banner": that is console.css's notice box, and these lines
           came out as two amber-edged cards. */
        .palette-banner { color: var(--text-muted); }
        .palette-banner .brand { color: var(--accent); font-weight: 700; }
        .palette-banner b { color: var(--text-primary); font-weight: 400; }
        .palette-rule { height: 1px; background: var(--border); margin-top: 10px; margin-bottom: 10px; }

        .message { margin-top: 12px; min-width: 0; }
        .message.user { display: flex; gap: 8px; align-items: baseline; }
        .message.user::before { content: '>'; flex: none; color: var(--accent); font-weight: 700; }
        .message-bubble { min-width: 0; word-wrap: break-word; }
        .message.user .message-bubble { white-space: pre-wrap; }
        .message.agent.error .message-bubble { color: #f87171; }
        /* What the turn cost, where cfassist prints it: after the answer. */
        .turn-stats { margin-top: 6px; color: var(--text-muted); font-size: 12px; }

        /* Tool rows: "-> name: args", then "<- name: result" or "!! name:
           error". A row still opens to the full arguments and result, which
           a terminal cannot do and the web can: that detail is the record of
           what ran. */
        .tool-log { margin-top: 4px; }
        .tool-card { padding-left: 26px; color: var(--text-muted); }
        .tool-card-header, .tool-card-result {
            display: flex; gap: 8px; align-items: baseline; width: 100%; min-width: 0;
            background: none; border: 0; padding: 0; color: inherit;
            font: inherit; line-height: inherit; text-align: left;
        }
        .tool-card-header { cursor: pointer; }
        .tool-card-header:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
        .tool-card .tc-status, .tool-card .tc-name { flex: none; color: #22b8d6; white-space: nowrap; }
        .tool-card .tc-iter { flex: none; color: var(--text-muted); font-size: 11px; }
        .tool-card .tc-summary, .tool-card .tc-outcome {
            min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .tool-card-header:hover .tc-summary { color: var(--text-secondary); }
        .tool-card-result .tc-arrow, .tool-card-result .tc-name { flex: none; color: #4ade80; white-space: nowrap; }
        .tool-card-result.error .tc-arrow, .tool-card-result.error .tc-name { color: #f87171; }
        /* A call with no result yet is the one the turn is waiting on. */
        .tool-card:not(.done) .tc-status { animation: palette-blink 1.2s ease-in-out infinite; }
        .tool-card-detail {
            display: none; margin: 4px 0 6px;
            border: 1px solid var(--border-subtle); border-radius: 6px; background: var(--bg-primary);
        }
        .tool-card.expanded .tool-card-detail { display: block; }

        #thinking { display: none; flex: none; padding: 2px 28px 0; font-size: 13px; }
        #thinking.active { display: block; }
        #thinking .thinking-text {
            display: block; padding-left: 14px; color: var(--orange);
            animation: palette-blink 1.2s ease-in-out infinite;
        }

        /* The input, in its box. Green at rest. While the model works the
           border gives way to a scanner in amber, the colour cfassist's box
           turns when busy: one glowing eye with a fading tail, circling
           clockwise over a dim track (CFOP-721). It reads from across the
           room, which a word in a status line does not. */
        #input-area { flex: none; display: flex; flex-direction: column; padding: 14px 28px 12px; }
        .palette-box {
            position: relative; display: flex; align-items: center; gap: 8px;
            padding: 6px 6px 6px 14px;
            border: 1px solid #1f8f47; border-radius: 12px;
        }
        .palette-box:focus-within { border-color: var(--accent); }
        .palette-box.busy, .palette-box.busy:focus-within { border-color: transparent; }
        /* What the session is attached to, written into the top edge. The
           background is the page's, so the border does not run through it. */
        .palette-box .box-title {
            position: absolute; z-index: 1; top: -9px; left: 14px; max-width: calc(100% - 60px);
            padding: 0 8px; background: var(--bg-primary);
            font-size: 12px; line-height: 16px; color: var(--text-secondary);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .palette-box .prompt { flex: none; color: var(--accent); font-weight: 700; }
        /* Every length in the scanner is a share of the border (each moving
           rect has pathLength="100"), so the narrow Ask panel gets the full
           page's proportions. The tail is dashes of decreasing length, each
           faint, stacked so the light builds toward the eye. They all start
           at the same point of the outline, and that point has to lead. A
           rect's outline runs clockwise, so the dashes are run backward
           along it and the overlay is mirrored, which is clockwise again. */
        .palette-box .scan {
            display: none; position: absolute; inset: 0; width: 100%; height: 100%;
            overflow: visible; pointer-events: none; color: var(--orange);
            transform: scaleX(-1);
            filter: drop-shadow(0 0 3px currentColor) drop-shadow(0 0 10px currentColor);
        }
        .palette-box.busy .scan { display: block; }
        .palette-box .scan rect { fill: none; stroke: currentColor; stroke-width: 1.5; }
        .palette-box .scan .track, .palette-box .scan .tail { opacity: .2; }
        .palette-box .scan .eye { stroke-width: 2.5; stroke-linecap: round; }
        .palette-box .scan .tail, .palette-box .scan .eye { animation: palette-scan 2.8s linear infinite; }
        /* 100 is the whole border: one lap, so the loop has no seam. */
        @keyframes palette-scan { to { stroke-dashoffset: 100; } }
        @keyframes palette-blink { 50% { opacity: .3; } }
        /* Still, for anyone who asked for less motion: no eye and no tail,
           the track at full strength. A solid amber border is the signal. */
        @media (prefers-reduced-motion: reduce) {
            .palette-box .scan .tail, .palette-box .scan .eye { display: none; }
            .palette-box .scan .track { opacity: 1; }
            #thinking .thinking-text, .tool-card:not(.done) .tc-status { animation: none; }
        }
        #message-input {
            flex: 1; min-width: 0; min-height: 44px; padding: 11px 0;
            border: 0; outline: 0; resize: none; background: transparent;
            color: var(--text-primary); font-size: 14px; line-height: 22px;
        }
        /* The box shows focus (its border); a second ring inside it is noise. */
        #message-input:focus-visible { outline: 0; }
        #message-input::placeholder { color: var(--text-muted); }
        /* Send and stop are the icons alone: an up-arrow, a square. */
        #send-button {
            flex: none; width: 44px; height: 44px; display: grid; place-items: center;
            border: 0; border-radius: 8px; background: transparent; color: var(--accent); cursor: pointer;
        }
        #send-button:hover:not(:disabled) { background: var(--bg-tertiary); }
        #send-button:focus-visible { outline: 2px solid var(--cyan); outline-offset: 1px; }
        #send-button:disabled { color: var(--text-dim); cursor: default; }
        #send-button svg { width: 24px; height: 24px; }
        #send-button .ic-stop { display: none; width: 22px; height: 22px; }
        #send-button.stop { color: var(--orange); }
        #send-button.stop .ic-send { display: none; }
        #send-button.stop .ic-stop { display: block; }

        /* The menu opens under the input, as cfassist's does, and takes its
           room from the transcript. */
        #slash-menu { display: none; margin-top: 6px; max-height: 232px; overflow-y: auto; }
        #slash-menu.active { display: block; }
        .slash-item {
            display: flex; align-items: baseline; gap: 12px; min-height: 36px;
            padding: 7px 10px; border-radius: 6px; cursor: pointer; font-size: 12.5px;
        }
        .slash-item:hover, .slash-item.selected { background: #1e2b3c; }
        /* One column for the commands, so the descriptions line up. The
           resets undo console.css's .cmd, which is a copyable pill. */
        .slash-item .cmd {
            flex: 0 0 min(48%, 420px); min-width: 0; color: var(--text-primary);
            background: none; border: 0; border-radius: 0; padding: 0; user-select: auto; font-size: inherit;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .slash-item .desc { min-width: 0; color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        /* One footer line. Left: whatever hint is true right now. Right: the
           model, the context gauge, the last turn. It wraps when narrow. */
        .palette-footer {
            display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
            gap: 4px 16px; padding: 8px 6px 0; font-size: 12px; color: var(--text-muted);
        }
        .palette-footer .footer-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
        /* The health poll's dot and label, shown only when it has failed. */
        .palette-footer .conn { display: none; align-items: center; color: #f87171; }
        .palette-footer .conn:has(.status-dot.disconnected) { display: inline-flex; }
        .palette-footer .footer-status {
            display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
            margin-left: auto; color: var(--text-secondary);
        }
        .palette-footer .footer-status > * + *::before { content: '\00b7'; margin-right: 8px; color: var(--text-dim); }
        .palette-footer .ctx { display: inline-flex; align-items: center; gap: 6px; }
        .palette-footer .ctx-bar { display: inline-block; width: 48px; height: 4px; border-radius: 2px; background: var(--border); overflow: hidden; }
        .palette-footer .ctx-bar i { display: block; height: 4px; border-radius: 2px; background: var(--accent); }
        /* Past 80% the next long answer may not fit. */
        .palette-footer .ctx.high .ctx-bar i { background: var(--orange); }
        /* The per-session model picker (CFOP-19, CFOP-417) lives here now:
           the same chip and popover, drawn as footer text, opening upward. */
        .palette-footer .llm-chip {
            max-width: 46vw; min-height: 28px; padding: 2px 4px;
            background: transparent; border: 0; color: var(--text-secondary); font-size: 12px;
        }
        .palette-footer .llm-chip:hover:not(:disabled) { color: var(--text-primary); }
        .palette-footer .llm-popover { top: auto; bottom: calc(100% + 8px); left: auto; right: 0; }

        header .session-stats {
            min-width: 0; font-size: 12px; color: var(--text-muted);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        header #new-chat-btn { margin-left: auto; flex: none; }

        /* In the Ask panel the same layout, at the panel's width. */
        html.embed #chat-container { padding: 12px 14px 4px; font-size: 12.5px; }
        html.embed #thinking { padding: 2px 14px 0; }
        html.embed #input-area { padding: 15px 12px 10px; }
        html.embed .tool-card { padding-left: 18px; }
        html.embed .slash-item .cmd { flex-basis: 54%; }
        html.embed .palette-footer { font-size: 11px; }
        html.embed header .session-stats { display: none; }

        .message-bubble code {
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            background: var(--bg-tertiary);
            padding: 2px 6px;
            border-radius: 4px;
        }

        .message-bubble pre {
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 12px;
            margin: 8px 0;
            overflow-x: auto;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            line-height: 1.5;
        }

        .message-bubble pre code {
            background: none;
            padding: 0;
        }

        .message-bubble h1, .message-bubble h2, .message-bubble h3,
        .message-bubble h4, .message-bubble h5, .message-bubble h6 {
            color: var(--text-primary);
            margin: 16px 0 8px;
            line-height: 1.3;
        }
        .message-bubble h1 { font-size: 20px; }
        .message-bubble h2 { font-size: 17px; }
        .message-bubble h3 { font-size: 15px; }
        .message-bubble h4 { font-size: 14px; color: var(--text-secondary); }
        .message-bubble h1:first-child, .message-bubble h2:first-child,
        .message-bubble h3:first-child { margin-top: 0; }

        .message-bubble ul, .message-bubble ol {
            padding-left: 20px;
            margin: 8px 0;
        }
        .message-bubble li { margin-bottom: 4px; }
        .message-bubble li > ul, .message-bubble li > ol { margin: 4px 0; }

        .message-bubble hr {
            border: none;
            border-top: 1px solid var(--border);
            margin: 12px 0;
        }

        .message-bubble table {
            border-collapse: collapse;
            margin: 8px 0;
            font-size: 13px;
            width: 100%;
        }
        .message-bubble th, .message-bubble td {
            border: 1px solid var(--border);
            padding: 6px 10px;
            text-align: left;
        }
        .message-bubble th {
            background: var(--bg-tertiary);
            font-weight: 600;
            color: var(--text-secondary);
        }

        .message-bubble blockquote {
            border-left: 3px solid var(--accent-dim);
            margin: 8px 0;
            padding: 4px 12px;
            color: var(--text-secondary);
        }

        .message-bubble a {
            color: var(--cyan);
            text-decoration: none;
        }
        .message-bubble a:hover { text-decoration: underline; }

        .message-bubble p { margin: 8px 0; }
        .message-bubble p:first-child { margin-top: 0; }
        .message-bubble p:last-child { margin-bottom: 0; }

        .message-bubble strong { color: var(--text-primary); }

        /* A provider rotation inside one chat (CFOP-112): the chip's choice
           was skipped, or a rung failed mid-loop and the next one took over. */
        .tool-fallback {
            color: var(--text-muted);
            font-size: 11px;
            padding: 4px 8px;
            margin: 4px 0;
            border-left: 2px solid var(--accent);
            white-space: pre-wrap;
            word-break: break-word;
        }

        /* A host write waiting for the admin (CFOP-442). Outside the
           collapsible tool log on purpose: the turn is paused on it. */
        .host-confirm {
            margin: 10px 0;
            padding: 12px 14px;
            border: 1px solid var(--orange-dim);
            border-left: 3px solid var(--orange);
            border-radius: var(--radius-sm);
            background: var(--bg-secondary);
            max-width: 760px;
        }
        .host-confirm .hc-title { color: var(--orange); font-size: 12px; margin-bottom: 6px; }
        .host-confirm .hc-host { color: var(--text-secondary); font-size: 12px; }
        .host-confirm .hc-command {
            margin: 6px 0;
            padding: 8px 10px;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 13px;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .host-confirm .hc-reason { color: var(--text-muted); font-size: 11px; margin-bottom: 8px; }
        .host-confirm .hc-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .host-confirm button {
            font: inherit; font-size: 12px;
            padding: 5px 14px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: var(--bg-tertiary);
            color: var(--text-primary);
            cursor: pointer;
        }
        .host-confirm button.hc-run { border-color: var(--orange); color: var(--orange); }
        .host-confirm button:disabled { opacity: 0.5; cursor: default; }
        .host-confirm .hc-outcome { color: var(--text-secondary); font-size: 12px; }
        .host-confirm.settled { border-left-color: var(--border); }

        .tc-detail-section {
            padding: 8px 12px;
        }

        .tc-detail-section + .tc-detail-section {
            border-top: 1px solid var(--border-subtle);
        }

        .tc-detail-label {
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .tc-detail-content {
            white-space: pre-wrap;
            word-break: break-word;
            max-height: 300px;
            overflow-y: auto;
            color: var(--text-secondary);
        }

        .tc-detail-content.tc-args { color: var(--text-secondary); }
        .tc-detail-content.tc-result { color: var(--accent); opacity: 0.8; }
        .tc-detail-content.tc-error { color: var(--red); }

        /* ── Feedback buttons ── */
        .feedback-buttons {
            margin-top: 8px;
            display: flex;
            gap: 6px;
        }
        .feedback-buttons button {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 4px 12px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 12px;
            transition: all 0.15s;
        }
        .feedback-buttons button:hover { background: var(--bg-hover); color: var(--text-primary); }
        .feedback-buttons button.selected { background: var(--bg-hover); color: var(--accent); border-color: var(--accent); }
        .feedback-buttons button:disabled { opacity: 0.3; cursor: default; }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent);
            display: inline-block;
            margin-right: 4px;
        }
        .status-dot.disconnected { background: var(--red); }

        /* Toasts — the one place a failed background request gets to say so */
        #toasts { position: fixed; bottom: 40px; right: 16px; display: flex; flex-direction: column; gap: 6px; z-index: 60; }
        .toast { background: var(--bg-tertiary); border: 1px solid var(--border); border-left: 3px solid var(--accent);
                 padding: 8px 12px; border-radius: 4px; font-size: 12px; max-width: 360px; transition: opacity .2s; }
        .toast.ok { border-left-color: var(--accent); }
        .toast.err { border-left-color: var(--red); }
        .answer-error { color: var(--red); font-size: 12px; margin-top: 4px; }

        /* ── Scrollbar ── */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #444; }
    </style>
</head>
<body>
    <header>
        <button class="sidebar-toggle" onclick="toggleSidebar()" aria-label="Chat history and skills" title="Chat history and skills">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                <line x1="2" y1="4" x2="14" y2="4"/><line x1="2" y1="8" x2="14" y2="8"/><line x1="2" y1="12" x2="14" y2="12"/>
            </svg>
        </button>
        <h1 class="page-title">Console</h1>
        <!-- What this session has cost so far (CFOP-719): turns, tokens in
             and out, time. Filled by renderSessionStats(). -->
        <span class="session-stats" id="session-stats" title="This session so far: turns, tokens sent and received, time spent answering."></span>
        <button type="button" class="chip" id="new-chat-btn" onclick="startNewChat()" title="Start a new chat. This one stays in the history.">New chat</button>
        <!-- The rail: section nav, status, identity and logout — see ui/nav.js -->
        <div id="cfop-nav"></div>
    </header>

    <div class="main-layout">
        <!-- Collapsed by default (CFOP-113): the chat is the page; the toggle in
             the header brings the sidebar back. Not remembered across reloads. -->
        <aside class="sidebar collapsed" id="sidebar">
            <!-- Folded by default (CFOP-113): the list is long and the slash menu
                 is how a skill is actually reached; this is the reference copy.
                 A <details>, so the fold is keyboard-reachable for free. -->
            <details class="sidebar-section" id="skills-section">
                <summary><h3>Skills</h3></summary>
                <!-- Filled by renderSkillList() from GET /api/skills — the same
                     list the slash menu filters. No entries belong here. -->
                <ul class="skill-list" id="skill-list"></ul>
            </details>
            <!-- Foldable like Skills, but open by default (CFOP-113): recent chats
                 are what you come back for. + New lives in the summary; its click
                 is stopped so it does not also fold the section. -->
            <details class="sidebar-section" id="history-section" open>
                <summary><h3 style="flex:1;display:flex;justify-content:space-between;align-items:center;">
                    Chat History
                    <button onclick="event.preventDefault();event.stopPropagation();startNewChat()" title="Start a new chat. This one stays in the history below." style="background:var(--accent);color:var(--bg-primary);border:none;padding:3px 10px;border-radius:4px;font-size:10px;font-weight:600;cursor:pointer;">+ New</button>
                </h3></summary>
                <ul class="skill-list" id="session-list" style="margin-top:8px;max-height:200px;overflow-y:auto;"></ul>
            </details>
        </aside>

        <div class="chat-area">
            <div id="questions-panel"></div>
            <div id="sweep-panel"></div>

            <!-- Filled by showWelcome() and the turns that follow. -->
            <div id="chat-container"></div>

            <div id="thinking"><span class="thinking-text">thinking…</span></div>

            <!-- The Palette (CFOP-719): the input in its box, the menu under
                 it, one footer line. -->
            <div id="input-area">
                <div class="palette-box" id="palette-box">
                    <!-- What the session is attached to, in the box's top edge. -->
                    <span class="box-title" id="box-title" hidden></span>
                    <!-- The border while the model works: a dim track, a tail
                         of ever shorter dashes, and the eye. A dash and its
                         gap are percentages of the border and add up to 100. -->
                    <svg class="scan" aria-hidden="true" width="100%" height="100%">
                        <rect class="track" width="100%" height="100%" rx="12"></rect>
                        <rect class="tail" width="100%" height="100%" rx="12" pathLength="100" stroke-dasharray="14 86"></rect>
                        <rect class="tail" width="100%" height="100%" rx="12" pathLength="100" stroke-dasharray="11.76 88.24"></rect>
                        <rect class="tail" width="100%" height="100%" rx="12" pathLength="100" stroke-dasharray="9.72 90.28"></rect>
                        <rect class="tail" width="100%" height="100%" rx="12" pathLength="100" stroke-dasharray="7.88 92.12"></rect>
                        <rect class="tail" width="100%" height="100%" rx="12" pathLength="100" stroke-dasharray="6.22 93.78"></rect>
                        <rect class="tail" width="100%" height="100%" rx="12" pathLength="100" stroke-dasharray="4.76 95.24"></rect>
                        <rect class="tail" width="100%" height="100%" rx="12" pathLength="100" stroke-dasharray="3.5 96.5"></rect>
                        <rect class="tail" width="100%" height="100%" rx="12" pathLength="100" stroke-dasharray="2.43 97.57"></rect>
                        <rect class="tail" width="100%" height="100%" rx="12" pathLength="100" stroke-dasharray="1.56 98.44"></rect>
                        <rect class="tail" width="100%" height="100%" rx="12" pathLength="100" stroke-dasharray="0.88 99.12"></rect>
                        <rect class="tail" width="100%" height="100%" rx="12" pathLength="100" stroke-dasharray="0.39 99.61"></rect>
                        <rect class="tail" width="100%" height="100%" rx="12" pathLength="100" stroke-dasharray="0.1 99.9"></rect>
                        <rect class="eye" width="100%" height="100%" rx="12" pathLength="100" stroke-dasharray="1.6 98.4"></rect>
                    </svg>
                    <span class="prompt" aria-hidden="true">&gt;</span>
                    <!-- No autofocus attribute: the script focuses this on the full
                         page and leaves it alone in the Ask panel, where the host
                         page decides (CFOP-711). A same-origin frame's autofocus
                         takes focus from the page around it. -->
                    <textarea id="message-input" rows="1" aria-label="Ask about your infrastructure" placeholder="Ask about your infrastructure"></textarea>
                    <!-- Send, and Stop while a turn runs: the icons alone.
                         setChatInFlight() swaps them and the label. -->
                    <button id="send-button" type="button" aria-label="Send" title="Send">
                        <svg class="ic-send" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5.5 11.5L12 5l6.5 6.5"/></svg>
                        <svg class="ic-stop" aria-hidden="true" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2.5" fill="currentColor"/></svg>
                    </button>
                </div>
                <div id="slash-menu"></div>
                <div class="palette-footer">
                    <span class="footer-left">
                        <!-- The health poll's verdict; drawn only when it failed. -->
                        <span class="conn"><span class="status-dot" id="connection-status"></span><span id="connection-label">Connected</span></span>
                        <span id="footer-hints"></span>
                    </span>
                    <span class="footer-status">
                    <!-- The LLM this chat SESSION runs on (CFOP-19, per session since
                         CFOP-417). A change here is stored on the session row and ends
                         with the session; the defaults — the chat and handed-rows seats,
                         the global selection — are set at /admin?tab=llm (CFOP-15/122). -->
                    <div class="llm-switcher" id="llm-switcher">
                        <button type="button" class="llm-chip" id="llm-chip"
                                aria-haspopup="dialog" aria-expanded="false" aria-controls="llm-popover"
                                disabled title="Loading LLM…">
                            <span class="llm-chip-label" id="llm-chip-label">…</span>
                            <span class="llm-chip-badge" id="llm-chip-badge"></span>
                            <span class="llm-chip-caret" aria-hidden="true">▾</span>
                        </button>
                        <div class="llm-popover" id="llm-popover" role="dialog" aria-label="Select LLM for this session" hidden>
                            <p class="llm-scope" id="llm-scope">Applies to this chat session only.</p>
                            <div class="field">
                                <label for="llm-backend">Backend</label>
                                <select id="llm-backend"></select>
                            </div>
                            <div class="field">
                                <label for="llm-model">Model</label>
                                <select id="llm-model"></select>
                                <input type="text" id="llm-model-custom" placeholder="model id" hidden autocomplete="off">
                            </div>
                            <p class="llm-err" id="llm-model-err"></p>
                            <button type="button" class="llm-reset" id="llm-reset" hidden title="Drop this session's own model and go back to the seat's default, which is set in Admin.">Back to default</button>
                            <a class="llm-more" href="/admin?tab=llm">Defaults and seats in Admin →</a>
                        </div>
                    </div>
                        <span class="ctx" id="ctx-gauge" hidden><span id="ctx-text"></span><span class="ctx-bar" aria-hidden="true"><i id="ctx-fill"></i></span></span>
                        <span id="turn-stats"></span>
                    </span>
                </div>
            </div>
        </div>
    </div>

    <div id="toasts"></div>

    <script>
        let chatHistory = [];
        let chatSessionId = null;  // Current DB session ID
        // The seat the current session runs on (CFOP-417): {seat, backend,
        // model, source} as the server stored it on the session row. Sent
        // with every turn, shown in the chip; never written to the global
        // selection. null until a session exists.
        let chatLlm = null;
        let inFlightChatId = null;  // chat_id of the in-flight /api/chat request, if any

        // Inside the Ask panel's frame (CFOP-711)? The block in <head> marked it.
        function embedded() {
            const cl = document.documentElement && document.documentElement.classList;
            return !!(cl && cl.contains('embed'));
        }
        // A handed row is consumed once its question is on its way: the
        // row comes off the address so a reload does not ask twice. embed=1
        // stays. It is not part of the hand-off, and without it a reload of
        // the frame loads the full page into the panel: a rail, the status
        // timers and an Ask button of its own, 480px wide (Bugbot on #375).
        function consumeHandoff() {
            history.replaceState(null, '', location.pathname + (embedded() ? '?embed=1' : '') + location.hash);
        }

        // ── The Palette (CFOP-719): what a turn cost, and the footer ──
        // A turn's stats, from a `done` event or a stored assistant message
        // (the same keys on both, CFOP-718). null means the turn did not
        // report it, and nothing is drawn for it: absent is not zero.
        function turnStats(src) {
            const u = (src && typeof src.usage === 'object' && src.usage) || {};
            const num = v => (typeof v === 'number' && isFinite(v) && v >= 0) ? v : null;
            return {
                input: num(u.input_tokens), output: num(u.output_tokens),
                prompt: num(u.last_prompt_tokens), window: num(u.context_window),
                seconds: num(src && src.duration_s), tools: num(src && src.tool_calls),
            };
        }
        function fmtTokens(n) { return Math.round(n).toLocaleString('en-US'); }
        // cfassist's gauge: "12.3k/32k".
        function fmtK(n, digits) { return (n / 1000).toFixed(digits) + 'k'; }
        // "1,840↑ 412↓ · 9.6s · 3 tools" under an answer; "1,840↑ 412↓ 9.6s
        // 3t" in the footer, which is cfassist's own shape. '' when the turn
        // reported nothing.
        function statsText(s, compact) {
            if (!s) return '';
            const parts = [];
            // Each side on its own: a turn that reported what it sent and not
            // what it got back prints "900↑", not "900↑ 0↓". The zero would
            // be the same claim this function exists not to make (agent
            // review on #376).
            const tokens = [s.input !== null ? fmtTokens(s.input) + '↑' : '',
                            s.output !== null ? fmtTokens(s.output) + '↓' : ''].filter(Boolean).join(' ');
            if (tokens) parts.push(tokens);
            if (s.seconds !== null) parts.push(s.seconds.toFixed(1) + 's');
            if (s.tools) parts.push(compact ? s.tools + 't' : s.tools + (s.tools === 1 ? ' tool' : ' tools'));
            return parts.join(compact ? ' ' : ' · ');
        }

        // The session so far, and its last finished turn. Rebuilt from the
        // stored messages on a reload, so the header and the footer say the
        // same after one as before it.
        let SESSION_TOTALS = {turns: 0, input: 0, output: 0, seconds: 0};
        let LAST_TURN = null;
        function resetTurnStats() {
            SESSION_TOTALS = {turns: 0, input: 0, output: 0, seconds: 0};
            LAST_TURN = null;
            renderSessionStats(); renderFooter();
        }
        function recordTurn(s) {
            SESSION_TOTALS.turns += 1;
            SESSION_TOTALS.input += s.input || 0;
            SESSION_TOTALS.output += s.output || 0;
            SESSION_TOTALS.seconds += s.seconds || 0;
            LAST_TURN = s;
            renderSessionStats(); renderFooter();
        }
        function renderSessionStats() {
            const el = document.getElementById('session-stats');
            if (!el) return;
            const t = SESSION_TOTALS, parts = [];
            if (chatSessionId) parts.push('session #' + chatSessionId);
            if (t.turns) {
                parts.push(t.turns + (t.turns === 1 ? ' turn' : ' turns'));
                // A side nothing was ever reported for is left out, not shown as 0.
                const tokens = [t.input ? fmtTokens(t.input) + '↑' : '',
                                t.output ? fmtTokens(t.output) + '↓' : ''].filter(Boolean).join(' ');
                if (tokens) parts.push(tokens);
                if (t.seconds) parts.push(t.seconds.toFixed(1) + 's');
            }
            el.textContent = parts.join(' · ');
        }

        // A turn is on its way from the moment Send is pressed (SENDING),
        // not from when the server answers with its id.
        function chatBusy() { return !!(inFlightChatId || SENDING); }

        // The footer's left half: only what is true right now. A hint that
        // changes with state is one that gets read (cfassist, CFOP-69).
        function footerHints() {
            const narrow = embedded();
            // "esc stop" only once there is a turn to stop. Between Send and
            // the server's answer the box is already busy, but there is no
            // chat id yet and Escape has nothing to act on; the hint said it
            // did (agent review on #376).
            // The menu first, the order the key handler uses: the composer
            // stays editable during a turn, so "/" can open the menu while
            // one runs, and Escape then closes the menu, not the turn. The
            // footer said "esc stop" through that (Bugbot on #376).
            const menu = document.getElementById('slash-menu');
            if (menu && menu.classList.contains('active')) {
                return narrow ? '↑↓ choose · tab accept · esc close'
                              : '↑↓ choose · tab accept · enter run · esc close';
            }
            if (inFlightChatId) return narrow ? 'esc stop' : 'esc stop · typing is kept';
            if (SENDING) return narrow ? 'sending…' : 'sending… · typing is kept';
            return narrow ? '/ skills' : '/ skills · enter send · shift+enter new line';
        }
        // Hints, the context gauge and the last turn. The gauge needs both
        // numbers: what the context holds and a window somebody measured. A
        // hosted model reports no window, so it gets no gauge, not a guess.
        function renderFooter() {
            const hints = document.getElementById('footer-hints');
            if (hints) hints.textContent = footerHints();
            const s = LAST_TURN;
            const gauge = document.getElementById('ctx-gauge');
            if (gauge) {
                const known = !!(s && s.prompt && s.window);
                gauge.hidden = !known;
                if (known) {
                    const pct = Math.min(100, Math.round(100 * s.prompt / s.window));
                    document.getElementById('ctx-text').textContent = `${fmtK(s.prompt, 1)}/${fmtK(s.window, 0)}`;
                    document.getElementById('ctx-fill').style.width = pct + '%';
                    gauge.title = `The conversation fills ${pct}% of this model's context window.`;
                    if (pct > 80) gauge.classList.add('high'); else gauge.classList.remove('high');
                }
            }
            const turn = document.getElementById('turn-stats');
            if (turn) {
                const text = statsText(s, true);
                turn.textContent = text;
                turn.hidden = !text;
                turn.title = text ? 'The last turn: tokens sent, tokens received, time, tool calls.' : '';
            }
        }
        // What the session is attached to, in the box's top edge, the way
        // cfassist names an attachment. '' takes it away.
        function setBoxTitle(text) {
            const el = document.getElementById('box-title');
            if (!el) return;
            const t = String(text || '').replace(/\s+/g, ' ').trim();
            el.textContent = t;
            el.title = t;
            el.hidden = !t;
        }

        // Send becomes Stop while a turn is streaming, and the box shows it:
        // the scanner runs from the moment the question leaves. The button is
        // two icons, so the state goes on its class and its label, not its
        // text.
        function syncBusy() {
            const busy = chatBusy();
            const box = document.getElementById('palette-box');
            if (box) { if (busy) box.classList.add('busy'); else box.classList.remove('busy'); }
            renderFooter();
        }
        function setChatInFlight(chatId) {
            inFlightChatId = chatId;
            const btn = document.getElementById('send-button');
            btn.disabled = false;
            if (chatId) {
                btn.classList.add('stop');
                btn.setAttribute('aria-label', 'Stop');
                btn.title = 'Stop (Esc)';
            } else {
                btn.classList.remove('stop');
                btn.setAttribute('aria-label', 'Send');
                btn.title = 'Send';
            }
            syncBusy();
        }

        // ── Chat session persistence (fire-and-forget, never blocks UI) ──
        // Fire-and-forget by design: the chat works without a saved session, so
        // an ordinary page load swallows a failure here. Only a handoff (CFOP-109)
        // has something riding on the session existing, and it passes `fail`.
        //
        // `seat` is where the session starts (CFOP-417): 'chat' (the
        // default) for a plain session, 'handoff' for an Ask-console row.
        // The server resolves the seat and stores it on the row.
        function createChatSession(then, fail, seat) {
            fetch('/api/chat-sessions', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({seat: seat || 'chat'})
            }).then(r => r.json()).then(data => {
                if (data.id) {
                    chatSessionId = data.id;
                    renderSessionStats();
                    setChatLlm(data.llm || null);
                    localStorage.setItem('cfoperator_chat_session', chatSessionId);
                    loadChatSessions();
                    if (then) then();
                } else if (fail) {
                    fail();
                }
            }).catch(() => { if (fail) fail(); });
        }

        // Every hand-off is a verification pass (CFOP-124). The question says
        // so, and sendMessage({mode: 'verify'}) has the agent withhold its
        // mutating tools for that one turn — a "check whether this is still
        // the case" ask once had the sweep's own "Proposed remediation: sudo
        // systemctl restart …" executed under it.
        //
        // The clause has to say that it covers this message only (CFOP-160).
        // mode: 'verify' rides on the hand-off turn alone, but the text of it
        // stays in the history for the rest of the session, and the model
        // reads it as a standing order: in session 35 an admin asked for the
        // patch three turns later and was told the agent could not, under a
        // policy that had stopped applying two turns earlier.
        const VERIFY_ONLY = 'For this first pass, run read-only checks only — do not restart, '
            + 'edit, resolve or approve anything. Say what you found and what should happen next. '
            + 'That applies to this message only: if I then ask you to act, use the tools you have.';

        // A row handed over from /remediations (CFOP-109). The question is
        // composed from the row itself so the operator never types the number,
        // and it asks for the checks to be *run*, not listed — the failure mode
        // that made the row in the first place.
        function remediationQuestion(r) {
            const p = r.payload || {};
            const head = `Remediation #${r.id} — status ${r.status}, class ${r.remediation_class}, risk ${r.risk}`
                + (r.host_id ? `, host ${r.host_id}` : '')
                + (r.investigation_id ? `, from investigation #${r.investigation_id}` : '') + '.';
            return [
                head,
                p.recommendation ? `Recommendation: ${p.recommendation}` : '',
                (p.steps && p.steps.length) ? 'Proposed steps: ' + p.steps.map((s, i) => `${i + 1}. ${s}`).join(' ') : '',
                'Check whether this is still real — run the checks yourself rather than listing them — '
                + 'and say whether it should be approved, resolved or rejected, with the evidence.',
                VERIFY_ONLY,
            ].filter(Boolean).join('\n');
        }

        function askAboutRemediation(id) {
            fetch(`/api/remediations/${id}`)
                .then(r => r.ok ? r.json() : Promise.reject(new Error(String(r.status))))
                .then(row => {
                    document.getElementById('message-input').value = remediationQuestion(row);
                    const p = row.payload || {};
                    setBoxTitle(`remediation #${id} \u00b7 ${p.title || p.recommendation || row.remediation_class || ''}`);
                    sendMessage({mode: 'verify'});
                    // Consumed only once the question is actually on its way: a
                    // reload must not ask twice, but a failure above leaves the
                    // URL intact so a reload retries instead of landing on an
                    // empty chat with the intent gone.
                    consumeHandoff();
                })
                .catch(() => toast(`remediation #${id} could not be loaded — reload to retry`, 'err'));
        }

        // The investigation handoff (CFOP-113) — the same shape as the
        // remediation one: what the drawer showed, then a question that asks
        // for the checks to be run rather than recited. findings.fix is
        // agent.py's structured fix; every field is optional on older rows.
        function investigationQuestion(r) {
            const f = r.findings || {};
            const fix = (f.fix && typeof f.fix === 'object') ? f.fix : {};
            const steps = Array.isArray(fix.steps) ? fix.steps : [];
            const v = (fix.verify && typeof fix.verify === 'object') ? fix.verify : {};
            const head = `Investigation #${r.id} — outcome ${r.outcome}`
                + (r.host_id ? `, host ${r.host_id}` : '')
                + (f.remediation_id ? `, remediation #${f.remediation_id}` : '')
                + (f.provider ? `, by ${f.provider}` : '') + '.';
            return [
                head,
                r.trigger ? `Trigger: ${r.trigger}` : '',
                f.recommendation ? `Recommendation: ${f.recommendation}` : '',
                steps.length ? 'Proposed steps: ' + steps.map((x, i) => `${i + 1}. ${x}`).join(' ') : '',
                v.command ? `Verify: ${v.command}` + (v.expect ? ` (expect: ${v.expect})` : '') : '',
                'Check whether this is still the case — run the checks yourself rather than listing them — '
                + 'and say what should happen next (resolve, act, or keep monitoring), with the evidence.',
                VERIFY_ONLY,
            ].filter(Boolean).join('\n');
        }

        function askAboutInvestigation(id) {
            fetch(`/api/investigations/${id}`)
                .then(r => r.ok ? r.json() : Promise.reject(new Error(String(r.status))))
                .then(row => {
                    document.getElementById('message-input').value = investigationQuestion(row);
                    setBoxTitle(`#${id} \u00b7 ${row.trigger || ''}`);
                    sendMessage({mode: 'verify'});
                    // Same rule as askAboutRemediation: consumed only once sent.
                    consumeHandoff();
                })
                .catch(() => toast(`investigation #${id} could not be loaded — reload to retry`, 'err'));
        }

        function saveMessage(role, content, backend, model) {
            if (!chatSessionId) return Promise.resolve();
            // The caller waits on this for the user row: the worker appends
            // tool calls as soon as the turn starts, and a fire-and-forget
            // save can land after them (CFOP-125).
            return fetch(`/api/chat-sessions/${chatSessionId}/messages`, {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({role, content, backend: backend || '', model: model || ''})
            }).catch(() => {});
        }

        function loadChatSession(id) {
            fetch(`/api/chat-sessions/${id}`).then(r => r.json()).then(data => {
                if (data.error) return;
                // Clear current chat
                chatHistory = [];
                const container = document.getElementById('chat-container');
                container.innerHTML = '';
                chatSessionId = data.id;
                setChatLlm(data.llm || null);  // a reopened session keeps its seat
                localStorage.setItem('cfoperator_chat_session', chatSessionId);

                // Replay messages. Tool rows are drawn the way the live view
                // drew them, and kept out of chatHistory: that array is
                // re-sent to the model, and a tool row is not a turn.
                currentToolLog = null;
                currentToolCard = null;
                toolCallCount = 0;
                // The totals and the footer are rebuilt from what each
                // stored reply says it cost (CFOP-718). What the session
                // was attached to is not stored, so the box's edge is bare.
                resetTurnStats();
                setBoxTitle('');
                for (const msg of (data.messages || [])) {
                    if (msg.role === 'tool_call') {
                        addToolCall(msg.tool || '', msg.args != null ? msg.args : msg.content);
                    } else if (msg.role === 'tool_result') {
                        addToolResult(msg.tool || '', msg.result != null ? msg.result : msg.content);
                    } else if (msg.stopped) {
                        // A cancelled turn. The live Stop button draws this
                        // and does not put it in chatHistory; reload matches.
                        currentToolLog = null; currentToolCard = null; toolCallCount = 0;
                        addMessage('agent', msg.content || 'Stopped.', 'error', 'none');
                    } else if (msg.role === 'error') {
                        currentToolLog = null; currentToolCard = null; toolCallCount = 0;
                        addMessage('agent', 'Error: ' + (msg.content || ''), 'error', 'none');
                    } else {
                        currentToolLog = null; currentToolCard = null; toolCallCount = 0;
                        chatHistory.push({role: msg.role, content: msg.content});
                        if (msg.role === 'assistant') {
                            const stats = turnStats(msg);
                            addMessage('agent', msg.content, msg.backend, msg.model, stats);
                            if (!turnFailed(msg.backend)) recordTurn(stats);
                        } else {
                            addMessage(msg.role, msg.content, msg.backend, msg.model);
                        }
                    }
                }
                renderSessionStats();
                highlightActiveSession();
            }).catch(() => {});
        }

        function loadChatSessions() {
            fetch('/api/chat-sessions?limit=20').then(r => r.json()).then(data => {
                const list = document.getElementById('session-list');
                if (!list) return;
                const sessions = data.sessions || [];
                list.innerHTML = sessions.map(s => {
                    const title = s.title || 'New chat';
                    const active = s.id === chatSessionId ? ' style="color:var(--accent);"' : '';
                    return `<li onclick="loadChatSession(${s.id})"${active}>${escapeHtml(title.substring(0, 40))}<span class="skill-desc">${s.message_count} msgs</span></li>`;
                }).join('');
            }).catch(() => {});
        }

        function highlightActiveSession() {
            const list = document.getElementById('session-list');
            if (!list) return;
            list.querySelectorAll('li').forEach(li => {
                li.style.color = '';
            });
            loadChatSessions();
        }

        function startNewChat() {
            chatHistory = [];
            chatSessionId = null;
            // The old session's seat goes with it (CFOP-417, Bugbot on #347):
            // a turn sent before the new row exists would otherwise still
            // carry the previous override, and an open popover could write
            // it onto the new session. Null means 'auto' until the row
            // answers with its seat.
            setChatLlm(null);
            if (llmPopoverOpen) setLlmPopoverOpen(false);
            showWelcome();
            resetTurnStats();
            setBoxTitle('');
            createChatSession();
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('collapsed');
        }

        function insertSkill(cmd) {
            const input = document.getElementById('message-input');
            input.value = cmd;
            input.focus();
        }

        // Markdown rendering (renderMarkdown / sanitizeHtml) lives in common.js
        // since CFOP-113: the investigations drawer renders the same agent prose.
        // marked is vendored; common.js escapes the text instead when it is absent.

        // One transcript entry, flat (CFOP-719). A question is "> text" (the
        // glyph is the stylesheet's); an answer is its markdown, and under it
        // a dim line with what the turn cost and which model wrote it. That
        // line is where the model went when the per-message header did: a
        // fallback mid-session still shows on the answer it wrote.
        //
        // backend 'error' is how callers mark a line that is the console's,
        // not the model's ("Stopped.", "Error: …"); it is drawn as one and
        // gets no stats line. So is 'none', the agent's word for a turn
        // nothing answered (the circuit is open, no provider is available):
        // that is a failed turn, not an answer that took 0.2s.
        function addMessage(role, text, backend = null, model = null, stats = null) {
            const container = document.getElementById('chat-container');
            const messageDiv = document.createElement('div');
            const isError = role === 'agent' && turnFailed(backend);
            messageDiv.className = `message ${role}${isError ? ' error' : ''}`;
            messageDiv.innerHTML =
                `<div class="message-bubble">${role === 'agent' ? renderMarkdown(text) : escapeHtml(text)}</div>`;
            if (role === 'agent' && !isError) {
                const parts = [statsText(stats, false)];
                if (namesAModel(backend, model)) parts.push(`${backend}/${model}`);
                const line = parts.filter(Boolean).join(' · ');
                if (line) {
                    const statsDiv = document.createElement('div');
                    statsDiv.className = 'turn-stats';
                    statsDiv.textContent = line;
                    messageDiv.appendChild(statsDiv);
                }
            }
            container.appendChild(messageDiv);
            container.scrollTop = container.scrollHeight;
            return messageDiv;
        }

        // What the agent puts in backend/model when no model is behind a
        // result. 'none': nothing answered. 'N/A': the turn is real but no
        // model wrote it (the summary phrase, an unknown skill). Neither is a
        // seat to print: "0.2s · none/none" under a refusal read as an answer
        // from a model called none (Bugbot on #376).
        const NOT_A_MODEL = {none: true, 'N/A': true, error: true};
        function namesAModel(backend, model) {
            return !!(backend && model && !NOT_A_MODEL[backend] && !NOT_A_MODEL[model]);
        }
        function turnFailed(backend) { return backend === 'error' || backend === 'none'; }

        // What cfassist's banner says, for a fresh chat: what this is, which
        // build, and the keys that list what it can do. One copy, so the
        // first paint and New chat cannot drift. The two spans are filled by
        // fillBanner(): the build from the health poll (CFOP-92), the count
        // from the skill list.
        let BUILD_VERSION = '';
        function showWelcome() {
            const container = document.getElementById('chat-container');
            container.innerHTML =
                `<div class="palette-banner"><span class="brand">CFOperator</span> <span id="status-version"></span></div>` +
                `<div class="palette-banner"><span id="banner-skills"></span><b>/</b> lists skills &nbsp; <b>enter</b> sends</div>` +
                `<div class="palette-rule"></div>`;
            fillBanner();
        }
        function fillBanner() {
            const v = document.getElementById('status-version');
            if (v) v.textContent = BUILD_VERSION ? '· ' + BUILD_VERSION : '';
            const s = document.getElementById('banner-skills');
            if (s) s.textContent = SLASH_COMMANDS.length ? SLASH_COMMANDS.length + ' skills   ' : '';
        }

        let currentToolLog = null;
        let currentToolCard = null;
        let toolCallCount = 0;

        function getOrCreateToolLog() {
            if (currentToolLog) return currentToolLog;
            const container = document.getElementById('chat-container');
            const logDiv = document.createElement('div');
            logDiv.className = 'tool-log';
            toolCallCount = 0;
            // No "Tool Activity" header (CFOP-719): the rows are the
            // transcript, in the order they ran, as in cfassist.
            logDiv.innerHTML = `<div class="tool-log-body"></div>`;
            container.appendChild(logDiv);
            currentToolLog = logDiv;
            return logDiv;
        }

        function updateToolCount() {
            if (!currentToolLog) return;
            const badge = currentToolLog.querySelector('.tl-count');
            if (badge) badge.textContent = toolCallCount;
        }

        function addToolCall(toolName, input, iteration, max) {
            const log = getOrCreateToolLog();
            const body = log.querySelector('.tool-log-body');
            toolCallCount++;
            updateToolCount();

            const argsStr = typeof input === 'string' ? input : JSON.stringify(input, null, 2);
            const summary = typeof input === 'string' ? input : JSON.stringify(input);
            const iterLabel = (iteration && max) ? `${iteration}/${max}` : '';

            const card = document.createElement('div');
            card.className = 'tool-card';
            card.dataset.tool = toolName;
            // "-> name: args" (CFOP-719). A button, so the row opens from the
            // keyboard too; what it opens is the full arguments and result.
            card.innerHTML = `
                <button type="button" class="tool-card-header" title="Show the full arguments and result" onclick="this.parentElement.classList.toggle('expanded')">
                    <span class="tc-status pending">-&gt;</span>
                    <span class="tc-name">${escapeHtml(toolName)}:</span>
                    ${iterLabel ? `<span class="tc-iter">[${iterLabel}]</span>` : ''}
                    <span class="tc-summary">${escapeHtml(summary.substring(0, 160))}</span>
                </button>
                <div class="tool-card-detail">
                    <div class="tc-detail-section">
                        <div class="tc-detail-label">Input</div>
                        <div class="tc-detail-content tc-args">${escapeHtml(argsStr)}</div>
                    </div>
                </div>`;
            body.appendChild(card);
            currentToolCard = card;

            const container = document.getElementById('chat-container');
            container.scrollTop = container.scrollHeight;
        }

        function addToolResult(toolName, result) {
            const resultStr = typeof result === 'string' ? result : JSON.stringify(result, null, 2);
            const isError = typeof result === 'object' && result && result.error;

            // Find the matching card (last card for this tool, or last card overall)
            let card = currentToolCard;
            if (!card && currentToolLog) {
                const cards = currentToolLog.querySelectorAll('.tool-card');
                card = cards[cards.length - 1];
            }

            if (card) {
                // The call's own row keeps its arguments. The result is a
                // second row under it, "<- name: \u2026", or "!! name: \u2026" for an
                // error, as cfassist prints them (CFOP-719). It used to
                // overwrite the arguments in the one row.
                card.classList.add('done');
                const preview = (typeof result === 'string' ? result : JSON.stringify(result))
                    .replace(/\s+/g, ' ').substring(0, 160);
                const row = document.createElement('div');
                row.className = 'tool-card-result' + (isError ? ' error' : '');
                row.innerHTML =
                    `<span class="tc-arrow">${isError ? '!!' : '&lt;-'}</span>` +
                    `<span class="tc-name">${escapeHtml(toolName || card.dataset.tool || '')}:</span>` +
                    `<span class="tc-outcome">${escapeHtml(preview)}</span>`;

                // Add result section to detail
                const detail = card.querySelector('.tool-card-detail');
                if (detail && detail.parentElement === card) card.insertBefore(row, detail);
                else card.appendChild(row);
                if (detail) {
                    const section = document.createElement('div');
                    section.className = 'tc-detail-section';
                    section.innerHTML = `
