                        <div class="tc-detail-label">Result</div>
                        <div class="tc-detail-content ${isError ? 'tc-error' : 'tc-result'}">${escapeHtml(resultStr)}</div>`;
                    detail.appendChild(section);
                }
            }

            currentToolCard = null;
        }

        function showQuestion(data) {
            const panel = document.getElementById('questions-panel');
            panel.classList.add('active');
            const questionCard = document.createElement('div');
            questionCard.className = 'question-card';
            questionCard.innerHTML = `
                <h4>Investigation #${escapeHtml(String(data.investigation_id))} &middot; ${escapeHtml(data.host_id || 'cfoperator')}</h4>
                <p>${escapeHtml(data.question)}</p>
                ${data.context ? `<div class="context">${escapeHtml(data.context)}</div>` : ''}
                <div class="answer-input">
                    <input type="text" id="answer-${Number(data.id)}" placeholder="Your answer...">
                    <button onclick="submitAnswer(${Number(data.id)})">Submit</button>
                </div>
            `;
            panel.appendChild(questionCard);
        }

        // The answer goes over HTTP, and the card only leaves once the server
        // has said it took it. A card that vanishes on a failed submit is an
        // answer eaten silently — the investigation waits forever and the
        // operator believes they answered.
        function submitAnswer(questionId) {
            const input = document.getElementById(`answer-${questionId}`);
            const answer = input.value.trim();
            if (!answer) return;
            const card = input.closest('.question-card');
            const button = card.querySelector('button');
            let err = card.querySelector('.answer-error');
            if (err) err.remove();
            button.disabled = true;
            fetch('/api/qa', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ question_id: questionId, answer })
            }).then(async r => {
                const body = await r.json().catch(() => ({}));
                if (!r.ok) throw new Error(body.error || `HTTP ${r.status}`);
                card.remove();
                if (document.getElementById('questions-panel').children.length === 0) {
                    document.getElementById('questions-panel').classList.remove('active');
                }
            }).catch(e => {
                button.disabled = false;
                err = document.createElement('div');
                err.className = 'answer-error';
                err.textContent = `Answer not delivered: ${e.message}`;
                card.appendChild(err);
                toast(`Answer to question #${questionId} was not delivered: ${e.message}`, 'err');
            });
        }

        function sendFeedback(btn, learningIds, type) {
            fetch('/api/feedback', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({learning_ids: learningIds, type: type})
            }).then(() => {
                btn.classList.add('selected');
                btn.parentElement.querySelectorAll('button').forEach(b => { b.disabled = true; });
            }).catch(err => console.error('Feedback error:', err));
        }

        // The send lock. inFlightChatId is set only when /api/chat answers;
        // until then the disabled Send button was the only thing in the way,
        // and Enter on the composer never checked it — a second Enter, or a
        // sweep-finding click, in that window fired a second POST (CFOP-115
        // review). SENDING covers the gap, synchronously, from the first call.
        let SENDING = false;
        function sendMessage(opts) {
            if (inFlightChatId || SENDING) return;  // streaming, or the POST is still out
            const input = document.getElementById('message-input');
            const message = input.value.trim();
            if (!message) return;
            SENDING = true;

            addMessage('user', message);
            chatHistory.push({role: 'user', content: message});
            input.value = '';
            input.rows = 1;
            // Emptied by script, so no input event: close the menu a sent
            // "/command" left open, or it and its hints outlive the text.
            updateSlashMenu();
            saveDraft('');
            // The scanner starts with the question, not with the server's reply.
            // After the menu is closed, so the footer's hint is the turn's.
            syncBusy();

            document.getElementById('send-button').disabled = true;
            document.getElementById('thinking').classList.add('active');
            document.getElementById('chat-container').scrollTop = document.getElementById('chat-container').scrollHeight;

            // The session's seat rides on every turn (CFOP-417): what the
            // server stored on the row when the session was created, or the
            // chip's override for this session. Not the chip's DOM — the
            // popover is a view of chatLlm, not the other way round. 'auto'
            // with no model is the global selection, as before.
            const payload = {message, history: chatHistory,
                             backend: (chatLlm && chatLlm.backend) || 'auto'};
            if (chatLlm && chatLlm.model) payload.model = chatLlm.model;
            // The worker writes tool rows and the assistant reply against this
            // session as they happen (CFOP-125). Without it a closed tab loses
            // the turn: nothing server-side knew which transcript to append to.
            if (chatSessionId) payload.session_id = chatSessionId;
            // mode: 'verify' is a hand-off turn — the agent withholds mutating tools.
            if (opts && opts.mode) payload.mode = opts.mode;

            // User row first, then the turn. The worker persists tool calls
            // the moment they happen; posting the chat before this resolves
            // lets an exec land above the question that asked for it.
            saveMessage('user', message).then(() => fetch('/api/chat', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            }))
            .then(r => r.json())
            .then(data => {
                SENDING = false;
                if (data.chat_id) {
                    setChatInFlight(data.chat_id);
                    pollChatEvents(data.chat_id, 0);
                } else {
                    document.getElementById('thinking').classList.remove('active');
                    setChatInFlight(null);
                    addMessage('agent', data.error || 'Unknown error', 'error', 'none');
                }
            })
            .catch(err => {
                SENDING = false;
                document.getElementById('thinking').classList.remove('active');
                addMessage('agent', `Error: ${err.message}`, 'error', 'none');
                setChatInFlight(null);
            });
        }

        // Stop the in-flight chat. The server stops at its next event boundary;
        // we reset the UI optimistically so the user gets immediate feedback.
        function stopChat() {
            if (!inFlightChatId) return;
            fetch(`/api/chat/${inFlightChatId}/stop`, {method: 'POST'}).catch(() => {});
            settleOpenHostConfirms(inFlightChatId, 'stopped');
            document.getElementById('thinking').classList.remove('active');
            currentToolLog = null; currentToolCard = null; toolCallCount = 0;
            addMessage('agent', 'Stopped.', 'error', 'none');
            setChatInFlight(null);
        }

        // Consecutive transport failures to ride out before giving up. Five at
        // 2s covers a rolling restart; past that the process that held this
        // turn is gone and polling only keeps the spinner spinning.
        const POLL_MAX_RETRIES = 5;

        // The turn is not coming back (CFOP-159). Say so, once, and give the
        // composer back — the failure mode this replaces was a console that
        // looked busy forever.
        function chatSessionLost(chatId, why) {
            if (chatId !== inFlightChatId) return;   // already stopped; nothing to announce
            console.warn(`chat ${chatId} ended without an answer: ${why}`);
            settleOpenHostConfirms(chatId, 'ended');
            document.getElementById('thinking').classList.remove('active');
            currentToolLog = null; currentToolCard = null; toolCallCount = 0;
            addMessage('agent', 'The agent restarted before it answered, so this turn was lost. '
                              + 'Your message is saved in the transcript — ask again to retry.',
                       'error', 'none');
            setChatInFlight(null);
        }

        function pollChatEvents(chatId, cursor, retries) {
            fetch(`/api/chat/events/${chatId}?cursor=${cursor}`)
            .then(r => {
                // A chat_id the server no longer knows is the end of the road,
                // not a reason to keep asking. The agent is replaced on every
                // merge to main (strategy: Recreate), which drops the turn in
                // flight and 404s this endpoint from then on; the same 404
                // arrives on the ordinary five-minute cleanup of a finished
                // chat. fetch does not reject on 404 and the body is still
                // JSON, so reading it straight left `done` undefined and this
                // function re-polling a dead id every second, forever.
                if (!r.ok) { chatSessionLost(chatId, `HTTP ${r.status}`); return; }
                // Handled inside this branch rather than by returning a
                // sentinel to a second .then: any sentinel is a value the
                // server could also send. `null` was the first pick, and a
                // 200 carrying a literal `null` body then read as "already
                // handled" and left the spinner up forever — the same bug in
                // a narrower window.
                return r.json().then(data => {
                    // Not an events payload at all — an error body, a `null`,
                    // a proxy's idea of a response. Ending here rather than
                    // reading a missing `done` as "keep going".
                    if (!data || typeof data.done === 'undefined') {
                        chatSessionLost(chatId, 'malformed response');
                        return;
                    }
                    // Only render while this chat is still the active one.
                    // After a Stop the worker may emit a few more events
                    // before it notices; we keep polling (so the session is
                    // cleaned up) but drop them.
                    if (chatId === inFlightChatId) {
                        for (const evt of (data.events || [])) handleChatEvent(evt);
                    }
                    const next = (typeof data.cursor === 'number') ? data.cursor : cursor;
                    if (!data.done) setTimeout(() => pollChatEvents(chatId, next, 0), 1000);
                });
            })
            .catch(() => {
                // A genuine transport failure — the pod is mid-restart, the LAN
                // blinked. Worth retrying, but bounded: an unbounded retry is
                // the same silent spinner by another route.
                const n = (retries || 0) + 1;
                if (n > POLL_MAX_RETRIES) { chatSessionLost(chatId, 'agent unreachable'); return; }
                setTimeout(() => pollChatEvents(chatId, cursor, n), 2000);
            });
        }

        function handleChatEvent(evt) {
            const type = evt.event;
            const data = evt.data;

            if (type === 'tool_call') {
                document.getElementById('thinking').classList.remove('active');
                addToolCall(data.tool, data.args, data.iteration, data.max);
                document.getElementById('thinking').classList.add('active');
            } else if (type === 'tool_result') {
                document.getElementById('thinking').classList.remove('active');
                addToolResult(data.tool, data.result);
                document.getElementById('thinking').classList.add('active');
            } else if (type === 'done') {
                document.getElementById('thinking').classList.remove('active');
                settleOpenHostConfirms(inFlightChatId, 'ended');
                setChatInFlight(null);
                currentToolLog = null; currentToolCard = null; toolCallCount = 0;
                if (data.response) {
                    // What the turn cost rides on the event (CFOP-718): under
                    // the answer, in the footer, and into the session totals.
                    const stats = turnStats(data);
                    const msgEl = addMessage('agent', data.response, data.backend, data.model, stats);
                    // A turn nothing answered is not counted as one.
                    if (!turnFailed(data.backend)) recordTurn(stats);
                    chatHistory.push({role: 'assistant', content: data.response});
                    // The assistant row is written by the /api/chat worker
                    // (CFOP-125). Saving it here as well double-writes the turn.

                    if (data.learning_ids && data.learning_ids.length > 0) {
                        const fbDiv = document.createElement('div');
                        fbDiv.className = 'feedback-buttons';
                        const lids = data.learning_ids;
                        const btnUp = document.createElement('button');
                        btnUp.textContent = '\u{1F44D} helpful';
                        btnUp.addEventListener('click', () => sendFeedback(btnUp, lids, 'thumbs_up'));
                        const btnDown = document.createElement('button');
                        btnDown.textContent = '\u{1F44E} not helpful';
                        btnDown.addEventListener('click', () => sendFeedback(btnDown, lids, 'thumbs_down'));
                        fbDiv.appendChild(btnUp);
                        fbDiv.appendChild(btnDown);
                        msgEl.querySelector('.message-bubble').appendChild(fbDiv);
                    }
                }
            } else if (type === 'confirm') {
                document.getElementById('thinking').classList.remove('active');
                addHostConfirm(data);
            } else if (type === 'confirm_result') {
                settleHostConfirm(data.id, data.decision, data.by);
                document.getElementById('thinking').classList.add('active');
            } else if (type === 'fallback') {
                addFallbackNote(data.from, data.to, data.reason);
            } else if (type === 'error') {
                document.getElementById('thinking').classList.remove('active');
                settleOpenHostConfirms(inFlightChatId, 'ended');
                setChatInFlight(null);
                currentToolLog = null; currentToolCard = null; toolCallCount = 0;
                addMessage('agent', `Error: ${data.error}`, 'error', 'none');
            }
        }

        // A host write the agent wants to make (CFOP-442). The turn is paused
        // on the server until this is answered; Run executes exactly the
        // command shown, once, as the write identity, with a change record.
        function addHostConfirm(q) {
            if (!q || !q.id) return;
            const container = document.getElementById('chat-container');
            const card = document.createElement('div');
            card.className = 'host-confirm';
            card.id = 'host-confirm-' + q.id;
            const mins = Math.max(1, Math.round((q.timeout_s || 300) / 60));
            card.innerHTML = `
                <div class="hc-title">\u26A0 Run this on a host?</div>
                <div class="hc-host">${escapeHtml(q.host || '')} \u00B7 ${escapeHtml(q.tool || '')}</div>
                <div class="hc-command"></div>
                <div class="hc-reason">${escapeHtml(q.reason || '')}. Runs once as the write identity, with sudo, and is recorded. Unanswered in ${mins} min, nothing runs.</div>
                <div class="hc-actions">
                    <button type="button" class="hc-run">Run</button>
                    <button type="button" class="hc-decline">Decline</button>
                    <span class="hc-outcome"></span>
                </div>`;
            card.querySelector('.hc-command').textContent = q.command || '';
            const chatId = inFlightChatId;
            card.dataset.chatId = chatId || '';
            card.querySelector('.hc-run').addEventListener('click', () => answerHostConfirm(chatId, q.id, true));
            card.querySelector('.hc-decline').addEventListener('click', () => answerHostConfirm(chatId, q.id, false));
            container.appendChild(card);
            currentToolLog = null; currentToolCard = null;  // later tool rows go below the card
            container.scrollTop = container.scrollHeight;
        }

        function answerHostConfirm(chatId, confirmId, approve) {
            const card = document.getElementById('host-confirm-' + confirmId);
            if (!card || !chatId) return;
            card.querySelectorAll('button').forEach(b => { b.disabled = true; });
            const out = card.querySelector('.hc-outcome');
            out.textContent = approve ? 'running\u2026' : 'declining\u2026';
            fetch(`/api/chat/${chatId}/confirm`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({confirm_id: confirmId, approve})
            }).then(r => r.json().then(body => ({ok: r.ok, body}))).then(({ok, body}) => {
                if (!ok) {
                    out.textContent = (body && body.error) || 'could not answer';
                    // A question that is still waiting can be answered again.
                    if (!/already|no longer|no such/.test(out.textContent)) {
                        card.querySelectorAll('button').forEach(b => { b.disabled = false; });
                    }
                }
            }).catch(() => {
                out.textContent = 'could not reach the agent';
                card.querySelectorAll('button').forEach(b => { b.disabled = false; });
            });
        }

        // A turn that stops or ends takes its open questions with it: the
        // server declines them, and the card must not offer a Run that can
        // no longer be answered (Bugbot on #356).
        function settleOpenHostConfirms(chatId, decision) {
            document.querySelectorAll('.host-confirm:not(.settled)').forEach(card => {
                if (!chatId || card.dataset.chatId === chatId) {
                    settleHostConfirm(card.id.replace('host-confirm-', ''), decision);
                }
            });
        }

        function settleHostConfirm(confirmId, decision, by) {
            const card = document.getElementById('host-confirm-' + confirmId);
            if (!card) return;
            card.classList.add('settled');
            card.querySelectorAll('button').forEach(b => { b.disabled = true; b.style.display = 'none'; });
            const words = {approved: 'Approved', declined: 'Declined', stopped: 'Stopped; nothing ran',
                           ended: 'The turn ended; nothing ran', timeout: 'Not answered in time; nothing ran'};
            const text = (words[decision] || decision || '') + (by ? ` by ${by}` : '');
            card.querySelector('.hc-outcome').textContent = decision === 'approved'
                ? text + ' \u2014 running through the executor\u2026' : text;
        }

        // The server already emitted 'fallback' whenever it rotated providers
        // inside a chat; nothing rendered it, so the reply arrived labelled
        // gemma4 while the chip still said Gemini and the minute in between
        // was a bare spinner (CFOP-112). One line in the tool log, as soon
        // as the rotation happens.
        function addFallbackNote(from, to, reason) {
            const log = getOrCreateToolLog();
            const body = log.querySelector('.tool-log-body');
            const line = document.createElement('div');
            line.className = 'tool-fallback';
            line.textContent = `fallback: ${from || '?'} \u2192 ${to || '?'}`
                + (reason ? ` \u2014 ${reason}` : '');
            body.appendChild(line);
            const container = document.getElementById('chat-container');
            container.scrollTop = container.scrollHeight;
        }

        // Escapes quotes as well as angle brackets — textContent alone leaves
        // " and ' intact, which breaks out of an HTML attribute value.
        function escapeHtml(text) {
            return (text == null ? '' : String(text)).replace(/[&<>"']/g,
                c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
        }

        // Poll for pending questions
        setInterval(() => {
            fetch('/api/qa').then(r => r.json()).then(questions => {
                questions.forEach(q => {
                    if (!document.getElementById(`answer-${q.id}`)) showQuestion(q);
                });
            }).catch(() => {});
        }, 10000);

        // Status bar updates
        // The dot and its label are one signal: whether the last /api/health
        // poll answered. Nothing else moves them.
        function setConnected(up) {
            document.getElementById('connection-status').classList.toggle('disconnected', !up);
            document.getElementById('connection-label').textContent = up ? 'Connected' : 'Disconnected';
        }

        function updateStatus() {
            fetch('/api/health').then(r => {
                if (!r.ok) throw new Error(`HTTP ${r.status}`);
                return r.json();
            }).then(data => {
                setConnected(true);
                // The build version comes from the image (CFOP-92): "1.1.0" for a release, "main-<sha>" or "dev" otherwise.
                // It is the banner's now (fillBanner writes #status-version): the status bar it used to sit in
                // repeated the rail's status card, and went with CFOP-719. Uptime and last sweep are on that card.
                if (data.version) {
                    BUILD_VERSION = /^\d/.test(data.version) ? 'v' + data.version : data.version;
                    fillBanner();
                }
                // A console opened while the agent was restarting got an empty
                // skill list; the health poll is the first thing to see it back.
                if (!SLASH_COMMANDS.length) loadSlashCommands().then(fillBanner);
            }).catch(() => setConnected(false));
        }
        updateStatus();
        setInterval(updateStatus, 60000);

        // Slash commands. The sidebar and the autocomplete menu both render
        // from this one array, and the array comes from the agent
        // (GET /api/skills): the skills it loaded plus its shortcut
        // expansions. The page carries no list of its own — it used to carry
        // two, and they drifted from each other and from the agent (CFOP-93).
        let SLASH_COMMANDS = [];

        function renderSkillList() {
            const list = document.getElementById('skill-list');
            if (!SLASH_COMMANDS.length) {
                list.innerHTML = '<li class="skill-desc">Skills unavailable — is the agent up?</li>';
                return;
            }
            list.innerHTML = SLASH_COMMANDS.map(c =>
                `<li data-cmd="${escapeHtml(c.cmd)}">${escapeHtml(c.cmd)}` +
                `<span class="skill-desc">${escapeHtml(c.desc)}</span></li>`
            ).join('');
            list.querySelectorAll('li[data-cmd]').forEach(li => {
                li.addEventListener('click', () => insertSkill(li.dataset.cmd + ' '));
            });
        }

        async function loadSlashCommands() {
            try {
                const r = await fetch('/api/skills');
                const data = await r.json();
                SLASH_COMMANDS = (data.skills || []).map(s => ({
                    cmd: s.command, args: s.args || '', desc: s.description || ''
                }));
            } catch (e) {
                SLASH_COMMANDS = [];
            }
            renderSkillList();
        }
        // The banner's skill count follows the list, here and when the health poll refetches it.
        loadSlashCommands().then(fillBanner);

        let slashMenuIndex = -1;

        function updateSlashMenu() {
            const input = document.getElementById('message-input');
            const menu = document.getElementById('slash-menu');
            const val = input.value;
            if (!val.startsWith('/') || val.includes(' ')) { menu.classList.remove('active'); slashMenuIndex = -1; return; }
            const filter = val.toLowerCase();
            const matches = SLASH_COMMANDS.filter(c => c.cmd.startsWith(filter));
            if (!matches.length) { menu.classList.remove('active'); slashMenuIndex = -1; return; }
            menu.innerHTML = matches.map((c, i) =>
                `<div class="slash-item${i === slashMenuIndex ? ' selected' : ''}" data-index="${i}">` +
                `<span class="cmd">${escapeHtml(c.cmd)}${c.args ? ' ' + escapeHtml(c.args) : ''}</span>` +
                `<span class="desc">${escapeHtml(c.desc)}</span></div>`
            ).join('');
            menu.querySelectorAll('.slash-item').forEach(item => {
                item.addEventListener('mousedown', (e) => {
                    e.preventDefault();
                    applySlashCommand(matches[parseInt(item.dataset.index)]);
                });
            });
            menu.classList.add('active');
        }

        function applySlashCommand(cmd) {
            document.getElementById('message-input').value = cmd.cmd + ' ';
            document.getElementById('message-input').focus();
            document.getElementById('slash-menu').classList.remove('active');
            slashMenuIndex = -1;
            renderFooter();
        }

        function handleSlashKeydown(e) {
            const menu = document.getElementById('slash-menu');
            if (!menu.classList.contains('active')) return false;
            const items = menu.querySelectorAll('.slash-item');
            const val = document.getElementById('message-input').value.toLowerCase();
            const matches = SLASH_COMMANDS.filter(c => c.cmd.startsWith(val));

            if (e.key === 'ArrowDown') { e.preventDefault(); slashMenuIndex = Math.min(slashMenuIndex + 1, items.length - 1); updateSlashMenu(); return true; }
            if (e.key === 'ArrowUp') { e.preventDefault(); slashMenuIndex = Math.max(slashMenuIndex - 1, 0); updateSlashMenu(); return true; }
            if (e.key === 'Tab' || (e.key === 'Enter' && slashMenuIndex >= 0)) {
                e.preventDefault();
                const filtered = SLASH_COMMANDS.filter(c => c.cmd.startsWith(val));
                if (slashMenuIndex >= 0 && slashMenuIndex < filtered.length) applySlashCommand(filtered[slashMenuIndex]);
                else if (filtered.length === 1) applySlashCommand(filtered[0]);
                return true;
            }
            if (e.key === 'Escape') { menu.classList.remove('active'); slashMenuIndex = -1; renderFooter(); return true; }
            return false;
        }

        // Event listeners
        document.getElementById('send-button').addEventListener('click', () => {
            if (inFlightChatId) stopChat(); else sendMessage();
        });

        document.getElementById('message-input').addEventListener('keydown', (e) => {
            if (handleSlashKeydown(e)) return;
            // The footer's hint while a turn runs: esc stops it. The menu's own Escape came first.
            if (e.key === 'Escape' && inFlightChatId) { e.preventDefault(); stopChat(); return; }
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
        });

        document.getElementById('message-input').addEventListener('input', (e) => {
            e.target.rows = 1;
            e.target.rows = Math.min(Math.ceil(e.target.scrollHeight / 22), 6);
            updateSlashMenu();
            renderFooter();   // the hints follow the menu
            saveDraft(e.target.value);
        });

        // The draft survives leaving the page (CFOP-113). The header links are
        // real navigations, so a half-typed question went with the page when
        // you glanced at Remediations. Saved as you type, restored on load,
        // cleared once sent. A handed row (?remediation= / ?investigation=)
        // writes its own question, so the restore is skipped for it.
        const DRAFT_KEY = 'cfoperator_chat_draft';
        function saveDraft(text) {
            try { if (text) localStorage.setItem(DRAFT_KEY, text); else localStorage.removeItem(DRAFT_KEY); } catch (e) {}
        }
        function restoreDraft() {
            let draft = '';
            try { draft = localStorage.getItem(DRAFT_KEY) || ''; } catch (e) {}
            if (!draft) return;
            const input = document.getElementById('message-input');
            input.value = draft;
            input.rows = Math.min(Math.ceil(input.scrollHeight / 22), 6);
        }

        document.getElementById('message-input').addEventListener('blur', () => {
            setTimeout(() => { document.getElementById('slash-menu').classList.remove('active'); renderFooter(); }, 150);
        });

        document.addEventListener('keydown', (e) => {
            const input = document.getElementById('message-input');
            if (document.activeElement === input) return;
            if (['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName)) return;
            // Anywhere on the page, not only in the composer. An open model
            // picker has Escape first: it closes itself.
            if (e.key === 'Escape' && inFlightChatId && !llmPopoverOpen) { stopChat(); return; }
            if (e.key === '/') { e.preventDefault(); input.value = '/'; input.focus(); updateSlashMenu(); renderFooter(); }
        });

        // Sweep Reports. The latest report is kept on the page so a finding's
        // handoff to the chat (CFOP-115) reads structured fields, not the row.
        let SWEEP = null;
        const ASK_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>';

        // Same shape as remediationQuestion / investigationQuestion: what is
        // known about the finding, then the ask that wants the checks run.
        function findingQuestion(r, i) {
            const f = (r.findings || [])[i] || {};
            // A summary's only finding is the first 500 characters of it
            // (CFOP-708): ask about the document, not the fragment.
            const text = (i === 0 && sweepDoc(r)) || f.finding;
            const head = `Sweep #${r.id}.${i} — severity ${f.severity || 'info'}`
                + (f.status ? `, status ${f.status}` : '')
                + (r.swept_at ? `, swept ${r.swept_at}` : '') + '.';
            return [
                head,
                text ? `Finding: ${text}` : '',
                f.remediation ? `Proposed remediation: ${f.remediation}` : '',
                f.resolution ? `Recorded resolution: ${f.resolution}` : '',
                'Check whether this is still the case — run the checks yourself rather than listing them — '
                + 'and say what should happen next, with the evidence.',
                VERIFY_ONLY,
            ].filter(Boolean).join('\n');
        }

        // The chat is on this page, so no URL handoff: compose, send, fold the
        // panel so the answer is in view. A draft in the composer is put back
        // afterwards rather than lost. A send already out or an answer still
        // streaming is not interrupted — sendMessage would ignore the call and
        // leave the question sitting in the box — so the click says to wait.
        function askAboutFinding(i) {
            if (!SWEEP) return;
            if (inFlightChatId || SENDING) { toast('wait for the current answer, then ask again', 'err'); return; }
            const input = document.getElementById('message-input');
            const draft = input.value;
            input.value = findingQuestion(SWEEP, i);
            sendMessage({mode: 'verify'});
            if (draft.trim()) { input.value = draft; saveDraft(draft); }
            const body = document.querySelector('#sweep-panel .sweep-body');
            if (body) body.classList.remove('open');
        }

        function loadSweepReports() {
            fetch('/api/sweep-reports?limit=1').then(r => r.json()).then(data => {
                const panel = document.getElementById('sweep-panel');
                const reports = data.reports || [];
                if (!reports.length) { panel.classList.remove('active'); SWEEP = null; return; }
                const r = reports[0];
                SWEEP = r;
                const ago = timeAgo(r.swept_at);
                const meta = r.sweep_meta || {};
                // The poll repaints every 60 s; the click now lives inside the
                // open body, so an open panel stays open across the repaint.
                const wasOpen = !!panel.querySelector('.sweep-body.open');
                // A morning summary is one markdown document, stored with its
                // first 500 characters as the report's only "finding"
                // (CFOP-708, sweepDoc in common.js). The row keeps its Ask
                // button; what it shows is the document, rendered.
                const doc = sweepDoc(r);
                const what = doc ? 'morning summary'
                    : `${escapeHtml(String(r.finding_count))} finding${r.finding_count !== 1 ? 's' : ''}`;
                panel.innerHTML = `
                    <div class="sweep-header" title="The agent's latest sweep of the fleet. Click to show or hide what it found." onclick="this.nextElementSibling.classList.toggle('open')">
                        <span><span class="sweep-severity ${escapeHtml(r.severity)}">${escapeHtml(r.severity)}</span> &nbsp;Sweep #${escapeHtml(String(r.id))}: ${what}</span>
                        <span class="sweep-time">${ago}</span>
                    </div>
                    <div class="sweep-body">
                        ${doc ? `<div class="sweep-finding"><div class="sweep-finding-body md">${renderMarkdown(doc)}</div><button type="button" class="ask" onclick="askAboutFinding(0)" aria-label="Ask the console about this summary" title="Ask the console about this summary">${ASK_ICON}</button></div>`
                        : (r.findings || []).map((f, i) => `<div class="sweep-finding${f.status ? ' finding-' + escapeHtml(f.status) : ''}"><div class="sweep-finding-body"><span class="sweep-badge ${escapeHtml(f.severity || 'info')}">${escapeHtml((f.severity || 'info').toUpperCase())}</span><span class="finding-id">#${escapeHtml(String(r.id))}.${i}</span>${f.status ? `<span class="finding-status ${escapeHtml(f.status)}">${escapeHtml(f.status)}</span>` : ''}${escapeHtml(f.finding || '')}${f.remediation ? `<div class="sweep-remediation">&rarr; ${escapeHtml(f.remediation)}</div>` : ''}${f.resolution ? `<div class="sweep-remediation">&check; ${escapeHtml(f.resolution)}</div>` : ''}</div><button type="button" class="ask" onclick="askAboutFinding(${i})" aria-label="Ask the console about finding #${escapeHtml(String(r.id))}.${i}" title="Ask the console about this finding">${ASK_ICON}</button></div>`).join('')}
                        ${meta.sweep_backend ? `<div class="sweep-meta">${escapeHtml(meta.sweep_backend)}/${escapeHtml(meta.sweep_model || '')}</div>` : ''}
                    </div>`;
                if (wasOpen) panel.querySelector('.sweep-body').classList.add('open');
                panel.classList.add('active');
            }).catch(() => {});
        }

        function timeAgo(iso) {
            const s = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
            if (s < 60) return s + 's ago';
            if (s < 3600) return Math.floor(s/60) + 'm ago';
            if (s < 86400) return Math.floor(s/3600) + 'h ago';
            return Math.floor(s/86400) + 'd ago';
        }

        loadSweepReports();
        setInterval(loadSweepReports, 60000);

        /* ── LLM chip / quick switcher (CFOP-19; per session since CFOP-417) ──
           The chip shows the seat THIS SESSION runs on and the popover changes
           it for this session only (PUT /api/chat-sessions/<id>/llm). It never
           writes the global selection: that, and the chat / handed-rows seats
           a new session starts on, live in Admin → LLM. The failure this
           replaces: switch to a frontier for one question, forget, and every
           later chat pays for it. */
        let llmIsAdmin = false;
        let llmPopoverOpen = false;
        // The global selection (/api/settings/provider): what a seat of
        // 'auto' with no model resolves to, shown so the chip never says
        // just "auto".
        let llmDefault = {backend: 'auto', model: ''};

        function llmLabelText(backend, model) {
            const b = backend || 'auto';
            if (!b || b === 'auto') return 'auto';
            return model ? (b + ' · ' + model) : b;
        }

        // Off the plain-chat seat: a handed row, or a chip override. Both
        // get the badge — both are "a model other than the default".
        function llmSessionIsOverride(llm) {
            return !!(llm && (llm.source === 'session' || (llm.seat && llm.seat !== 'chat')));
        }

        function llmBadgeText(llm) {
            if (!llm) return '';
            if (llm.source === 'session') return 'this session';
            if (llm.seat === 'handoff') return 'handed row';
            return '';
        }

        function setChatLlm(llm) {
            chatLlm = llm;
            renderLlmChip();
        }

        function renderLlmChip() {
            const label = document.getElementById('llm-chip-label');
            const chip = document.getElementById('llm-chip');
            const badge = document.getElementById('llm-chip-badge');
            const llm = chatLlm || {backend: 'auto', model: ''};
            let backend = llm.backend || 'auto', model = llm.model || '';
            if (backend === 'auto' && !model) { backend = llmDefault.backend; model = llmDefault.model; }
            label.textContent = llmLabelText(backend, model);
            label.classList.add('ready');
            const override = llmSessionIsOverride(chatLlm);
            chip.classList.toggle('session', override);
            badge.textContent = llmBadgeText(chatLlm);
            chip.title = 'This session: ' + label.textContent
                + (llmIsAdmin ? ' — change for this session' : ' (admin required to change)');
            chip.disabled = !llmIsAdmin;
        }

        function setLlmPopoverOpen(open) {
            const wasOpen = llmPopoverOpen;
            llmPopoverOpen = !!open;
            const pop = document.getElementById('llm-popover');
            const chip = document.getElementById('llm-chip');
            pop.hidden = !llmPopoverOpen;
            chip.setAttribute('aria-expanded', llmPopoverOpen ? 'true' : 'false');
            if (!llmPopoverOpen && wasOpen) {
                // Return focus to the trigger when the dialog closes.
                chip.focus();
            }
        }

        function focusLlmPopover() {
            const backend = document.getElementById('llm-backend');
            if (backend) backend.focus();
        }

        function setLlmErr(msg) {
            document.getElementById('llm-model-err').textContent = msg || '';
        }

        function setModelUi(models, selected, errMsg) {
            const sel = document.getElementById('llm-model');
            const custom = document.getElementById('llm-model-custom');
            const err = document.getElementById('llm-model-err');
            err.textContent = errMsg || '';
            const list = Array.isArray(models) ? models : [];
            if (list.length > 0) {
                sel.hidden = false;
                custom.hidden = true;
                sel.innerHTML = list.map(m =>
                    `<option value="${escapeHtml(m)}">${escapeHtml(m)}</option>`).join('');
                if (selected && list.includes(selected)) sel.value = selected;
                else if (selected) {
                    // Selected model not in list — keep it selectable.
                    const opt = document.createElement('option');
                    opt.value = selected; opt.textContent = selected; opt.selected = true;
                    sel.appendChild(opt);
                }
            } else {
                // Empty list (or fetch failed): free-text so the switcher still works.
                sel.hidden = true;
                sel.innerHTML = '';
                custom.hidden = false;
                custom.value = selected || '';
                if (!errMsg) err.textContent = 'No models returned — enter a model id';
            }
        }

        // `preferred` is the session's own model when it has one; otherwise
        // the backend's selected model, which is what the server will run.
        function fetchModels(backend, preferred) {
            const sel = document.getElementById('llm-model');
            const custom = document.getElementById('llm-model-custom');
            const err = document.getElementById('llm-model-err');
            if (!backend || backend === 'auto') {
                sel.hidden = false;
                custom.hidden = true;
                custom.value = '';
                sel.innerHTML = '<option value="">(auto)</option>';
                sel.disabled = true;
                err.textContent = '';
                return Promise.resolve();
            }
            sel.disabled = false;
            sel.hidden = false;
            custom.hidden = true;
            sel.innerHTML = '<option value="">Loading…</option>';
            err.textContent = '';
            return fetch('/api/models/' + encodeURIComponent(backend))
                .then(r => r.json().then(data => ({ok: r.ok, data})))
                .then(({ok, data}) => {
                    const models = (data && data.models) || [];
                    const selected = preferred || (data && data.selected) || '';
                    const msg = (!ok || !models.length)
                        ? ((data && data.error) || (!ok ? 'failed to load models' : ''))
                        : '';
                    setModelUi(models, selected, msg);
                })
                .catch(() => setModelUi([], preferred || '', 'failed to load models'));
        }

        function loadLlmProviders(selectedBackend) {
            return fetch('/api/providers')
                .then(r => r.json())
                .then(data => {
                    const select = document.getElementById('llm-backend');
                    select.innerHTML = '';
                    (data.providers || []).forEach(p => {
                        const opt = document.createElement('option');
                        opt.value = p.id;
                        opt.textContent = p.name + ((!p.available && p.id !== 'auto') ? ' (unavailable)' : '');
                        if (!p.available && p.id !== 'auto') opt.disabled = true;
                        select.appendChild(opt);
                    });
                    const backend = selectedBackend || 'auto';
                    if ([...select.options].some(o => o.value === backend)) select.value = backend;
                    else select.value = 'auto';
                })
                .catch(() => {});
        }

        // The global selection, read for the label only. Nothing on this
        // page writes it.
        function refreshLlmChip() {
            return fetch('/api/settings/provider')
                .then(r => r.json())
                .then(data => {
                    llmDefault = {backend: data.backend || 'auto', model: data.model || ''};
                    renderLlmChip();
                    return llmDefault;
                })
                .catch(() => {
                    document.getElementById('llm-chip-label').textContent = 'LLM?';
                    document.getElementById('llm-chip').title = 'Could not load LLM setting';
                });
        }

        function llmScopeText(llm) {
            if (llm && llm.source === 'session') return 'Set for this chat session only; a new chat starts from the default.';
            if (llm && llm.seat === 'handoff') return 'This session started on the handed-rows seat (Admin → LLM). Changes apply to this session only.';
            return 'Applies to this chat session only. A new chat starts from the default.';
        }

        // Draw the popover from chatLlm: the row is the truth, the selects
        // are a view of it. Also the re-sync after a failed save.
        function syncLlmPopover() {
            const llm = chatLlm || {};
            const backend = llm.backend || 'auto';
            document.getElementById('llm-scope').textContent = llmScopeText(chatLlm);
            document.getElementById('llm-reset').hidden = !(chatLlm && chatLlm.source === 'session');
            return loadLlmProviders(backend).then(() => fetchModels(backend, llm.model || ''));
        }

        function openLlmPopover() {
            if (!llmIsAdmin) return;
            setLlmPopoverOpen(true);
            syncLlmPopover().then(() => { if (llmPopoverOpen) focusLlmPopover(); });
        }

        // The one write the chip makes: this session's row. Resolves to
        // whether it was saved; the error text stays in the popover.
        function putSessionLlm(body, failMsg) {
            if (!chatSessionId) {
                setLlmErr('no chat session yet — reload the page');
                return Promise.resolve(false);
            }
            return fetch(`/api/chat-sessions/${chatSessionId}/llm`, {
                method: 'PUT', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(body)
            }).then(r => r.json().then(data => ({ok: r.ok, data})).catch(() => ({ok: r.ok, data: null})))
              .then(({ok, data}) => {
                if (!ok) {
                    setLlmErr((data && data.error) || failMsg);
                    return syncLlmPopover().then(() => false);
                }
                setChatLlm(data.llm || null);
                document.getElementById('llm-scope').textContent = llmScopeText(chatLlm);
                document.getElementById('llm-reset').hidden = !(chatLlm && chatLlm.source === 'session');
                return true;
            }).catch(() => {
                setLlmErr(failMsg);
                return syncLlmPopover().then(() => false);
            });
        }

        function onLlmBackendChange() {
            const backend = document.getElementById('llm-backend').value;
            setLlmErr('');
            // Backend alone: that backend's selected model, resolved by the
            // server at chat time. 'auto' puts the session back on its seat.
            putSessionLlm({backend}, 'failed to save provider for this session').then(ok => {
                if (ok) return fetchModels(backend, chatLlm && chatLlm.model);
            });
        }

        function commitLlmModel(model) {
            const backend = document.getElementById('llm-backend').value;
            if (!model || backend === 'auto') return;
            setLlmErr('');
            putSessionLlm({backend, model}, 'failed to save model for this session');
        }

        function onLlmModelChange() {
            commitLlmModel(document.getElementById('llm-model').value);
        }

        function onLlmModelCustomChange() {
            commitLlmModel(document.getElementById('llm-model-custom').value.trim());
        }

        function resetSessionLlm() {
            setLlmErr('');
            putSessionLlm({backend: 'auto'}, 'failed to reset this session').then(ok => {
                if (ok) return syncLlmPopover();
            });
        }

        document.getElementById('llm-chip').addEventListener('click', (e) => {
            e.stopPropagation();
            if (!llmIsAdmin) return;
            if (llmPopoverOpen) setLlmPopoverOpen(false);
            else openLlmPopover();
        });
        document.getElementById('llm-backend').addEventListener('change', onLlmBackendChange);
        document.getElementById('llm-model').addEventListener('change', onLlmModelChange);
        document.getElementById('llm-model-custom').addEventListener('change', onLlmModelCustomChange);
        document.getElementById('llm-reset').addEventListener('click', resetSessionLlm);
        document.addEventListener('click', (e) => {
            if (!llmPopoverOpen) return;
            if (!document.getElementById('llm-switcher').contains(e.target)) {
                setLlmPopoverOpen(false);
            }
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && llmPopoverOpen) setLlmPopoverOpen(false);
        });

        // Identity from nav.js (deferred) — wait for DOMContentLoaded so CFOP exists.
        document.addEventListener('DOMContentLoaded', () => {
            if (window.CFOP && CFOP.me) {
                CFOP.me().then(who => {
                    llmIsAdmin = !!(who && (who.role === 'admin' || who.auth_disabled));
                    refreshLlmChip();
                }).catch(() => refreshLlmChip());
            } else {
                refreshLlmChip();
            }
        });

        // Handed a row by another page (CFOP-109, CFOP-113): ?remediation=<id>
        // or ?investigation=<id> on this page's address (/console since
        // CFOP-710) starts a fresh session on that row and asks
        // the first question itself; the saved session is left alone rather
        // than appended to. The param is stripped by askAbout* once the
        // question is sent.
        // The composer has focus on arrival, as the autofocus attribute used
        // to give it. Not in the Ask panel: there the host page focuses the
        // chat when the operator opens it, and must keep its own focus when
        // the panel merely followed them to another page.
        showWelcome();
        renderFooter();
        if (!embedded()) {
            const composer = document.getElementById('message-input');
            if (composer && composer.focus) composer.focus();
        }
        const handoff = new URLSearchParams(location.search);
        const handedRemediation = /^\d+$/.test(handoff.get('remediation') || '')
            ? Number(handoff.get('remediation')) : null;
        const handedInvestigation = /^\d+$/.test(handoff.get('investigation') || '')
            ? Number(handoff.get('investigation')) : null;
        if (handedRemediation === null && handedInvestigation === null) restoreDraft();
        // Restore or create chat session
        const savedSession = localStorage.getItem('cfoperator_chat_session');
        // A handed row starts on the handed-rows seat (CFOP-417): the
        // operator points that seat at a frontier model once, in Admin →
        // LLM, instead of switching the chip for every Ask console.
        if (handedRemediation !== null) {
            createChatSession(
                () => askAboutRemediation(handedRemediation),
                () => toast(`could not start a chat session for remediation #${handedRemediation} — reload to retry`, 'err'),
                'handoff');
        } else if (handedInvestigation !== null) {
            createChatSession(
                () => askAboutInvestigation(handedInvestigation),
                () => toast(`could not start a chat session for investigation #${handedInvestigation} — reload to retry`, 'err'),
                'handoff');
        } else if (savedSession) {
            chatSessionId = parseInt(savedSession);
            // Verify session still exists, load it
            fetch(`/api/chat-sessions/${chatSessionId}`).then(r => {
                if (r.ok) return r.json();
                throw new Error('gone');
            }).then(data => {
                // The seat first, so the chip is right even for a session
                // with nothing in it yet (loadChatSession sets it again).
                setChatLlm(data.llm || null);
                if (data.messages && data.messages.length > 0) {
                    loadChatSession(chatSessionId);
                }
                loadChatSessions();
            }).catch(() => {
                createChatSession();
            });
        } else {
            createChatSession();
        }
        // Refresh session list periodically
        setInterval(loadChatSessions, 30000);
    </script>
</body>
</html>
