<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CFOperator · Remediations</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<!-- Tokens, the rail and the shared kit: one copy, see ui/console.css. -->
<link rel="stylesheet" href="/console.css">
<style>
  /* Pipeline flags are switches (CFOP-696): the state is the control, not a
     word inside a button. role="switch" + aria-checked carry it; the amber
     track is drain, the one stage that acts on its own (it opens PRs). */
  .switches { display:grid; grid-template-columns:repeat(auto-fill, minmax(170px, 1fr)); gap:8px; }
  .sw { display:flex; align-items:center; gap:10px; min-height:44px; padding:0 12px; border-radius:var(--radius-sm);
    border:1px solid var(--border); background:var(--bg-rail); color:var(--text-primary); cursor:pointer; text-align:left; }
  .sw:hover { border-color:#3a3a4e; }
  .sw:focus-visible { outline:2px solid var(--cyan); outline-offset:2px; }
  .sw .track { width:32px; height:18px; border-radius:999px; background:var(--border); position:relative; flex:none; }
  .sw .knob { position:absolute; top:2px; left:2px; width:14px; height:14px; border-radius:50%; background:var(--bg-primary); transition:left .12s; }
  .sw[aria-checked="true"] .track { background:var(--accent); }
  .sw[aria-checked="true"].warn .track { background:var(--orange); }
  .sw[aria-checked="true"] .knob { left:16px; }
  .sw .swl { display:flex; flex-direction:column; min-width:0; }
  .sw .swl .mono { font-size:13px; }
  .sw .note { font-size:12px; color:var(--text-muted); }
  .sw[aria-checked="true"] .note { color:var(--text-secondary); }
  .sw[aria-checked="true"].warn .note { color:#fbbf24; }
  @media (prefers-reduced-motion: reduce) { .sw .knob { transition:none; } }
  #feedmsg:empty { display:none; }
  #feedmsg { margin-top:12px; display:flex; flex-wrap:wrap; align-items:center; gap:8px; font-size:13px; }
  /* Counts by lifecycle stage, in the order a row moves through them. */
  .lifecycle { display:flex; flex-wrap:wrap; }
  .stage { flex:1 1 104px; display:flex; flex-direction:column; gap:2px; padding:12px 16px;
    border-right:1px solid var(--border-subtle); }
  .stage .n { font-size:22px; font-weight:700; color:color-mix(in srgb, var(--tone) 62%, white); }
  .stage .n.zero { color:var(--text-dim); }
  .stage .l { font-size:12px; color:var(--text-secondary); }
  .cls { display:flex; flex-direction:column; gap:4px; align-items:flex-start; font-size:12px; }
  .rec .t { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .rec { max-width:560px; }
  .host { max-width:190px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:12px; }
  /* A bucket divider is a full-width row in the one table (CFOP-419), not a
     heading between tables: three tables laid out three sets of columns. */
  tr.divider td { padding:20px 16px 8px; border-top:1px solid var(--border-subtle); border-bottom-color:var(--border-subtle);
    font-size:12px; font-weight:600; color:var(--text-secondary); }
  #detail { width:min(560px,92vw); }
  .kv { margin:4px 0; }
  .actform { background:var(--bg-tertiary); border:1px solid var(--border); border-radius:var(--radius-xs);
    padding:10px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:8px 0 12px; }
  .actform label { color:var(--text-secondary); font-size:12px; }
</style>
</head>
<body>
<header>
  <h1 class="page-title">Remediations</h1>
  <span class="muted" id="updated"></span>
  <!-- The rail: section nav, status, identity and logout — see ui/nav.js -->
  <div id="cfop-nav"></div>
</header>
<script src="/nav.js" defer></script>

<main class="page">
<section class="card" id="pipeline" aria-label="Pipeline controls">
  <div class="card-head">
    <h2>Pipeline</h2>
    <span class="muted" id="pipe-summary"></span>
    <span class="end"><button type="button" class="chip lg" onclick="runFeed()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4l12 8-12 8z"/></svg>Run feed-summary</button></span>
  </div>
  <div class="card-body">
    <div class="switches" id="flags"></div>
    <div id="feedmsg" role="status"></div>
  </div>
</section>
<section class="card lifecycle" id="tiles" aria-label="Lifecycle"></section>
<section class="card" aria-label="Remediation list">
  <div class="card-head">
    <div class="tabs" id="filters" aria-label="Status"></div>
    <span class="end"><input type="search" id="f-q" aria-label="Search remediations" placeholder="Recommendation, host, class, ticket, #id" oninput="searchInput(this.value)"></span>
  </div>
<!-- Sortable headers (CFOP-412): data-sort names a key the script defines for listKit.
     One table with three buckets (CFOP-419): active, filed to the tracker (CFOP-170:
     noted, not a line item), closed. One header, one column layout; each bucket is a
     tbody, its divider a full-width row in a tbody of its own so hiding it leaves the
     bucket's rows tbody in place for render(). -->
<table>
  <thead><tr>
    <th data-sort="id">ID</th><th data-sort="status">Status</th><th data-sort="class">Class · risk</th>
    <th data-sort="rec">Recommendation</th><th data-sort="host">Host</th><th>Ticket</th><th data-sort="created">Created</th>
  </tr></thead>
  <tbody id="rows"></tbody>
  <tbody id="empty" hidden><tr class="empty-row"><td colspan="7" class="empty">No open remediations.</td></tr></tbody>
  <tbody id="filed-section" hidden>
    <tr class="divider"><td colspan="7">Filed to tracker <span id="filed-count" class="muted"></span></td></tr>
  </tbody>
  <tbody id="rows-filed"></tbody>
  <tbody id="done-section" hidden>
    <tr class="divider"><td colspan="7">Closed <span id="done-count" class="muted"></span></td></tr>
  </tbody>
  <tbody id="rows-done"></tbody>
</table>
</section>
</main>
<div id="backdrop" onclick="closeDetail()" aria-hidden="true"></div>
<!-- A dialog (CFOP-94): inert while closed so its off-screen controls are not in the tab
     order; detail() lifts it, closeDetail() restores it. Labelled by the h2 detail() paints. -->
<div id="detail" role="dialog" aria-modal="true" aria-labelledby="detail-title" inert></div>
<div id="toasts"></div>

<!-- esc/badge/color/fmtTs/listKit/toast/trapFocus — one copy, see ui/common.js. Not deferred:
     the script below calls them at top level. -->
<script src="/common.js"></script>
<script>
const STATUS = ['queued','claimed','executing','pr-open','verifying','resolved','failed','needs-human','filed','rejected'];
const SC = {queued:'--cyan',claimed:'--orange',executing:'--orange','pr-open':'--purple',
  verifying:'--cyan',resolved:'--accent',failed:'--red','needs-human':'--orange',rejected:'--text-muted',
  // filed (CFOP-170): handed to the issue tracker. Quiet on purpose — it is
  // noted, not asking for attention; the orange of needs-human is what it left.
  filed:'--text-secondary'};
const RC = {low:'--accent',med:'--orange',high:'--red'};
let filter = '', Q = '';

// Remediation payloads carry LLM-authored URLs; only http(s) reaches href so a
// javascript: link cannot execute in the console. Empty/null must return '' —
// new URL('', base) resolves to the page itself, which rendered a phantom
// "PR ↗" linking back to the console on rows with no PR (CFOP-52).
function safeUrl(u){ const s=String(u==null?'':u).trim(); if(!s) return '';
  try{ const p=new URL(s, window.location.href);
  return (p.protocol==='http:'||p.protocol==='https:')?p.href:''; }catch(e){ return ''; } }
function clearForm(){ const f=document.getElementById('actionform'); if(f) f.innerHTML=''; }

let ALL = [];
// Sortable headers and the search box (CFOP-412): one kit in common.js, the
// page supplies what each column sorts by. Risk sorts by rank, not alphabet.
// All three buckets run through KIT.sort in render(), so the order holds
// across the poll's repaint; a header click only paints again.
const RISK_RANK = {low:1, med:2, medium:2, high:3};
const KIT = listKit({page:'remediations', initial:{key:'created',dir:'desc'},
  dir:{id:'desc',created:'desc',conf:'desc',risk:'desc'},
  keys:{id:r=>r.id, status:r=>r.status, class:r=>r.remediation_class,
    risk:r=>RISK_RANK[String(r.risk||'').toLowerCase()]||null,
    conf:r=>r.confidence==null?null:Number(r.confidence), host:r=>r.host_id,
    llm:r=>(r.payload||{}).provider, rec:r=>{ const p=r.payload||{}; return p.recommendation||p.title||''; },
    created:r=>tsKey(r.created_at)},
  onChange:()=>paint()});
// A poll that brought nothing new does not rebuild the tables (CFOP-95). Both
// were replaced by innerHTML every 15 s regardless, which shifted rows under
// the pointer and dropped focus mid-Tab for no reason. The signature is every
// field a row paints from; the age column is refreshed in place instead.
let LAST_SIG = null;
function signature(){
  return ALL.map(r=>{ const p=r.payload||{};
    // The change-record url belongs here for the same reason pr_url does: the
    // row list paints it (CFOP-139). Attaching a record is often the ONLY thing
    // that changes on a poll -- the row is queued before the gate opens the PR
    // and queued after -- so leaving it out means the signature matches,
    // paint() is skipped, and the record column never appears until something
    // unrelated to the record happens to the row.
    return [r.id,r.status,r.remediation_class,r.risk,r.confidence,r.host_id,p.provider,
      String(p.recommendation||p.title||'').slice(0,160),r.pr_url,r.named_pr_url,
      // The tracker item lands on a row by a background tick, often as the
      // ONLY change on a poll -- same trap as the change record above.
      r.tracker_url,r.tracker_state,
      ((r.result||{}).change_record||{}).url].join('\u0001'); }).join('\n');
}
async function load(){
  // A hidden tab has nobody looking; the visibilitychange hook below catches up.
  if(document.hidden) return;
  try { ALL = (await (await fetch('/api/remediations')).json()).remediations || []; } catch(e){ return; }
  const sig = signature();
  if(sig !== LAST_SIG){ LAST_SIG = sig; paint(); } else refreshAges();
  document.getElementById('updated').textContent = 'updated ' + new Date().toLocaleTimeString();
}
function paint(){
  tiles(ALL);
  let rows = filter ? ALL.filter(r=>r.status===filter) : ALL;
  if(Q) rows = rows.filter(r=>{ const p=r.payload||{};
    return textMatch(Q, ['#'+r.id, r.status, r.remediation_class, r.risk, r.host_id, p.provider,
      p.recommendation, p.title, r.tracker_key, r.pr_url, r.named_pr_url]); });
  render(KIT.sort(rows));
}

// The lifecycle strip: every stage in the order a row moves through it, then
// the two ways out that are not "resolved". A zero is dim, so the eye lands
// on where the rows actually are.
const STAGES = [['queued','Queued'],['claimed','Claimed'],['executing','Executing'],['pr-open','PR open'],
  ['verifying','Verifying'],['needs-human','Needs human'],['filed','Filed to tracker'],['resolved','Resolved'],
  ['failed','Failed'],['rejected','Rejected']];
function tiles(rows){
  const c = {}; STATUS.forEach(s=>c[s]=0); rows.forEach(r=>c[r.status]=(c[r.status]||0)+1);
  document.getElementById('tiles').innerHTML = STAGES.map(([s,label])=>
    `<div class="stage" style="--tone:var(${SC[s]})"><span class="n${c[s]?'':' zero'}">${c[s]||0}</span><span class="l">${label}</span></div>`).join('');
  // A tab per status that has rows — plus the one in force, so a filter whose
  // last row just left can still be seen and cleared.
  document.getElementById('filters').innerHTML =
    chip('', 'All', rows.length) +
    STAGES.filter(([s])=>c[s]||filter===s).map(([s,label])=>chip(s, label, c[s]||0)).join('');
}
// Filter tabs are buttons with aria-pressed (CFOP-94): the active filter is
// not signalled by colour alone, and a button is reachable by Tab where the
// span it replaced was not.
function chip(value, label, n){
  const on=filter===value;
  return `<button type="button" class="tab" aria-pressed="${on}" onclick="setFilter('${value}')">${label}<span class="n">${n}</span></button>`;
}
// Rows are focusable rather than links (CFOP-94): a fragment link would push a
// history entry per row, and openFromHash below has no re-entry guard, so a
// link would open the row twice. Enter and Space open, as on a button; a key
// pressed on the PR link inside the row is the link's own.
function rowKey(e,id){
  if(e.target!==e.currentTarget) return;
  if(e.key==='Enter'||e.key===' '){ e.preventDefault(); detail(id); }
}
// The poll repaints both tables by replacing innerHTML, which drops focus from
// the row you were on — every 15 s, mid-Tab. Remember it by id and put it back.
function focusedRow(){ const a=document.activeElement; return (a&&a.id&&a.id.indexOf('row-')===0)?a.id:null; }
function focusDetailClose(){ const x=document.getElementById('detail-close'); if(x&&x.focus) x.focus(); }
function refocusRow(id){ if(!id) return; const el=document.getElementById(id); if(el&&el.focus) el.focus(); }

const TERMINAL = new Set(['resolved', 'rejected']);
function rowHtml(r){
  const p = r.payload||{}; const rec = p.recommendation || p.title || '';
  // The reporting LLM rides under the recommendation; absence means the row
  // predates the tag, not "unknown", so nothing is drawn for it.
  // pr_url is a PR this row tracks; named_pr_url one its recommendation names
  // (CFOP-116); a node-action also has its change-record PR, whose merge
  // authorises shell on a host (CFOP-139). That last one is what an operator
  // most needs to find while scanning the queue, and it was the only one that
  // showed here as an em dash — the gate was reachable only by opening the
  // drawer. A link either way; the drawer says which.
  const crHref = safeUrl((changeRecord(r)||{}).url);
  const prHref = safeUrl(r.pr_url) || crHref || safeUrl(r.named_pr_url);
  const prTitle = safeUrl(r.pr_url) ? ''
    : crHref ? ' title="change record: merging it authorises the commands on this row"'
    : ' title="named in the recommendation; not tracked by this row"';
  const prLabel = (!safeUrl(r.pr_url) && crHref) ? 'record ↗' : 'PR ↗';
  const pr = prHref ? `<a href="${esc(prHref)}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()"${prTitle}>${prLabel}</a>` : '—';
  // The issue this row was handed to (CFOP-170). Its own link beside the PR
  // cell's precedence chain, not inside it: a filed row has no PR at all, and
  // a PR-open row has both and the operator wants both.
  const trHref = safeUrl(r.tracker_url);
  const tr = trHref ? `<a href="${esc(trHref)}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()" title="the issue-tracker item this row was handed to">${esc(r.tracker_key||'issue')} ↗</a>` : '';
  const prCell = tr ? (pr==='—' ? tr : `${pr} · ${tr}`) : pr;
  const under = [p.provider?esc(p.provider):'', r.confidence==null?'':'conf '+esc(r.confidence)].filter(Boolean).join(' · ');
  return `<tr id="row-${r.id}" tabindex="0" onclick="detail(${r.id})" onkeydown="rowKey(event,${r.id})">
    <td class="mono muted">#${r.id}</td>
    <td>${badge(r.status, SC[r.status]||'--text-muted')}</td>
    <td><span class="cls"><span class="mono">${esc(r.remediation_class)}</span>${badge((r.risk||'—')+' risk', RC[r.risk]||'--text-muted')}</span></td>
    <td class="rec"><span class="t">${esc(String(rec).slice(0,240))}</span>${under?`<span class="sub">${under}</span>`:''}</td>
    <td class="mono host" title="${esc(r.host_id)}">${esc(r.host_id)}</td>
    <td class="mono" style="white-space:nowrap">${prCell}</td>
    <td class="mono muted">${fmtTs(r.created_at)}</td></tr>`;
}
// Three buckets (CFOP-170): active, filed, closed. A filed row was handed to
// the issue tracker — it is noted here with its key, and it is not a line item
// asking someone to open it and iterate with the LLM again. The tracker's
// backlog is where it gets groomed or discarded, and the row follows.
const FILED = 'filed';
function render(rows){
  const active = rows.filter(r=>!TERMINAL.has(r.status) && r.status!==FILED);
  const filed = rows.filter(r=>r.status===FILED);
  const done = rows.filter(r=>TERMINAL.has(r.status));
  const focused = focusedRow();
  document.getElementById('rows').innerHTML = active.map(rowHtml).join('');
  document.getElementById('empty').hidden = active.length>0;
  document.getElementById('rows-filed').innerHTML = filed.map(rowHtml).join('');
  document.getElementById('filed-section').hidden = filed.length===0;
  document.getElementById('filed-count').textContent = filed.length ? `(${filed.length})` : '';
  document.getElementById('rows-done').innerHTML = done.map(rowHtml).join('');
  document.getElementById('done-section').hidden = done.length===0;
  document.getElementById('done-count').textContent = done.length ? `(${done.length})` : '';
  refocusRow(focused);
}

// The row the drawer is showing, or null. Ported from investigations.html
// (CFOP-95), where the comment on detail() records the race being hit live.
let OPEN = null;
// The element that opened the drawer, so closing can hand focus back (CFOP-94).
// Held only while open: Escape with nothing open must not move focus.
let OPENER = null;
function closeDetail(){
  const d = document.getElementById('detail');
  d.classList.remove('open'); d.inert = true;
  document.getElementById('backdrop').classList.remove('open');
  OPEN = null;
  restoreFocus();
}
function restoreFocus(){
  const o = OPENER; OPENER = null; if(!o) return;
  // The poll may have replaced the row since; the same id is the same row.
  const t = (o.isConnected===false && o.id) ? document.getElementById(o.id) : o;
  if(t && t.focus) t.focus();
}
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeDetail(); });
// Tab stays inside the open drawer (CFOP-95).
trapFocus(document.getElementById('detail'));
// The attach line's copy icon (CFOP-113) — one delegated listener, see common.js.
bindCopyIcons(document);

async function detail(id){
  const d = document.getElementById('detail');
  d.innerHTML = '<span class="muted">loading…</span>';
  // First open records where focus came from; a re-entry from inside the
  // drawer (an action ending in detail(id)) would record an element about to
  // be painted over.
  if(OPEN===null) OPENER = document.activeElement || null;
  d.classList.add('open'); d.inert = false; document.getElementById('backdrop').classList.add('open');
  OPEN = id;
  let r; try { r = await (await fetch('/api/remediations/'+id)).json(); } catch(e){
    if(OPEN===id){ d.innerHTML='<button type="button" class="x" id="detail-close" onclick="closeDetail()" aria-label="Close">×</button><span class="muted">error loading #'+id+'</span>'; focusDetailClose(); } return; }
  // Two clicks in quick succession race: a slow response for the row you left
  // would otherwise paint over the row you are on. Last click wins, and a
  // stale response is dropped.
  if(OPEN!==id) return;
  const p = r.payload||{};
  d.innerHTML = `
    <button type="button" class="x" id="detail-close" onclick="closeDetail()" aria-label="Close">×</button>
    <h2 id="detail-title" style="margin:0 0 8px">Remediation #${r.id}</h2>
    <div style="margin:0 0 8px;display:flex;gap:8px;flex-wrap:wrap">
      ${r.remediation_class==='manual'
        ? `<button class="chip" onclick="showReclassify(${r.id})">Reclassify first</button>`
        : safeUrl(r.pr_url)
        ? `<a class="chip" href="${esc(safeUrl(r.pr_url))}" target="_blank" rel="noopener noreferrer">Review PR ↗</a>`
        : awaitingRecordMerge(r)
        ? changeRecordChip(r)
        : `<button class="chip" onclick="approve(${r.id})">Approve → queue</button>`}
      ${!awaitingRecordMerge(r)?changeRecordChip(r):''}
      ${!safeUrl(r.pr_url)&&safeUrl(r.named_pr_url)?`<a class="chip" href="${esc(safeUrl(r.named_pr_url))}" target="_blank" rel="noopener noreferrer">Named PR ↗</a>`:''}
      ${trackerChip(r)}
      <button class="chip" onclick="showResolve(${r.id})">Resolve</button>
      <button class="chip" onclick="showReject(${r.id})">Reject</button>
      ${r.remediation_class==='manual'?'':`<button class="chip" onclick="showReclassify(${r.id})">Reclassify</button>`}
      ${r.investigation_id?`<button class="chip" onclick="viewInvestigation(${r.investigation_id})">Investigation #${r.investigation_id}</button>`:''}
      <a class="chip" href="/?remediation=${Number(r.id)}" title="open the console chat on this row">Ask about this</a>
    </div>
    ${r.remediation_class==='manual'?`<div class="muted" style="margin:0 0 8px">manual = human-only work: the executor has nothing to run. Reclassify it (gitops-patch / k8s-action / node-action) for the executor, or do it by hand and Resolve.</div>`:''}
    ${r.status===FILED?`<div class="muted" style="margin:0 0 8px">${trackerCopy(r)}</div>`:''}
    ${r.remediation_class!=='manual'&&safeUrl(r.pr_url)&&!TERMINAL.has(r.status)?`<div class="muted" style="margin:0 0 8px">a PR is open for this row: merge it and the reconciler resolves the row; close it and the row is rejected. Approve is off — the executor would open a second PR.</div>`:''}
    ${r.remediation_class!=='manual'&&!safeUrl(r.pr_url)&&safeUrl(r.named_pr_url)&&!TERMINAL.has(r.status)?`<div class="muted" style="margin:0 0 8px">the recommendation names a PR in this repo that no row tracks. If that PR is the fix, merge it and Resolve; Approve would have the executor open another.</div>`:''}
    <div id="actionform"></div>
    <div class="kv">${badge(r.status,SC[r.status]||'--text-muted')} ${badge(r.risk,RC[r.risk]||'--text-muted')}
      <span class="muted">${esc(r.remediation_class)} · conf ${r.confidence==null?'—':r.confidence}</span></div>
    <div class="kv"><b>host</b> ${esc(r.host_id)}</div>
    <div class="kv"><b>reporting LLM</b> ${p.provider?`<span class="mono">${esc(p.provider)}</span>`:'—'}</div>
    ${decidedByHtml(p.decided_by)}
    ${absorbedHtml(p.absorbed)}
    <div class="kv"><b>source investigation</b> ${r.investigation_id?('#'+r.investigation_id):'—'}</div>
    ${attachBlock(r)}
    <div class="kv"><b>created</b> ${fmtTs(r.created_at,{seconds:true})} · <b>attempts</b> ${r.attempts}</div>
    ${safeUrl(r.pr_url)?`<div class="kv"><b>PR</b> <a href="${esc(safeUrl(r.pr_url))}" target="_blank" rel="noopener noreferrer">${esc(r.pr_url)}</a></div>`
      :safeUrl(r.named_pr_url)?`<div class="kv"><b>PR named</b> <a href="${esc(safeUrl(r.named_pr_url))}" target="_blank" rel="noopener noreferrer">${esc(r.named_pr_url)}</a> <span class="muted">not tracked by this row</span></div>`:''}
    ${prAttemptHtml(p.pr_attempt)}
    ${trackerHtml(r)}
    ${r.last_error?`<div class="kv"><b>last error</b> ${esc(r.last_error)}</div>`:''}
    ${changeRecordHtml(r)}
    ${blockedCommandsHtml(r)}
    ${resolutionHtml(r)}
    <h3>Recommendation</h3><pre>${esc(p.recommendation||p.title||'—')}</pre>
    ${p.targets?`<h3>Targets</h3><pre>${esc(JSON.stringify(p.targets,null,2))}</pre>`:''}
    ${p.observed_check&&p.observed_check.status?`<div class="kv"><b>observed check</b> ${esc(p.observed_check.status)} <span class="muted">${esc(p.observed_check.reason||'')}</span></div>`:''}
    ${p.observed&&p.observed.length?`<h3>Observed</h3><pre>${esc(p.observed.map(o=>(o.source||'')+'\n  → '+(o.value||'')).join('\n'))}</pre>`:''}
    ${p.steps&&p.steps.length?`<h3>Steps</h3><pre>${esc(p.steps.map((s,i)=>(i+1)+'. '+s).join('\n'))}</pre>`:''}
    ${p.verify?`<h3>Verify</h3><pre>${esc((p.verify.command||'')+(p.verify.expect?'\nexpect: '+p.verify.expect:''))}</pre>`:''}
    ${p.rejected&&p.rejected.length?`<h3>Rejected alternatives</h3><pre>${esc(p.rejected.map(x=>(x.alternative||'')+' — '+(x.why_not||'')).join('\n'))}</pre>`:''}
    ${p.finding?`<h3>Finding</h3><pre>${esc(p.finding)}</pre>`:''}
    ${p.evidence?`<h3>Evidence</h3><pre>${esc(p.evidence)}</pre>`:''}
    ${p.proposed_diff?`<h3>Proposed diff</h3><pre>${esc(p.proposed_diff)}</pre>`:''}
    <h3>Payload</h3><pre>${esc(JSON.stringify(p,null,2))}</pre>`;
  focusDetailClose();
}

// Deep-investigation inline PR path outcome (opened / declined / refused / …).
// Distinct from executor-driven pr_url — a decline leaves pr_url null.
// CFOP-71: a node-incident row shows what it absorbed. A collapse that hides
// its inputs reads as "one arbitrary symptom won the race" — the operator
// should be able to see that twelve alerts were one dead node.
function absorbedHtml(list){
  if(!Array.isArray(list) || !list.length) return '';
  return `<div class="kv"><b>absorbed</b> <span class="muted">${list.length} further symptom${list.length===1?'':'s'} of this incident</span>
    <ul style="margin:4px 0 0 18px;padding:0">${list.map(x=>`<li class="muted">${esc(x)}</li>`).join('')}</ul></div>`;
}

// CFOP-70: which models actually made the call. The classifier decides a row
// MAY auto-execute; the judge decides whether it SHOULD. Both are shown because
// this incident needed a code read to work out which model said what.
function decidedByHtml(d){
  if(!d || typeof d!=='object') return '';
  const rows=[];
  const c=d.classifier;
  if(c && c.model) rows.push(`<div class="kv"><b>classified by</b> <span class="mono">${esc([c.backend,c.model].filter(Boolean).join('/'))}</span></div>`);
  const j=d.judge;
  if(j && (j.model||j.verdict)){
    const V={confirm:'--accent',downgrade:'--orange',reject:'--red'};
    const jm=[j.backend,j.model].filter(Boolean).join('/');
    rows.push(`<div class="kv"><b>mutation judge</b> ${j.verdict?badge(j.verdict,V[j.verdict]||'--text-muted'):''}
      ${jm?`<span class="mono">${esc(jm)}</span>`:''}
      ${j.reason?`<div class="muted">${esc(j.reason)}</div>`:''}
      ${judgePeersHtml(j.peers)}</div>`);
  }
  return rows.join('');
}

// CFOP-318: every judge provider tried, not only the one that decided. A row
// parked as "judge unavailable" used to name the last vendor's error; an
// earlier peer's refusal or outage was in the logs only (CFOP-117 deferred
// this). Shown when anything other than one clean verdict happened.
function judgePeersHtml(peers){
  if(!Array.isArray(peers) || !peers.length) return '';
  if(peers.length===1 && peers[0].outcome==='verdict') return '';
  return `<ul style="margin:4px 0 0 18px;padding:0">${peers.map(x=>`<li class="muted"><span class="mono">${esc([x.backend,x.model].filter(Boolean).join('/'))}</span> ${esc(x.outcome||'')}${x.latency_ms!=null?` · ${esc(x.latency_ms)} ms`:''}${x.detail?` — ${esc(x.detail)}`:''}</li>`).join('')}</ul>`;
}

// CFOP-319: the commands the node-action allowlist refused, every one of them,
// from either gate (the agent's before the change record, or the executor's).
// last_error names only the first; this is what tuning the allowlist needs.
function blockedCommandsHtml(r){
  const b=(r.result||{}).blocked_commands;
  if(!Array.isArray(b) || !b.length) return '';
  return `<div class="kv"><b>blocked commands</b> <span class="muted">${b.length} refused by the node-action allowlist</span>
    <ul style="margin:4px 0 0 18px;padding:0">${b.map(x=>`<li><span class="mono">${esc(x.command||'(plan)')}</span> <span class="muted">— ${esc(x.reason||x.kind||'')}</span></li>`).join('')}</ul></div>`;
}

function prAttemptHtml(attempt){
  if(!attempt || typeof attempt!=='object') return '';
  const status = attempt.status || 'unknown';
  const detail = attempt.detail || '';
  const extra = [attempt.path, attempt.branch].filter(Boolean).join(' · ');
  return `<div class="kv"><b>PR attempt</b> ${esc(status)}` +
    (detail?` — ${esc(detail)}`:'') +
    (extra?`<br><span class="muted mono">${esc(extra)}</span>`:'') + `</div>`;
}

// A node-action's change record: the PR whose merge authorises shell on a
// host, plus the exact commands that will run (CFOP-139).
//
// Deliberately NOT r.pr_url. That column is the executor-opened gitops PR, and
// putting the record there would trip two things it has nothing to do with:
// the "a PR is already open, Approve is off" note below, and the CFOP-116
// reconciler that resolves a row when its PR merges. The record lives in
// result.change_record, so it is read and rendered separately.
//
// Without this the whole second gate is invisible: the row shows `queued` and
// `awaiting change-record approval`, and an operator has no way to reach the
// PR they are being asked to merge or to see what it authorises. Found by the
// first live node-action (row #95).
function changeRecord(r){
  const cr = (r.result||{}).change_record;
  return (cr && typeof cr === 'object') ? cr : null;
}
// Parked on the record gate: queued, with the sentinel the agent writes while
// it polls for the merge. NOT "has a change-record url" -- that url is stamped
// at open() and never cleared, so it outlives the gate. Used by both the chip
// decision and the drawer copy so the button and the sentence cannot disagree.
function awaitingRecordMerge(r){
  return r.status === 'queued' && r.last_error === 'awaiting change-record approval';
}
function changeRecordChip(r){
  const href = safeUrl((changeRecord(r)||{}).url);
  return href ? `<a class="chip" href="${esc(href)}" target="_blank" rel="noopener noreferrer" title="merging this authorises the commands below to run on the host">↗ Review change record</a>` : '';
}
function changeRecordHtml(r){
  const cr = changeRecord(r);
  if(!cr) return '';
  const href = safeUrl(cr.url);
  const cmds = ((cr.plan||{}).commands||[]).filter(c=>typeof c==='string');
  // Keyed off the exact state the copy describes, not off TERMINAL. The page
  // treats only resolved/rejected as terminal, so a row failed by a
  // closed-without-merge 409 stays active -- and would otherwise still be told
  // to go merge the PR that was just closed. A claimed row is running, not
  // waiting, for the same reason. This string is what _prepare_node_action_
  // change_record writes while it polls for approval.
  const waiting = awaitingRecordMerge(r);
  return `<h3>Change record</h3>` +
    (href?`<div class="kv"><b>record PR</b> <a href="${esc(href)}" target="_blank" rel="noopener noreferrer">${esc(cr.url)}</a></div>`:'') +
    (cmds.length?`<div class="kv"><b>runs on</b> ${esc(r.host_id)}</div><pre>${esc(cmds.join('\n'))}</pre>`
      :`<div class="muted" style="margin:0 0 8px">no command plan recorded yet</div>`) +
    (waiting&&href?`<div class="muted" style="margin:0 0 8px">this row is waiting on a human, not stuck: merging the record PR authorises exactly the commands above and the executor then runs them. Closing it without merging fails the row instead.</div>`:'');
}

// The issue-tracker item this row was handed to (CFOP-170). Read from the
// fields the API derives from result.tracker — never from pr_url: a filed row
// has no PR, and the "a PR is already open" copy above must not fire for an
// issue link. The drawer shows the key, what the item was last told, and the
// last error if the tick could not reach the tracker.
function trackerInfo(r){ const t=(r.result||{}).tracker; return (t&&typeof t==='object')?t:null; }
function trackerChip(r){
  const href=safeUrl(r.tracker_url);
  return href?`<a class="chip" href="${esc(href)}" target="_blank" rel="noopener noreferrer" title="the issue this row was handed to">↗ ${esc(r.tracker_key||'Issue')}</a>`:'';
}
function trackerCopy(r){
  return `handed off to the issue tracker as ${esc(r.tracker_key||'an issue')}: groom or discard it there and this row follows (done → resolved, cancelled → rejected). Resolve here closes the issue; Approve hands the row to the executor and the issue is told.`;
}
function trackerHtml(r){
  const t=trackerInfo(r); if(!t) return '';
  const href=safeUrl(r.tracker_url||t.url);
  const key=r.tracker_key||t.key||'';
  return `<div class="kv"><b>tracker</b> `+
    (href?`<a href="${esc(href)}" target="_blank" rel="noopener noreferrer">${esc(key||href)}</a>`:esc(key||'—'))+
    (t.synced_status?` <span class="muted">· synced ${esc(t.synced_status)}${t.synced_at?' at '+fmtTs(t.synced_at,{seconds:true}):''}</span>`:'')+
    (t.error?`<br><span style="color:#fbbf24">last tracker error: ${esc(t.error)}${t.error_count?' ('+Number(t.error_count)+'×)':''}</span>`:'')+
    `</div>`;
}

// Every resolved row gets a close line (so completed_at is always visible),
// whichever path closed it. Closed-by-hand rows also carry the why in
// result.resolution_note — last_error is for failures only. Attribution is
// shown only when the row actually says who: operator (console/MCP) or a
// merged PR (reconcile); the executor's completion payload names neither.
function resolutionHtml(r){
  const res = r.result || {};
  const note = res.resolution_note;
  if(r.status!=='resolved' && !note) return '';
  const who = res.resolved_by || (res.pr_merged ? 'PR merge' : '');
  return `<div class="kv"><b>resolved</b>` + (who?` by ${esc(who)}`:'') +
    (r.completed_at?` · ${fmtTs(r.completed_at,{seconds:true,sameDayAs:r.created_at})}`:'') +
    (note?`<br><span class="muted">${esc(note)}</span>`:'') + `</div>`;
}

function setFilter(s){ filter=s; paint(); }
// The search narrows the rows the page already holds (the chips' set), per keystroke.
function searchInput(v){ Q=String(v||'').trim(); paint(); }

// ---- pipeline flags + run-feed ----
const FLAG_LABEL = {queue_feed:'feed',queue_drain:'drain',queue_reap:'reap',queue_verify:'verify',queue_tracker:'tracker',queue_reverify:'re-verify',node_action_enabled:'node-action',model_dedupe:'model-dedupe',model_dedupe_fold:'model-folds'};
async function loadFlags(){
  let f; try{ f = await (await fetch('/api/remediation/flags')).json(); }catch(e){ return; }
  const keys = Object.keys(FLAG_LABEL), on = keys.filter(k=>f[k]).length;
  document.getElementById('flags').innerHTML = keys.map(k=>{
    const warn = k==='queue_drain';
    return `<button type="button" role="switch" aria-checked="${f[k]?'true':'false'}" class="sw${warn?' warn':''}" onclick="toggleFlag('${k}',${!f[k]})">
      <span class="track"><span class="knob"></span></span>
      <span class="swl"><span class="mono">${FLAG_LABEL[k]}</span><span class="note">${f[k]?(warn?'draining queue':'on'):'off'}</span></span></button>`;
  }).join('');
  const sum = document.getElementById('pipe-summary');
  if(sum) sum.textContent = `${on} of ${keys.length} stages on` + (f.queue_drain?' · draining':'');
}
function toggleFlag(name,value){
  if(name==='queue_drain' && value){ confirmDrain(); return; }  // inline confirm, no popup
  if(name==='queue_tracker' && value){ confirmTracker(); return; }
  if(name==='node_action_enabled' && value){ confirmNodeAction(); return; }
  setFlag(name,value);
}
// Turning the tracker on files EVERY parked row without a PR over the next few
// ticks (bounded per tick). Worth a sentence before it happens.
function confirmTracker(){
  document.getElementById('feedmsg').innerHTML =
    `<span style="color:#fbbf24">Enable tracker — every needs-human row without a PR is filed to the issue tracker and moves to "filed"; rows with a PR get an issue too.</span> ` +
    `<button class="chip primary" onclick="setFlag('queue_tracker',true);clearMsg()">Yes, enable</button> ` +
    `<button class="chip" onclick="clearMsg()">Cancel</button>`;
}
function confirmDrain(){
  document.getElementById('feedmsg').innerHTML =
    `<span style="color:#fbbf24">Enable drain — agent will open PRs (you still merge).</span> ` +
    `<button class="chip primary" onclick="setFlag('queue_drain',true);clearMsg()">Yes, enable</button> ` +
    `<button class="chip" onclick="clearMsg()">Cancel</button>`;
}
function confirmNodeAction(){
  document.getElementById('feedmsg').innerHTML =
    `<span style="color:#fbbf24">Enable node-action — approved change records will run allowlisted commands over SSH.</span> ` +
    `<button class="chip primary" onclick="setFlag('node_action_enabled',true);clearMsg()">Yes, enable</button> ` +
    `<button class="chip" onclick="clearMsg()">Cancel</button>`;
}
function clearMsg(){ document.getElementById('feedmsg').textContent=''; }
async function setFlag(name,value){
  try{ await fetch('/api/remediation/flags',{method:'POST',headers:{'Content-Type':'application/json'},
       body:JSON.stringify({name,value})}); toast(FLAG_LABEL[name]+' '+(value?'on':'off'),'ok'); }
  catch(e){ toast('toggle failed','err'); }
  loadFlags();
}
async function runFeed(){
  toast('running summary — rows appear in ~1-2 min','ok');
  try{ await fetch('/api/remediation/run-feed',{method:'POST'}); setTimeout(load,90000); }
  catch(e){ toast('run-feed failed','err'); }
}

// ---- row actions (inline forms + toasts, no browser dialogs) ----
async function act(id,verb,body,okmsg){
  try{ const r=await fetch(`/api/remediations/${id}/${verb}`,{method:'POST',
        headers:{'Content-Type':'application/json'}, body:body?JSON.stringify(body):null});
       if(!r.ok){
         // Surface the server's reason (e.g. the 409 manual-class refusal),
         // not just a bare status code — the reason tells the operator the
         // legitimate next step.
         let msg=verb+' failed ('+r.status+')';
         try{ const e=await r.json(); if(e && e.error) msg=String(e.error); }catch(_){}
         toast(msg,'err'); return; } }
  catch(e){ toast(verb+' failed','err'); return; }
  toast(okmsg||(verb+' ok'),'ok'); await load(); detail(id);
}
function approve(id){ act(id,'approve',null,'approved → queued'); }
function showReject(id){
  document.getElementById('actionform').innerHTML =
    `<div class="actform"><input id="rj-note" placeholder="reason (optional)" style="flex:1;min-width:160px">
     <button class="chip" onclick="saveReject(${id})">Confirm reject</button>
     <button class="chip" onclick="clearForm()">Cancel</button></div>`;
  const el=document.getElementById('rj-note'); if(el) el.focus();
}
function saveReject(id){ act(id,'reject',{note:document.getElementById('rj-note').value},'rejected'); }
function showResolve(id){
  document.getElementById('actionform').innerHTML =
    `<div class="actform"><input id="rs-note" placeholder="what closed it (e.g. fixed by hand, superseded)" style="flex:1;min-width:200px"
       onkeydown="if(event.key==='Enter')saveResolve(${id})">
     <button class="chip" onclick="saveResolve(${id})">Confirm resolve</button>
     <button class="chip" onclick="clearForm()">Cancel</button></div>`;
  const el=document.getElementById('rs-note'); if(el) el.focus();
}
function saveResolve(id){ act(id,'resolve',{note:document.getElementById('rs-note').value},'resolved'); }
// Values are read from the loaded row instead of being passed through an
// inline onclick: LLM-authored fields (class, risk, repo) inside a quoted
// attribute are a script-injection vector HTML escaping alone cannot close.
function showReclassify(id){
  const r = ALL.find(x=>x.id===id) || {};
  const cls = r.remediation_class, risk = r.risk;
  const conf = r.confidence==null?null:r.confidence;
  const repo = (r.payload&&r.payload.repo)||'';
  // chip pickers (not <select>): native dropdowns don't open inside the
  // transform'd drawer, and chips match the theme + are always clickable.
  const pickRow=(group,vals,cur)=> vals.map(v=>
    `<button type="button" class="chip pick ${v===cur?'active':''}" data-g="${group}" data-v="${v}" onclick="pick(this)">${v}</button>`).join(' ');
  document.getElementById('actionform').innerHTML =
    `<div class="actform" style="flex-direction:column;align-items:stretch;gap:10px">
       <div><span class="muted">class</span><br>${pickRow('class',['gitops-patch','k8s-action','k8s-imperative','node-action','data-fix','external-system','manual'],cls)}</div>
       <div><span class="muted">risk</span><br>${pickRow('risk',['low','med','high'],risk)}</div>
       <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
         <span class="muted">repo</span>
         <input id="rc-repo" type="text" value="${esc(repo)}" placeholder="owner/repo (gitops-patch target)" style="flex:1;min-width:200px">
       </div>
       <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
         <span class="muted">conf</span>
         <input id="rc-conf" type="number" min="0" max="1" step="0.05" value="${conf==null?'':conf}" placeholder="keep" style="width:80px">
         <button class="chip" onclick="saveReclassify(${id})">Save</button>
         <button class="chip" onclick="clearForm()">Cancel</button>
       </div>
     </div>`;
}
function pick(btn){
  const g=btn.dataset.g;
  document.querySelectorAll(`#actionform .pick[data-g="${g}"]`).forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}
function saveReclassify(id){
  const sel=g=>{ const b=document.querySelector(`#actionform .pick.active[data-g="${g}"]`); return b?b.dataset.v:undefined; };
  act(id,'reclassify',{remediation_class:sel('class'), risk:sel('risk'),
    confidence:document.getElementById('rc-conf').value,
    repo:document.getElementById('rc-repo').value},'reclassified');
}
async function viewInvestigation(id){
  let inv; try{ inv=await (await fetch('/api/investigations/'+id)).json(); }catch(e){ return; }
  if(inv.error){ document.getElementById('detail').innerHTML+='<p class="muted">investigation not found</p>'; return; }
  document.getElementById('detail').innerHTML +=
    `<h3>Investigation #${id} — ${esc(inv.outcome)}</h3><pre>${esc(JSON.stringify(inv.findings,null,2))}</pre>`;
}

// Deep link from /investigations: /remediations#42 opens that row's drawer.
// The CFOP-73 handoff for the row's investigation (CFOP-109). The string is the
// server's — /api/remediations/<id> renders it from the one definition — so this
// page never spells the command itself. Rows with no investigation get no line.
function attachBlock(r){
  const cmd=r.attach_command;
  if(!cmd) return '';
  return `<div class="kv"><b>take over</b> <code class="mono cmd" id="attach-cmd">${esc(cmd)}</code>${copyIcon('attach command',{from:'attach-cmd'})}</div>`;
}

function openFromHash(){ const m=location.hash.match(/^#(\d+)$/); if(m && +m[1]!==OPEN) detail(+m[1]); }
window.addEventListener('hashchange', openFromHash);

loadFlags();
// The flags row is rebuilt too, so it gets the same hidden-tab skip as load().
function poll(){ if(document.hidden) return; load(); loadFlags(); }
load().then(openFromHash); setInterval(poll, 15000);
// Catch up the moment the tab is looked at again rather than up to 15 s later.
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) poll(); });
</script>
</body>
</html>
