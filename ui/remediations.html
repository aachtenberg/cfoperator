<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CFOperator · Remediations</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* Theme tokens shared with the main page (ui/index.html) */
  :root {
    --bg-primary:#0a0a0f; --bg-secondary:#12121a; --bg-tertiary:#1a1a26; --bg-hover:#22222e;
    --border:#2a2a3a; --border-subtle:#1e1e2e;
    --text-primary:#e0e0e8; --text-secondary:#8888a0; --text-muted:#555566;
    --accent:#22c55e; --accent-dim:#166534; --cyan:#06b6d4; --orange:#f59e0b; --red:#ef4444;
    --purple:#a371f7;
    --radius:10px; --radius-sm:6px; --header-height:56px;
  }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:var(--bg-primary); color:var(--text-primary);
    font-family:'Inter',-apple-system,sans-serif; font-size:14px; }
  header { height:var(--header-height); background:var(--bg-secondary);
    border-bottom:1px solid var(--border); display:flex; align-items:center;
    padding:0 20px; gap:16px; position:sticky; top:0; z-index:10; }
  .logo { font-family:'JetBrains Mono',monospace; font-size:18px; font-weight:700;
    color:var(--accent); letter-spacing:-0.5px; display:flex; align-items:center; gap:10px; }
  .logo svg { width:24px; height:24px; opacity:.9; }
  .logo .sub { color:var(--text-secondary); font-weight:500; font-size:14px; }
  .right { margin-left:auto; display:flex; align-items:center; gap:14px; }
  .muted { color:var(--text-secondary); font-size:12px; }
  a { color:var(--cyan); text-decoration:none; }
  a:hover { text-decoration:underline; }

  .pipeline { display:flex; gap:10px; align-items:center; flex-wrap:wrap;
    padding:12px 20px; border-bottom:1px solid var(--border-subtle); }
  .pipeline .lbl { font-family:'JetBrains Mono',monospace; color:var(--text-secondary);
    font-size:12px; text-transform:uppercase; letter-spacing:.5px; }
  .tiles { display:flex; gap:10px; flex-wrap:wrap; padding:14px 20px 6px; }
  .tile { background:var(--bg-secondary); border:1px solid var(--border); border-radius:var(--radius);
    padding:10px 14px; min-width:118px; }
  .tile .n { font-size:22px; font-weight:700; font-family:'JetBrains Mono',monospace; }
  .tile .l { color:var(--text-muted); font-size:11px; text-transform:uppercase; letter-spacing:.05em; }
  .filters { padding:6px 20px 12px; display:flex; gap:8px; flex-wrap:wrap; }

  .chip { background:var(--bg-tertiary); border:1px solid var(--border); color:var(--text-primary);
    border-radius:var(--radius-sm); padding:5px 11px; cursor:pointer; font-size:13px;
    font-family:inherit; transition:border-color .15s,background .15s; }
  .chip:hover { border-color:var(--text-secondary); }
  .chip.active { background:var(--accent-dim); border-color:var(--accent); color:#fff; }
  .tog.on { background:var(--accent-dim); border-color:var(--accent); color:var(--text-primary); font-weight:600; }
  .tog.drain.on { background:var(--orange); border-color:var(--orange); color:#0a0a0f; }

  table { width:100%; border-collapse:collapse; }
  th,td { text-align:left; padding:9px 12px; border-bottom:1px solid var(--border-subtle); vertical-align:top; }
  th { color:var(--text-secondary); font-weight:600; font-size:11px; text-transform:uppercase;
    letter-spacing:.04em; position:sticky; top:var(--header-height); background:var(--bg-primary); }
  td { font-size:13px; }
  tbody tr { cursor:pointer; }
  tbody tr:hover { background:var(--bg-hover); }
  .mono { font-family:'JetBrains Mono',monospace; }
  .badge { display:inline-block; padding:2px 8px; border-radius:var(--radius-sm); font-size:12px;
    font-weight:600; white-space:nowrap; font-family:'JetBrains Mono',monospace; }
  .rec { max-width:520px; }
  .divider { margin:24px 20px 2px; padding-top:14px; border-top:1px solid var(--border);
    font-family:'JetBrains Mono',monospace; font-size:12px; text-transform:uppercase;
    letter-spacing:.06em; color:var(--text-secondary); }

  #backdrop { position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:40;
    opacity:0; pointer-events:none; transition:opacity .15s; }
  #backdrop.open { opacity:1; pointer-events:auto; }
  #detail { position:fixed; top:0; right:0; width:min(560px,92vw); height:100%; z-index:50;
    background:var(--bg-secondary); border-left:1px solid var(--border); padding:20px;
    overflow:auto; transform:translateX(100%); transition:transform .15s; box-shadow:-8px 0 24px #0008; }
  #detail.open { transform:translateX(0); }
  #detail h2 { font-family:'JetBrains Mono',monospace; }
  #detail pre { background:var(--bg-primary); border:1px solid var(--border-subtle);
    border-radius:var(--radius-sm); padding:10px; overflow:auto; white-space:pre-wrap;
    word-break:break-word; font-size:12px; }
  .kv { margin:4px 0; } .kv b { color:var(--text-secondary); font-weight:600; }
  .x { float:right; cursor:pointer; color:var(--text-secondary); font-size:20px; }
  .empty { padding:40px; text-align:center; color:var(--text-muted); }
  select, input[type="number"], input[type="text"], input:not([type]) {
    background:var(--bg-tertiary); color:var(--text-primary); border:1px solid var(--border);
    border-radius:var(--radius-sm); padding:5px 8px; font-family:'JetBrains Mono',monospace;
    font-size:13px; outline:none; }
  select:focus, input:focus { border-color:var(--accent); }
  .actform { background:var(--bg-tertiary); border:1px solid var(--border); border-radius:var(--radius-sm);
    padding:10px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:8px 0 12px; }
  .actform label { color:var(--text-secondary); font-size:12px; }
  #toasts { position:fixed; bottom:20px; right:20px; display:flex; flex-direction:column; gap:8px; z-index:60; }
  .toast { background:var(--bg-tertiary); border:1px solid var(--border); border-left:3px solid var(--cyan);
    color:var(--text-primary); padding:10px 14px; border-radius:var(--radius-sm); box-shadow:0 4px 16px #0008;
    font-size:13px; min-width:200px; transition:opacity .2s; }
  .toast.ok { border-left-color:var(--accent); }
  .toast.err { border-left-color:var(--red); }
</style>
</head>
<body>
<header>
  <a href="/" class="logo" style="text-decoration:none" title="Back to console">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>
    </svg>
    CFOperator <span class="sub">/ Remediations</span>
  </a>
  <div class="right">
    <span class="muted" id="updated"></span>
  </div>
  <!-- Section nav, identity and logout — see ui/nav.js -->
  <div id="cfop-nav"></div>
</header>
<script src="/nav.js" defer></script>

<div class="pipeline" id="pipeline">
  <span class="lbl">Pipeline</span>
  <span id="flags"></span>
  <button class="chip" onclick="runFeed()">⟳ Run feed-summary</button>
  <span id="feedmsg" class="muted"></span>
</div>
<div class="tiles" id="tiles"></div>
<div class="filters" id="filters"></div>
<table>
  <thead><tr>
    <th>ID</th><th>Status</th><th>Class</th><th>Risk</th><th>Conf</th>
    <th>Host</th><th>LLM</th><th>Recommendation</th><th>Age</th><th>PR</th>
  </tr></thead>
  <tbody id="rows"></tbody>
</table>
<div id="empty" class="empty" hidden>No open remediations.</div>

<div id="done-section" hidden>
  <div class="divider">Closed <span id="done-count" class="muted"></span></div>
  <table>
    <thead><tr>
      <th>ID</th><th>Status</th><th>Class</th><th>Risk</th><th>Conf</th>
      <th>Host</th><th>LLM</th><th>Recommendation</th><th>Age</th><th>PR</th>
    </tr></thead>
    <tbody id="rows-done"></tbody>
  </table>
</div>
<div id="backdrop" onclick="closeDetail()"></div>
<div id="detail"></div>
<div id="toasts"></div>

<script>
const STATUS = ['queued','claimed','executing','pr-open','verifying','resolved','failed','needs-human','rejected'];
const SC = {queued:'--cyan',claimed:'--orange',executing:'--orange','pr-open':'--purple',
  verifying:'--cyan',resolved:'--accent',failed:'--red','needs-human':'--orange',rejected:'--text-muted'};
const RC = {low:'--accent',med:'--orange',high:'--red'};
let filter = '';

function color(v){ return (getComputedStyle(document.documentElement).getPropertyValue(v)||'#888').trim(); }
function badge(text, varname){ const c=color(varname);
  return `<span class="badge" style="background:${c}22;color:${c};border:1px solid ${c}55">${esc(text)||'—'}</span>`; }
function age(iso){ if(!iso) return '—'; const s=(Date.now()-new Date(iso+(iso.endsWith('Z')?'':'Z')).getTime())/1000;
  if(s<90) return Math.round(s)+'s'; if(s<5400) return Math.round(s/60)+'m';
  if(s<129600) return Math.round(s/3600)+'h'; return Math.round(s/86400)+'d'; }
// Quotes matter as much as angle brackets: these values land inside HTML
// attributes (href, value), where a bare " or ' breaks out of the attribute.
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g,
  c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
// Remediation payloads carry LLM-authored URLs; only http(s) reaches href so a
// javascript: link cannot execute in the console. Empty/null must return '' —
// new URL('', base) resolves to the page itself, which rendered a phantom
// "PR ↗" linking back to the console on rows with no PR (CFOP-52).
function safeUrl(u){ const s=String(u==null?'':u).trim(); if(!s) return '';
  try{ const p=new URL(s, window.location.href);
  return (p.protocol==='http:'||p.protocol==='https:')?p.href:''; }catch(e){ return ''; } }
function toast(msg, type){ const c=document.getElementById('toasts'); if(!c) return;
  const t=document.createElement('div'); t.className='toast '+(type||''); t.textContent=msg; c.appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; setTimeout(()=>t.remove(),220); }, 3200); }
function clearForm(){ const f=document.getElementById('actionform'); if(f) f.innerHTML=''; }

let ALL = [];
async function load(){
  try { ALL = (await (await fetch('/api/remediations')).json()).remediations || []; } catch(e){ return; }
  paint();
  document.getElementById('updated').textContent = 'updated ' + new Date().toLocaleTimeString();
}
function paint(){ tiles(ALL); render(filter ? ALL.filter(r=>r.status===filter) : ALL); }

function tiles(rows){
  const c = {}; STATUS.forEach(s=>c[s]=0); rows.forEach(r=>c[r.status]=(c[r.status]||0)+1);
  const show = ['queued','needs-human','pr-open','resolved','rejected','failed'];
  document.getElementById('tiles').innerHTML = show.map(s=>
    `<div class="tile"><div class="n" style="color:${color(SC[s])}">${c[s]||0}</div><div class="l">${s}</div></div>`).join('');
  document.getElementById('filters').innerHTML =
    `<span class="chip ${filter===''?'active':''}" onclick="setFilter('')">all (${rows.length})</span>` +
    STATUS.map(s=>`<span class="chip ${filter===s?'active':''}" onclick="setFilter('${s}')">${s} (${c[s]||0})</span>`).join('');
}

const TERMINAL = new Set(['resolved', 'rejected']);
function rowHtml(r){
  const p = r.payload||{}; const rec = p.recommendation || p.title || '';
  // Reporting LLM only — absence means the row predates the tag, not "unknown".
  const llm = p.provider ? `<span class="mono muted">${esc(p.provider)}</span>` : '—';
  const prHref = safeUrl(r.pr_url);
  const pr = prHref ? `<a href="${esc(prHref)}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">PR ↗</a>` : '—';
  return `<tr onclick="detail(${r.id})">
    <td class="mono">#${r.id}</td>
    <td>${badge(r.status, SC[r.status]||'--text-muted')}</td>
    <td>${esc(r.remediation_class)}</td>
    <td>${badge(r.risk, RC[r.risk]||'--text-muted')}</td>
    <td class="mono">${r.confidence==null?'—':r.confidence}</td>
    <td>${esc(r.host_id)}</td>
    <td>${llm}</td>
    <td class="rec">${esc(String(rec).slice(0,160))}</td>
    <td class="muted">${age(r.created_at)}</td>
    <td>${pr}</td></tr>`;
}
function render(rows){
  const active = rows.filter(r=>!TERMINAL.has(r.status));
  const done = rows.filter(r=>TERMINAL.has(r.status));
  document.getElementById('rows').innerHTML = active.map(rowHtml).join('');
  document.getElementById('empty').hidden = active.length>0;
  document.getElementById('rows-done').innerHTML = done.map(rowHtml).join('');
  document.getElementById('done-section').hidden = done.length===0;
  document.getElementById('done-count').textContent = done.length ? `(${done.length})` : '';
}

function closeDetail(){
  document.getElementById('detail').classList.remove('open');
  document.getElementById('backdrop').classList.remove('open');
}
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeDetail(); });

async function detail(id){
  const d = document.getElementById('detail');
  d.innerHTML = '<span class="muted">loading…</span>';
  d.classList.add('open'); document.getElementById('backdrop').classList.add('open');
  let r; try { r = await (await fetch('/api/remediations/'+id)).json(); } catch(e){ d.innerHTML='error'; return; }
  const p = r.payload||{};
  d.innerHTML = `
    <span class="x" onclick="closeDetail()">×</span>
    <h2 style="margin:0 0 8px">Remediation #${r.id}</h2>
    <div style="margin:0 0 8px;display:flex;gap:8px;flex-wrap:wrap">
      ${r.remediation_class==='manual'
        ? `<button class="chip" onclick="showReclassify(${r.id})">⟳ Reclassify first</button>`
        : `<button class="chip" onclick="approve(${r.id})">✓ Approve → queue</button>`}
      <button class="chip" onclick="showResolve(${r.id})">✔ Resolve</button>
      <button class="chip" onclick="showReject(${r.id})">✕ Reject</button>
      ${r.remediation_class==='manual'?'':`<button class="chip" onclick="showReclassify(${r.id})">⟳ Reclassify</button>`}
      ${r.investigation_id?`<button class="chip" onclick="viewInvestigation(${r.investigation_id})">🔎 Investigation #${r.investigation_id}</button>`:''}
    </div>
    ${r.remediation_class==='manual'?`<div class="muted" style="margin:0 0 8px">manual = human-only work: the executor has nothing to run. Reclassify it (gitops-patch / k8s-action / node-action) for the executor, or do it by hand and ✔ Resolve.</div>`:''}
    <div id="actionform"></div>
    <div class="kv">${badge(r.status,SC[r.status]||'--text-muted')} ${badge(r.risk,RC[r.risk]||'--text-muted')}
      <span class="muted">${esc(r.remediation_class)} · conf ${r.confidence==null?'—':r.confidence}</span></div>
    <div class="kv"><b>host</b> ${esc(r.host_id)}</div>
    <div class="kv"><b>reporting LLM</b> ${p.provider?`<span class="mono">${esc(p.provider)}</span>`:'—'}</div>
    ${decidedByHtml(p.decided_by)}
    ${absorbedHtml(p.absorbed)}
    <div class="kv"><b>source investigation</b> ${r.investigation_id?('#'+r.investigation_id):'—'}</div>
    <div class="kv"><b>created</b> ${esc(r.created_at)} · <b>attempts</b> ${r.attempts}</div>
    ${safeUrl(r.pr_url)?`<div class="kv"><b>PR</b> <a href="${esc(safeUrl(r.pr_url))}" target="_blank" rel="noopener noreferrer">${esc(r.pr_url)}</a></div>`:''}
    ${prAttemptHtml(p.pr_attempt)}
    ${r.last_error?`<div class="kv"><b>last error</b> ${esc(r.last_error)}</div>`:''}
    ${resolutionHtml(r)}
    <h3>Recommendation</h3><pre>${esc(p.recommendation||p.title||'—')}</pre>
    ${p.finding?`<h3>Finding</h3><pre>${esc(p.finding)}</pre>`:''}
    ${p.evidence?`<h3>Evidence</h3><pre>${esc(p.evidence)}</pre>`:''}
    ${p.proposed_diff?`<h3>Proposed diff</h3><pre>${esc(p.proposed_diff)}</pre>`:''}
    <h3>Payload</h3><pre>${esc(JSON.stringify(p,null,2))}</pre>`;
}

// Deep-investigation inline PR path outcome (opened / declined / refused / …).
// Distinct from executor-driven pr_url — a decline leaves pr_url null.
// CFOP-71: a node-incident row shows what it absorbed. A collapse that hides
// its inputs reads as "one arbitrary symptom won the race" — the operator
// should be able to see that twelve alerts were one dead node.
function absorbedHtml(list){
  if(!Array.isArray(list) || !list.length) return '';
  return `<div class="kv"><b>absorbed</b> <span class="muted">${list.length} further symptom${list.length===1?'':'s'} of this incident</span>
    <ul style="margin:4px 0 0 18px;padding:0">${list.map(x=>`<li class="muted">${esc(x)}</li>`).join('')}</ul></div>`;
}

// CFOP-70: which models actually made the call. The classifier decides a row
// MAY auto-execute; the judge decides whether it SHOULD. Both are shown because
// this incident needed a code read to work out which model said what.
function decidedByHtml(d){
  if(!d || typeof d!=='object') return '';
  const rows=[];
  const c=d.classifier;
  if(c && c.model) rows.push(`<div class="kv"><b>classified by</b> <span class="mono">${esc([c.backend,c.model].filter(Boolean).join('/'))}</span></div>`);
  const j=d.judge;
  if(j && (j.model||j.verdict)){
    const V={confirm:'--accent',downgrade:'--orange',reject:'--red'};
    const jm=[j.backend,j.model].filter(Boolean).join('/');
    rows.push(`<div class="kv"><b>mutation judge</b> ${j.verdict?badge(j.verdict,V[j.verdict]||'--text-muted'):''}
      ${jm?`<span class="mono">${esc(jm)}</span>`:''}
      ${j.reason?`<div class="muted">${esc(j.reason)}</div>`:''}</div>`);
  }
  return rows.join('');
}

function prAttemptHtml(attempt){
  if(!attempt || typeof attempt!=='object') return '';
  const status = attempt.status || 'unknown';
  const detail = attempt.detail || '';
  const extra = [attempt.path, attempt.branch].filter(Boolean).join(' · ');
  return `<div class="kv"><b>PR attempt</b> ${esc(status)}` +
    (detail?` — ${esc(detail)}`:'') +
    (extra?`<br><span class="muted mono">${esc(extra)}</span>`:'') + `</div>`;
}

// Every resolved row gets a close line (so completed_at is always visible),
// whichever path closed it. Closed-by-hand rows also carry the why in
// result.resolution_note — last_error is for failures only. Attribution is
// shown only when the row actually says who: operator (console/MCP) or a
// merged PR (reconcile); the executor's completion payload names neither.
function resolutionHtml(r){
  const res = r.result || {};
  const note = res.resolution_note;
  if(r.status!=='resolved' && !note) return '';
  const who = res.resolved_by || (res.pr_merged ? 'PR merge' : '');
  return `<div class="kv"><b>resolved</b>` + (who?` by ${esc(who)}`:'') +
    (r.completed_at?` · ${esc(r.completed_at)}`:'') +
    (note?`<br><span class="muted">${esc(note)}</span>`:'') + `</div>`;
}

function setFilter(s){ filter=s; paint(); }

// ---- pipeline flags + run-feed ----
const FLAG_LABEL = {queue_feed:'feed',queue_drain:'drain',queue_reap:'reap',queue_verify:'verify'};
async function loadFlags(){
  let f; try{ f = await (await fetch('/api/remediation/flags')).json(); }catch(e){ return; }
  document.getElementById('flags').innerHTML = Object.keys(FLAG_LABEL).map(k=>
    `<button class="chip tog ${k==='queue_drain'?'drain':''} ${f[k]?'on':''}" onclick="toggleFlag('${k}',${!f[k]})">${FLAG_LABEL[k]}: ${f[k]?'on':'off'}</button>`).join(' ');
}
function toggleFlag(name,value){
  if(name==='queue_drain' && value){ confirmDrain(); return; }  // inline confirm, no popup
  setFlag(name,value);
}
function confirmDrain(){
  document.getElementById('feedmsg').innerHTML =
    `<span style="color:var(--orange)">Enable drain — agent will open PRs (you still merge).</span> ` +
    `<button class="chip" onclick="setFlag('queue_drain',true);clearMsg()">Yes, enable</button> ` +
    `<button class="chip" onclick="clearMsg()">Cancel</button>`;
}
function clearMsg(){ document.getElementById('feedmsg').textContent=''; }
async function setFlag(name,value){
  try{ await fetch('/api/remediation/flags',{method:'POST',headers:{'Content-Type':'application/json'},
       body:JSON.stringify({name,value})}); toast(FLAG_LABEL[name]+' '+(value?'on':'off'),'ok'); }
  catch(e){ toast('toggle failed','err'); }
  loadFlags();
}
async function runFeed(){
  toast('running summary — rows appear in ~1-2 min','ok');
  try{ await fetch('/api/remediation/run-feed',{method:'POST'}); setTimeout(load,90000); }
  catch(e){ toast('run-feed failed','err'); }
}

// ---- row actions (inline forms + toasts, no browser dialogs) ----
async function act(id,verb,body,okmsg){
  try{ const r=await fetch(`/api/remediations/${id}/${verb}`,{method:'POST',
        headers:{'Content-Type':'application/json'}, body:body?JSON.stringify(body):null});
       if(!r.ok){
         // Surface the server's reason (e.g. the 409 manual-class refusal),
         // not just a bare status code — the reason tells the operator the
         // legitimate next step.
         let msg=verb+' failed ('+r.status+')';
         try{ const e=await r.json(); if(e && e.error) msg=String(e.error); }catch(_){}
         toast(msg,'err'); return; } }
  catch(e){ toast(verb+' failed','err'); return; }
  toast(okmsg||(verb+' ok'),'ok'); await load(); detail(id);
}
function approve(id){ act(id,'approve',null,'approved → queued'); }
function showReject(id){
  document.getElementById('actionform').innerHTML =
    `<div class="actform"><input id="rj-note" placeholder="reason (optional)" style="flex:1;min-width:160px">
     <button class="chip" onclick="saveReject(${id})">Confirm reject</button>
     <button class="chip" onclick="clearForm()">Cancel</button></div>`;
  const el=document.getElementById('rj-note'); if(el) el.focus();
}
function saveReject(id){ act(id,'reject',{note:document.getElementById('rj-note').value},'rejected'); }
function showResolve(id){
  document.getElementById('actionform').innerHTML =
    `<div class="actform"><input id="rs-note" placeholder="what closed it (e.g. fixed by hand, superseded)" style="flex:1;min-width:200px"
       onkeydown="if(event.key==='Enter')saveResolve(${id})">
     <button class="chip" onclick="saveResolve(${id})">Confirm resolve</button>
     <button class="chip" onclick="clearForm()">Cancel</button></div>`;
  const el=document.getElementById('rs-note'); if(el) el.focus();
}
function saveResolve(id){ act(id,'resolve',{note:document.getElementById('rs-note').value},'resolved'); }
// Values are read from the loaded row instead of being passed through an
// inline onclick: LLM-authored fields (class, risk, repo) inside a quoted
// attribute are a script-injection vector HTML escaping alone cannot close.
function showReclassify(id){
  const r = ALL.find(x=>x.id===id) || {};
  const cls = r.remediation_class, risk = r.risk;
  const conf = r.confidence==null?null:r.confidence;
  const repo = (r.payload&&r.payload.repo)||'';
  // chip pickers (not <select>): native dropdowns don't open inside the
  // transform'd drawer, and chips match the theme + are always clickable.
  const pickRow=(group,vals,cur)=> vals.map(v=>
    `<button type="button" class="chip pick ${v===cur?'active':''}" data-g="${group}" data-v="${v}" onclick="pick(this)">${v}</button>`).join(' ');
  document.getElementById('actionform').innerHTML =
    `<div class="actform" style="flex-direction:column;align-items:stretch;gap:10px">
       <div><span class="muted">class</span><br>${pickRow('class',['gitops-patch','k8s-action','k8s-imperative','node-action','manual'],cls)}</div>
       <div><span class="muted">risk</span><br>${pickRow('risk',['low','med','high'],risk)}</div>
       <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
         <span class="muted">repo</span>
         <input id="rc-repo" type="text" value="${esc(repo)}" placeholder="owner/repo (gitops-patch target)" style="flex:1;min-width:200px">
       </div>
       <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
         <span class="muted">conf</span>
         <input id="rc-conf" type="number" min="0" max="1" step="0.05" value="${conf==null?'':conf}" placeholder="keep" style="width:80px">
         <button class="chip" onclick="saveReclassify(${id})">Save</button>
         <button class="chip" onclick="clearForm()">Cancel</button>
       </div>
     </div>`;
}
function pick(btn){
  const g=btn.dataset.g;
  document.querySelectorAll(`#actionform .pick[data-g="${g}"]`).forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}
function saveReclassify(id){
  const sel=g=>{ const b=document.querySelector(`#actionform .pick.active[data-g="${g}"]`); return b?b.dataset.v:undefined; };
  act(id,'reclassify',{remediation_class:sel('class'), risk:sel('risk'),
    confidence:document.getElementById('rc-conf').value,
    repo:document.getElementById('rc-repo').value},'reclassified');
}
async function viewInvestigation(id){
  let inv; try{ inv=await (await fetch('/api/investigations/'+id)).json(); }catch(e){ return; }
  if(inv.error){ document.getElementById('detail').innerHTML+='<p class="muted">investigation not found</p>'; return; }
  document.getElementById('detail').innerHTML +=
    `<h3>Investigation #${id} — ${esc(inv.outcome)}</h3><pre>${esc(JSON.stringify(inv.findings,null,2))}</pre>`;
}

// Deep link from /investigations: /remediations#42 opens that row's drawer.
function openFromHash(){ const m=location.hash.match(/^#(\d+)$/); if(m) detail(+m[1]); }
window.addEventListener('hashchange', openFromHash);

loadFlags();
load().then(openFromHash); setInterval(()=>{ load(); loadFlags(); }, 15000);
</script>
</body>
