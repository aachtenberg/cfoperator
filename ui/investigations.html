<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CFOperator · Investigations</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<!-- The browser cockpit (CFOP-59): xterm.js, vendored — the console reaches no CDN. -->
<link rel="stylesheet" href="/vendor/xterm.css">
<script src="/vendor/xterm.js" defer></script>
<script src="/vendor/xterm-addon-fit.js" defer></script>
<!-- The full report is markdown (CFOP-113); same vendored marked as the chat page. -->
<script src="/vendor/marked.min.js"></script>
<!-- Tokens, the rail and the shared kit: one copy, see ui/console.css. -->
<link rel="stylesheet" href="/console.css">
<style>
  /* ---- the list (CFOP-696) ----
     Rows are items, not a grid of columns: id, outcome and time on one line,
     the trigger under it, then who answered and where the recommendation
     went. It is still the one <table> — listKit sorts by its headers, which
     become a strip of sort buttons — laid out as blocks. */
  #list table, #list tbody, #list thead { display:block; }
  #list > table { min-width:0; }
  #list thead tr { display:flex; flex-wrap:wrap; align-items:center; gap:2px 14px; padding:8px 16px;
    border-bottom:1px solid var(--border-subtle); }
  #list thead tr::before { content:'Sort'; font-size:12px; color:var(--text-dim); }
  #list th { position:static; padding:0; border:0; background:none; }
  #list tbody tr { display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:6px 8px; align-items:center;
    grid-template-areas:"id oc when" "trig trig trig" "meta meta meta";
    padding:12px 16px 12px 14px; border-bottom:1px solid var(--border-faint); border-left:2px solid transparent; }
  #list tbody tr:last-child { border-bottom:0; }
  #list td { display:block; padding:0; border:0; min-width:0; }
  #list td.id { grid-area:id; font-size:12px; color:var(--text-muted); }
  #list td.oc { grid-area:oc; display:flex; flex-wrap:wrap; gap:6px; }
  #list td.when { grid-area:when; font-size:12px; color:var(--text-muted); }
  #list td.trig { grid-area:trig; font-size:14px; font-weight:500; line-height:1.4; overflow-wrap:anywhere; }
  #list td.meta { grid-area:meta; font-size:12px; color:var(--text-muted); overflow-wrap:anywhere; }
  /* The open row: a surface and a rule, and aria-current for anyone not seeing either. */
  #list tbody tr[aria-current="true"] { background:#151522; border-left-color:var(--accent); }
  .list-head { display:flex; flex-direction:column; gap:12px; padding:14px 16px 12px; border-bottom:1px solid var(--border-subtle); }
  .list-head input[type="search"] { width:100%; min-height:40px; }

  /* ---- the pane ----
     Wide enough (DOCK_MQ in the script is this same width), an open
     investigation sits beside the list instead of over it: no backdrop, no
     shadow, and not modal — the script lowers aria-modal to match, and
     trapFocus() lets Tab leave a dialog that says it is not modal. Narrower,
     or maximized, it is the drawer every other page has. */
  #detail { padding:20px 24px 96px; }
  #detail.wide { width:min(1100px,96vw); }
  @media (min-width: 1280px) {
    :root { --list-w:clamp(380px, 32vw, 520px); }
    #backdrop { display:none; }
    #detail { left:calc(var(--rail-w) + var(--list-w)); width:auto; box-shadow:none; background:var(--bg-primary);
      border-left:1px solid var(--border-subtle); transition:none; padding:20px 28px 96px; }
    /* A terminal wants 80 columns: the pane takes the list's room while one is open. */
    #detail.wide { left:var(--rail-w); width:auto; }
    body:has(#detail.open) header, body:has(#detail.open) main.page { max-width:var(--list-w); padding-left:16px; padding-right:16px; }
    /* Docked, the pane is not a layer over the page, so the Ask button is not under it. */
    .cfop-ask { z-index:55; }
    body:has(#detail.max) .cfop-ask, body:has(#detail.wide) .cfop-ask { display:none; }
  }
  /* Maximized (CFOP-113): the whole viewport, rail included. Wins over .wide
     and over the dock; the class is on #detail, which repaints its contents
     but is never itself replaced. */
  #detail.max { left:0; width:100vw; background:var(--bg-secondary); }
  .pane { display:flex; flex-direction:column; gap:16px; max-width:980px; }
  .pane > * { margin:0; }
  .p-head { display:flex; flex-wrap:wrap; align-items:center; gap:10px; }
  .p-head h2 { margin:0 !important; font-size:22px !important; }
  .p-head .end { margin-left:auto; display:flex; align-items:center; gap:4px; }
  .p-head .x { float:none; display:grid; place-items:center; min-width:32px; min-height:32px; border-radius:var(--radius-sm); }
  .p-head .x:hover, .p-head .x[aria-pressed="true"] { color:var(--text-primary); background:var(--bg-tertiary); }
  .p-head .x.mx svg { width:16px; height:16px; }
  .trigger { padding:12px 14px; border-radius:var(--radius-sm); background:var(--bg-secondary);
    border:1px solid var(--border-subtle); font-size:13px; line-height:1.5; overflow-wrap:anywhere; }
  #detail.max .trigger, #detail.max .pcard, #detail.max .p-actions { background:var(--bg-primary); }
  .p-meta { display:flex; flex-wrap:wrap; gap:6px 18px; font-size:13px; color:var(--text-secondary); }
  .p-meta b { font-weight:400; } .p-meta .v { color:var(--text-primary); }
  /* One bar for everything you can do to this investigation: the verdict on
     the left, the ways to dig further after the rule. */
  .p-actions { display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:12px;
    border:1px solid var(--border); border-radius:var(--radius); background:var(--bg-secondary); }
  .p-actions input { flex:1 1 200px; min-width:0; min-height:40px; background:var(--bg-primary); }
  .p-actions .rule { width:1px; height:24px; background:var(--border); }
  .p-actions .chip svg { color:var(--accent); }
  .pcard { border:1px solid var(--border-subtle); border-radius:var(--radius); background:var(--bg-secondary); min-width:0; }
  .pcard > .hd { display:flex; flex-wrap:wrap; align-items:center; gap:10px; padding:12px 16px; border-bottom:1px solid var(--border-subtle); }
  .pcard > .hd h3 { margin:0 !important; }
  .pcard > .bd { padding:14px 16px; display:flex; flex-direction:column; gap:10px; }
  .pcard > .bd > * { margin:0; }
  .pgrid { display:grid; grid-template-columns:repeat(auto-fit, minmax(260px, 1fr)); gap:16px; }
  .prow { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:6px 12px; font-size:13px; }
  .prow > .k { color:var(--text-secondary); }
  .sim { display:flex; align-items:center; gap:8px; font-size:13px; min-width:0; }
  .sim .t { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--text-secondary); }
  .sim .s { font-family:var(--font-mono); font-size:12px; color:var(--text-muted); white-space:nowrap; }
  .sim button { all:unset; cursor:pointer; color:var(--link); font-family:var(--font-mono); }
  .sim button:focus-visible { outline:2px solid var(--cyan); outline-offset:2px; }
  /* Folded sections: the full report and the raw findings are complete but
     closed, so the pane opens on the decision rather than the essay. */
  .fold details { margin:0 !important; border-bottom:1px solid var(--border-subtle); }
  .fold details:last-child { border-bottom:0; }
  .fold summary { display:flex; align-items:center; gap:8px; min-height:44px; padding:0 16px; list-style:none;
    color:var(--text-primary) !important; font-weight:500 !important; }
  .fold summary::-webkit-details-marker { display:none; }
  .fold summary::before { content:''; width:7px; height:7px; border-right:2px solid var(--text-secondary);
    border-top:2px solid var(--text-secondary); transform:rotate(45deg); transition:transform .15s; margin-right:4px; }
  .fold details[open] > summary::before { transform:rotate(135deg); }
  .fold details[open] > summary { margin-bottom:0 !important; }
  .fold details > :not(summary) { margin:0 16px 16px; }
  .rec { font-size:15px; line-height:1.6; }
  /* The recommendation and its fix (CFOP-113): prose and a list, not JSON. */
  .rec { margin:0 0 8px; line-height:1.55; }
  .fix > * { margin:0 0 8px; } .fix > :last-child { margin-bottom:0; } .fix { margin:0 0 8px; }
  .fix-meta { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .tgt { font-size:12px; background:var(--bg-tertiary);
    border:1px solid var(--border); border-radius:var(--radius-sm); padding:2px 8px; }
  .tgt .k { color:var(--text-secondary); }
  ol.steps { padding-left:22px; line-height:1.55; }
  ol.steps li { margin:0; }
  .verify code { font-family:var(--font-mono); font-size:12px; background:var(--bg-primary);
    border:1px solid var(--border-subtle); border-radius:var(--radius-sm); padding:2px 6px; }
  .ev { margin:0 0 8px 8px; font-size:13px; } .ev:last-child { margin-bottom:0; }
  .ev .src { font-family:var(--font-mono); font-size:12px; color:var(--text-secondary); }
  .ev .val { margin-left:12px; white-space:pre-wrap; word-break:break-word; }
  /* Markdown from the agent (the full report) — see renderMarkdown in common.js. */
  .md { font-size:13px; line-height:1.5; }
  .md h1,.md h2,.md h3,.md h4 { font-size:13px; margin:16px 0 8px; } .md > :first-child { margin-top:0; }
  .md p,.md ul,.md ol,.md pre,.md table,.md blockquote { margin:0 0 8px; } .md ul,.md ol { padding-left:22px; }
  .md > :last-child { margin-bottom:0; } .md li { margin:0; }
  .md code { font-family:var(--font-mono); font-size:12px; background:var(--bg-primary);
    border:1px solid var(--border-subtle); border-radius:var(--radius-sm); padding:1px 5px; }
  .md pre code { border:0; padding:0; background:none; }
  .md table { border-collapse:collapse; margin:6px 0; } .md td,.md th { padding:4px 8px; border:1px solid var(--border-subtle); }
  /* The cockpit (CFOP-59): a terminal in the pane, beside the finding — which
     is the reason this is not a new tab. */
  #cockpit { margin:0 0 8px; } #cockpit:empty { display:none; }
  .cp-head { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:8px; }
  .cp-head .chips { display:flex; gap:6px; flex-wrap:wrap; font-family:var(--font-mono); font-size:12px; }
  .cp-head .chips span { background:var(--bg-tertiary); border:1px solid var(--border); border-radius:var(--radius-sm); padding:2px 9px; }
  .cp-head .chips .ttl.low { color:var(--orange); border-color:var(--orange); }
  .cp-head .chips .ttl.out { color:var(--red); border-color:var(--red); }
  .cp-head .actions { margin-left:auto; display:flex; gap:6px; }
  .cp-head .chip.danger { border-color:var(--red); color:var(--red); }
  #term { background:#0a0a0f; border:1px solid var(--border); border-radius:var(--radius-sm); padding:6px; height:min(62vh,560px); overflow:hidden; }
  .cp-status { font-size:12px; color:var(--text-secondary); margin-top:6px; min-height:16px; }
  .cp-status.err { color:var(--red); }
  .cp-note { font-size:12px; color:var(--text-muted); } .cp-note:empty { display:none; }
  /* Explain (CFOP-324): how the investigation got to its answer. A numbered
     timeline; tool rows are <details>, closed until asked, so the drawer
     opens on the summary and the operator unfolds the step that matters. */
  #explain:empty { display:none; }
  #explain { margin:8px 0 0; padding-top:8px; border-top:1px solid var(--border); }
  #explain .xhead { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin:8px 0; }
  #explain .xhead h3 { margin:0; flex-grow:1; }
  #explain .xlink { background:none; border:0; color:var(--cyan); cursor:pointer; padding:2px 4px; font-size:12px; }
  #explain .xlink:focus-visible { outline:2px solid var(--cyan); outline-offset:1px; }
  #explain .xsum { display:flex; gap:6px; flex-wrap:wrap; margin:0 0 8px; }
  #explain .xsum span { font-size:12px; background:var(--bg-tertiary); border:1px solid var(--border);
    border-radius:var(--radius-sm); padding:1px 8px; }
  #explain .xsum .bad { color:#fca5a5; border-color:#5c2323; background:#2a1414; }
  #explain ol { list-style:none; margin:0; padding:0; }
  #explain li.step { display:grid; grid-template-columns:28px minmax(0,1fr); column-gap:10px; }
  #explain .rail { display:flex; flex-direction:column; align-items:center; }
  #explain .num { width:22px; height:22px; border-radius:11px; background:var(--bg-tertiary); border:1px solid var(--border);
    color:var(--text-secondary); font-size:10px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  #explain .line { width:1px; flex-grow:1; background:var(--border); min-height:8px; }
  #explain .body { padding:0 0 12px; min-width:0; }
  #explain .lbl { color:var(--text-secondary); font-size:11px; text-transform:uppercase; letter-spacing:.04em; }
  #explain details.tool > summary { list-style:none; display:flex; align-items:center; gap:8px; background:var(--bg-tertiary);
    border:1px solid var(--border); border-radius:var(--radius-sm); padding:6px 10px; color:var(--text-primary); font-weight:400; }
  #explain details.tool > summary::-webkit-details-marker { display:none; }
  #explain details.tool > summary::before { content:'▸'; color:var(--text-secondary); }
  #explain details.tool[open] > summary::before { content:'▾'; }
  #explain details.tool > summary:focus-visible { outline:2px solid var(--cyan); outline-offset:1px; }
  #explain .tname { color:var(--cyan); font-weight:600; }
  #explain .targs { color:var(--text-secondary); font-size:12px; flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #explain .tdur { color:var(--text-secondary); font-size:12px; white-space:nowrap; }
  #explain .st { padding:1px 8px; border-radius:var(--radius-sm); font-size:11px; font-weight:600; white-space:nowrap; border:1px solid; }
  #explain .st.success { color:#86efac; background:#0f1f15; border-color:#1f4a2c; }
  #explain .st.error { color:#fca5a5; background:#2a1414; border-color:#5c2323; }
  #explain .st.refused { color:#c4b5fd; background:#1e1830; border-color:#3e3266; }
  #explain .tbody { margin:8px 0 0 18px; display:flex; flex-direction:column; gap:6px; }
  #explain pre.err { border-color:#5c2323; color:#fca5a5; }
  #explain .pill { padding:1px 7px; border-radius:var(--radius-sm); font-size:11px; font-weight:600; background:#3a2a0c; color:#fbbf24; }
  #explain .answer { background:#0f1f15; border:1px solid #1f4a2c; border-radius:var(--radius-sm); padding:8px 10px; white-space:pre-wrap; word-break:break-word; }
  #explain .say { white-space:pre-wrap; word-break:break-word; }
  #explain .trunc { background:#24190a; border:1px solid #6b4a12; color:#fde68a; border-radius:var(--radius-sm); padding:8px 10px; }
  #explain .none { background:var(--bg-tertiary); border:1px dashed var(--border); border-radius:var(--radius-sm); padding:12px; }
  #explain .xerr { background:#2a1414; border:1px solid #5c2323; color:#fca5a5; border-radius:var(--radius-sm); padding:8px 10px;
    display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
</style>
</head>
<body>
<header>
  <h1 class="page-title">Investigations</h1>
  <span class="muted" id="updated"></span>
  <!-- The rail: section nav, status, identity and logout — see ui/nav.js -->
  <div id="cfop-nav"></div>
</header>
<script src="/nav.js" defer></script>
<main class="page">
<section class="card" id="list" aria-label="Investigation list">
  <div class="list-head">
    <div class="tabs" id="filters" aria-label="Outcome"></div>
    <input type="search" id="f-q" aria-label="Search investigations" placeholder="Trigger, outcome, model, or #id" oninput="searchInput(this.value)">
  </div>
  <!-- Sortable headers (CFOP-412): data-sort names a key the script defines for listKit.
       The rows are laid out as items, so the header row reads as a strip of sort buttons. -->
  <table>
    <thead><tr><th data-sort="id">ID</th><th data-sort="outcome">Outcome</th><th data-sort="trigger">Trigger</th><th data-sort="llm">LLM</th><th data-sort="remediation">Remediation</th><th data-sort="duration">Duration</th><th data-sort="started">Started</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <div id="empty" class="empty" hidden>No investigations match this filter.</div>
</section>
</main>
<div id="backdrop" onclick="closeDetail()" aria-hidden="true"></div>
<!-- A dialog (CFOP-94): inert while closed so its off-screen controls are not in the tab
     order; detail() lifts it, closeDetail() restores it. Labelled by the h2 detail() paints. -->
<div id="detail" role="dialog" aria-modal="true" aria-labelledby="detail-title" inert></div>
<div id="toasts"></div>

<!-- esc/badge/color/fmtTs/listKit/toast/trapFocus — one copy, see ui/common.js. Not deferred:
     the script below calls them at top level. -->
<script src="/common.js"></script>
<script>
const OUTCOMES = ['resolved','needs_action','monitoring','escalated','escalate','failed','in_progress','retry'];
const OC = {resolved:'--accent',needs_action:'--orange',monitoring:'--cyan',escalated:'--red',
  escalate:'--red',failed:'--red',in_progress:'--text-muted',retry:'--purple'};
let filter='', Q='', ALL=[], REMS={}, REMID={};

// Sortable headers and the search box (CFOP-412): one kit in common.js, the
// page supplies what each column sorts by. The remediation column sorts by
// the linked row's id, which is what the cell shows; rows with none go last.
// paint() runs every row through KIT.sort, so the order holds across the
// poll's repaint; a header click only paints again.
const KIT=listKit({page:'investigations', initial:{key:'started',dir:'desc'},
  dir:{id:'desc',started:'desc',duration:'desc'},
  keys:{id:r=>r.id, outcome:r=>r.outcome, trigger:r=>r.trigger, llm:r=>r.provider,
    remediation:r=>{ const m=linkedRem(r); return m?Number(m.id):null; },
    duration:r=>r.duration_seconds, started:r=>tsKey(r.started_at)},
  onChange:()=>paint()});

// A poll that brought nothing new does not rebuild the table (CFOP-95). The
// rows were replaced by innerHTML every 20 s regardless, which shifted them
// under the pointer and dropped focus mid-Tab for no reason. The signature is
// every field a row paints from — including the linked remediation, which can
// change while the investigation does not; the age column is refreshed in
// place instead of by repaint.
let LAST_SIG=null;
function signature(){
  return ALL.map(r=>{ const m=REMS[r.id]||(r.remediation_id?REMID[r.remediation_id]:null)||{};
    return [r.id,r.outcome,r.triage_action,r.trigger,r.provider,r.duration_seconds,r.completed_at,m.id,m.status,r.remediation_id,r.remediation_pr_url].join('\u0001'); }).join('\n');
}
async function load(){
  // A hidden tab has nobody looking; the visibilitychange hook below catches up.
  if(document.hidden) return;
  try{ ALL=(await (await fetch('/api/investigations?limit=80')).json()).investigations||[]; }catch(e){ return; }
  // Linked remediation rows (CFOP-46): map investigation_id -> newest row so a
  // needs_action investigation shows where its recommendation went — or,
  // explicitly, that it went nowhere. Server-side filter was rejected in
  // CFOP-29; the list is newest-first, so first-seen wins.
  try{
    const rows=(await (await fetch('/api/remediations?limit=500')).json()).remediations||[];
    REMS={}; REMID={};
    rows.forEach(r=>{ if(r.investigation_id!=null && !(r.investigation_id in REMS)) REMS[r.investigation_id]=r; REMID[r.id]=r; });
  }catch(e){ /* linkage is enhancement — the table still renders without it */ }
  const sig=signature();
  if(sig!==LAST_SIG){ LAST_SIG=sig; paint(); } else refreshAges();
  document.getElementById('updated').textContent='updated '+new Date().toLocaleTimeString();
}
// LLM-adjacent URLs: only http(s) reaches href (same posture as
// remediations.html). Empty/null must return '' — new URL('', base) resolves
// to the page itself and rendered phantom links (CFOP-52).
function safeUrl(u){ const s=String(u==null?'':u).trim(); if(!s) return '';
  try{ const p=new URL(s, window.location.href);
  return (p.protocol==='http:'||p.protocol==='https:')?p.href:''; }catch(e){ return ''; } }
// Deduped repeats carry only the id (the map keys the row under the FIRST
// investigation); resolve through REMID so they still get a status chip.
function linkedRem(r){ return REMS[r.id] || (r.remediation_id ? (REMID[r.remediation_id]||{id:r.remediation_id,status:''}) : null); }
function remLink(r){
  const m=linkedRem(r);
  if(m) return `<a href="/remediations#${m.id}" onclick="event.stopPropagation()">#${m.id}${m.status?' '+esc(m.status):''}</a>`;
  const pr=safeUrl(r.remediation_pr_url);
  if(pr) return `<a href="${esc(pr)}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">PR ↗</a>`;
  return r.outcome==='needs_action' ? 'no remediation' : '';
}
// Where the recommendation went, in the Recommendation card's head: on
// needs_action, "no remediation" must be stated, not inferred from absence.
// findings.remediation_id covers rows newer than the 500-row map; an
// inline-proposer PR (findings.remediation_proposal.remediation_pr) counts as
// a remediation too — that path deliberately bypasses the queue.
function remDrawerLine(r){
  const f=r.findings||{};
  const m=REMS[r.id] || (f.remediation_id ? (REMID[f.remediation_id]||{id:f.remediation_id, status:''}) : null);
  if(m) return `<a class="badge" style="--tone:var(--purple)" href="/remediations#${m.id}">remediation #${m.id}${m.status?' '+esc(m.status):''}</a>`;
  const pr=(f.remediation_proposal||{}).remediation_pr||{};
  const prUrl=pr.status==='opened'?safeUrl(pr.html_url):'';
  if(prUrl) return `<a class="mono" href="${esc(prUrl)}" target="_blank" rel="noopener noreferrer">PR opened ↗</a>`;
  return r.outcome==='needs_action' ? `<span class="muted">no remediation proposed</span>` : '';
}
// Institutional-memory citations (CFOP-31): findings.similar_past records the
// past investigations the orient phase actually fed into the prompt — a fact
// about this run, not the LLM's prose. Ids open in this same pane.
function similarBlock(f){
  const s=f.similar_past||[];
  if(!s.length) return '';
  return `<section class="pcard" aria-label="Similar past investigations"><div class="hd"><h3>Seen before</h3><span class="muted">${s.length} similar</span></div><div class="bd">`+s.map(p=>
    `<div class="sim">${p.id!=null?`<button type="button" onclick="detail(${Number(p.id)})">#${Number(p.id)}</button>`:''}`+

      body: JSON.stringify({action, note})});
    if(!res.ok){ toast('triage failed: '+res.status+(res.status===403?' (admin only)':''),'err'); return; }
  }catch(e){ toast('triage failed','err'); return; }
  await detail(id); load();
}
// ---- the browser cockpit (CFOP-59) ------------------------------------
// One click on the investigation → a briefed session on the affected host, in
// this drawer. The agent's bridge (CFOP-75) carries the bytes; the console's
// /open hands back a live session, the websocket URL and a one-shot ticket
// that is spent the moment the bridge verifies it. The page never keeps a
// credential: a reconnect is another /open.
let ADMIN=false, ROLE_KNOWN=false;
async function learnRole(){
  if(ROLE_KNOWN) return;
  try{ const who=await window.CFOP.me(); ADMIN=!!(who && (who.role==='admin' || who.auth_disabled)); }
  catch(e){ ADMIN=false; }
  ROLE_KNOWN=true;
}
// What the bridge's close code means for the person reading it. Each code is a
// different next action, which is why the bridge spends five of them rather
// than one 1008 — a single shrug would make "sign in again" and "this one is
// in the cluster" the same sentence.
function closeReason(code, reason){
  const why=reason?(' — '+reason):'';
  switch(Number(code)){
    case 4401: return 'the ticket was not accepted'+why+'. Reopen to get a fresh one; if that fails, sign in again.';
    case 4403: return 'refused'+why+'. Either this console is not in cockpit.bridge_origins, or the token lacks investigate scope.';
    case 4404: return 'no live session on the host'+why+'. Reopen to start one.';
    case 4409: return 'this cockpit is a pod'+why+'. The browser terminal serves host tiers only — use the attach line.';
    case 4429: return 'the bridge is carrying its maximum terminals'+why+'. Close one, or wait.';
    case 1000: case 1005: return 'session ended'+why+'.';
    case 1006: return 'connection dropped'+why+'. Reopen to reconnect.';
    default: return 'closed ('+code+')'+why+'.';
  }
}
// m:ss until the host's deadline; the chip turns amber under five minutes and
// red at zero, because the session dies at the deadline whether or not you
// were typing.
function fmtTTL(seconds){
  const s=Math.max(0, Math.floor(Number(seconds)||0));
  return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
}
function ttlClass(seconds){ const s=Number(seconds)||0; return s<=0?'ttl out':(s<300?'ttl low':'ttl'); }
// The bridge's wire protocol, kept in two small functions so a test can hold
// them still: text frames are control, binary frames are terminal bytes.
function authFrame(ticket){ return JSON.stringify({type:'auth', token:ticket}); }
function resizeFrame(cols, rows){ return JSON.stringify({type:'resize', cols:cols, rows:rows}); }

// var, not const: the console tests read this state through the page's global
// scope, and a top-level const is not a property of it.
var COCKPIT={id:null, ws:null, term:null, fit:null, observer:null, refitting:false, timer:null, expires:null, lastError:''};

async function openCockpit(id){
  const btn=document.getElementById('open-cockpit'), note=document.getElementById('cockpit-note');
  if(btn) btn.textContent='opening…';
  if(note) note.textContent='';
  let res, body;
  try{ res=await fetch(`/api/cockpit/${id}/open`,{method:'POST', headers:{'Content-Type':'application/json'}, body:'{}'});
       body=await res.json(); }
  catch(e){ if(btn) btn.textContent='Open cockpit'; toast('could not reach the console','err'); return; }
  if(btn) btn.textContent='Open cockpit';
  if(!res.ok){
    // A refusal says why, next to the button, and the attach line is still
    // right there — the fallback is the copy button, not an error page.
    const msg=body&&body.error?body.error:('open failed: '+res.status+(res.status===403?' (admin only)':''));
    if(note) note.textContent=msg; toast(msg,'err'); return;
  }
  if(OPEN!==id) return;
  // The session may not be on the machine this investigation is about
  // (cockpit.fallback_host, CFOP-177). What the operator otherwise reads on
  // success is `tier@host` and nothing else, so an unexpected host would
  // arrive with no explanation — and the drawer's own host line still names
  // the affected one. Same span the refusals use; it survives mountCockpit.
  if(note && body.placement_note) note.textContent=body.placement_note;
  mountCockpit(id, body);
}

function mountCockpit(id, s){
  disconnectCockpit();
  const b=s.bridge||{};
  const where=(s.tier||'?')+'@'+(s.host||'?');
  const el=document.getElementById('cockpit'); if(!el) return;
  el.innerHTML=`
    <div class="cp-head">
      <div class="chips"><span>#${Number(id)}</span><span>${esc(where)}</span><span>scope: ${esc(b.scope||'investigate')}</span><span class="ttl" id="cp-ttl">TTL —</span></div>
      <div class="actions">
        <button type="button" class="chip" onclick="openCockpit(${Number(id)})" title="reconnect to the session on the host">reattach</button>
        <button type="button" class="chip danger" onclick="killCockpit(${Number(id)})" title="remove the session from the host and revoke its tokens">kill</button>
        <button type="button" class="chip" onclick="disconnectCockpit()" title="close this terminal; the session stays until its TTL">disconnect</button>
      </div>
    </div>
    <div id="term"></div>
    <div class="cp-status" id="cp-status">connecting…</div>`;
  document.getElementById('detail').classList.add('wide');
  COCKPIT.id=id; COCKPIT.expires=s.expires_at||null; COCKPIT.lastError='';
  startCountdown();

  // The vendored library loads deferred; a click cannot beat it in practice,
  // but a page served with the vendor files missing would throw here, and a
  // thrown error is a blank box with "connecting…" under it forever.
  if(!window.Terminal || !window.FitAddon){ setStatus('terminal library not loaded (/vendor/xterm.js) — reload the page, or use the attach line', true); return; }
  const term=new window.Terminal({cursorBlink:true, fontFamily:"'JetBrains Mono',monospace", fontSize:13, scrollback:5000,
    theme:{background:'#0a0a0f', foreground:'#e0e0e8', cursor:'#22c55e'}});
  const fit=new window.FitAddon.FitAddon();
  term.loadAddon(fit); term.open(document.getElementById('term')); fit.fit();
  COCKPIT.term=term; COCKPIT.fit=fit;

  const ws=new WebSocket(b.url); ws.binaryType='arraybuffer'; COCKPIT.ws=ws;
  const enc=new TextEncoder();
  ws.onopen=()=>{ ws.send(authFrame(b.ticket)); ws.send(resizeFrame(term.cols, term.rows)); setStatus('connected — '+where); term.focus(); };
  ws.onmessage=ev=>{
    if(typeof ev.data==='string'){
      let f=null; try{ f=JSON.parse(ev.data); }catch(e){ return; }
      if(f && f.type==='error') COCKPIT.lastError=f.reason||'';
      return;
    }
    term.write(new Uint8Array(ev.data));
  };
  ws.onclose=ev=>{ if(COCKPIT.ws!==ws) return; COCKPIT.ws=null; setStatus('disconnected: '+closeReason(ev.code, COCKPIT.lastError), true); stopCountdown(); };
  ws.onerror=()=>{ /* onclose follows with the code; nothing useful to say here */ };
  term.onData(d=>{ if(ws.readyState===1) ws.send(enc.encode(d)); });
  term.onResize(sz=>{ if(ws.readyState===1) ws.send(resizeFrame(sz.cols, sz.rows)); });
  // Fit to the box, not to the window. The drawer widens over a 150 ms
  // transition when the terminal mounts (and again on maximize), and the
  // fit() above ran at the transition's first frame — the pre-wide width,
  // which is ~80 columns. Nothing refit afterwards unless the window itself
  // resized, so a 1100px pane ran an 80-column shell (CFOP-166). Observing
  // #term catches every width change: the transition, maximize, a font load.
  window.addEventListener('resize', refit);
  if(typeof ResizeObserver!=='undefined'){
    COCKPIT.observer=new ResizeObserver(()=>refit());
    COCKPIT.observer.observe(document.getElementById('term'));
  }
}
function refit(){
  if(!COCKPIT.fit || COCKPIT.refitting) return;
  // One fit per frame: the observer fires for every frame of the transition.
  COCKPIT.refitting=true;
  requestAnimationFrame(()=>{ COCKPIT.refitting=false; if(COCKPIT.fit){ try{ COCKPIT.fit.fit(); }catch(e){} } });
}
function setStatus(text, isErr){ const s=document.getElementById('cp-status'); if(s){ s.textContent=text; s.className='cp-status'+(isErr?' err':''); } }
function startCountdown(){
  stopCountdown();
  const tick=()=>{ const c=document.getElementById('cp-ttl'); if(!c) return;
    if(!COCKPIT.expires){ c.textContent='TTL —'; return; }
    const left=COCKPIT.expires-Math.floor(Date.now()/1000);
    c.textContent='TTL '+fmtTTL(left); c.className=ttlClass(left);
    if(left<=0) stopCountdown(); };
  tick(); COCKPIT.timer=setInterval(tick, 1000);
}
function stopCountdown(){ if(COCKPIT.timer){ clearInterval(COCKPIT.timer); COCKPIT.timer=null; } }
// Disconnect closes the socket and the terminal; the session on the host is
// left to its TTL (and, once tmux is in play, to be reattached). Kill is the
// other button.
function disconnectCockpit(){
  const ws=COCKPIT.ws; COCKPIT.ws=null;
  if(ws){ try{ ws.close(1000); }catch(e){} }
  if(COCKPIT.term){ try{ COCKPIT.term.dispose(); }catch(e){} }
  COCKPIT.term=null; COCKPIT.fit=null; stopCountdown();
  // The observer holds the #term node, which the innerHTML below detaches:
  // without this every reattach leaves one behind, watching a dead element.
  if(COCKPIT.observer){ try{ COCKPIT.observer.disconnect(); }catch(e){} COCKPIT.observer=null; }
  window.removeEventListener('resize', refit);
  const d=document.getElementById('detail'); if(d) d.classList.remove('wide');
  const el=document.getElementById('cockpit'); if(el && COCKPIT.id!==null) el.innerHTML='';
  COCKPIT.id=null;
}
async function killCockpit(id){
  if(!confirm(`Remove the cockpit for #${id} from the host and revoke its tokens?`)) return;
  let res, body;
  try{ res=await fetch(`/api/cockpit/${id}/close`,{method:'POST', headers:{'Content-Type':'application/json'}, body:'{}'});
       body=await res.json(); }
  catch(e){ toast('could not reach the console','err'); return; }
  if(!res.ok){ toast(body&&body.error?body.error:('kill failed: '+res.status),'err'); return; }
  disconnectCockpit();
  toast(`cockpit removed from ${body.host} · ${body.tokens_revoked||0} token(s) revoked`,'ok');
}

// Explain (CFOP-324): the trace the agent recorded while it investigated —
// what it was told, what it said, each tool call and the (already redacted)
// result it was handed, provider switches, the answer. Loaded on click, not
// with the drawer: most opens never need it. Everything is untrusted text —
// tool output above all — so every value goes through esc().
let EXPLAIN=null;
function fmtMs(ms){ if(ms==null) return ''; return ms<1000? ms+' ms' : (ms/1000).toFixed(ms<10000?1:0)+' s'; }
function argSummary(a){
  if(a==null) return '';
  if(typeof a!=='object') return String(a);
  return Object.keys(a).map(k=>{ const v=a[k]; return typeof v==='object'? k+'=…' : String(v); }).join(' · ');
}
const ST_LABEL={success:'ok', error:'error', refused:'refused'};
function explainStep(s, i){
  const rail=`<div class="rail"><span class="num">${i+1}</span><span class="line"></span></div>`;
  let b='';
  if(s.kind==='tool'){
    const st=ST_LABEL[s.status]?s.status:'error';
    const res=String(s.result||''); const size=s.length!=null?`${Number(s.length).toLocaleString()} chars${s.length>res.length?' · first '+res.length.toLocaleString()+' shown':''}`:'';
    b=`<details class="tool"><summary><span class="tname">${esc(s.tool)}</span><span class="targs">${esc(argSummary(s.args))}</span>
      <span class="tdur">${s.cached?'cached':esc(fmtMs(s.duration_ms))}</span><span class="st ${st}">${ST_LABEL[st]}</span></summary>
      <div class="tbody"><div class="lbl">arguments</div><pre>${esc(JSON.stringify(s.args,null,2))}</pre>
      <div><span class="lbl">result</span> <span class="muted">${esc(size)}</span></div>
      <pre class="${st==='error'?'err':''}">${esc(s.result)}</pre></div></details>`;
  } else if(s.kind==='prompt'){
    b=`<details><summary>What the model was told <span class="muted">(${Number((s.text||'').length).toLocaleString()} chars)</span></summary><pre>${esc(s.text)}</pre></details>`;
  } else if(s.kind==='fallback'){
    b=`<div><span class="pill">provider switch</span> ${esc(s.text)}</div>`;
  } else if(s.kind==='assistant'){
    b=`<div class="lbl">model${s.model?' · '+esc(s.model):''}</div><div class="say">${esc(s.text)}</div>`;
  } else if(s.kind==='answer'){
    b=`<div class="lbl">final answer${s.model?' · '+esc(s.model):''}</div><div class="answer">${esc(s.text)}</div>`;
  } else if(s.kind==='truncated'){
    b=`<div class="trunc">${esc(s.text)}</div>`;
  } else {
    b=`<div class="say">${esc(s.text||'')}</div>`;
  }
  return `<li class="step">${rail}<div class="body">${b}</div></li>`;
}
function explainSummary(steps){
  const tools=steps.filter(s=>s.kind==='tool');
  const n=(k)=>tools.filter(s=>s.status===k).length;
  const sw=steps.filter(s=>s.kind==='fallback').length;
  const red=tools.reduce((a,s)=>a+((String(s.result).match(/\*\*\*/g)||[]).length),0);
  const parts=[`<span>${tools.length} tool call${tools.length===1?'':'s'}</span>`];
  if(sw) parts.push(`<span>${sw} provider switch${sw===1?'':'es'}</span>`);
  if(n('error')) parts.push(`<span class="bad">${n('error')} error${n('error')===1?'':'s'}</span>`);
  if(n('refused')) parts.push(`<span>${n('refused')} refused</span>`);
  if(red) parts.push(`<span>${red} value${red===1?'':'s'} redacted</span>`);
  return `<div class="xsum">${parts.join('')}</div>`;
}
function explainAll(open){ document.querySelectorAll('#explain details').forEach(d=>{ d.open=open; }); }
async function toggleExplain(id){
  const box=document.getElementById('explain'), btn=document.getElementById('explain-btn');
  if(!box) return;
  if(EXPLAIN===id){ EXPLAIN=null; box.innerHTML=''; if(btn){ btn.classList.remove('active'); btn.setAttribute('aria-expanded','false'); }
    history.replaceState(null,'','#'+id); return; }
  EXPLAIN=id; if(btn){ btn.classList.add('active'); btn.setAttribute('aria-expanded','true'); }
  history.replaceState(null,'','#'+id+'/explain');
  box.innerHTML='<span class="muted">loading steps…</span>';
  let body;
  try{
    const res=await fetch('/api/investigations/'+id+'/explain');
    if(!res.ok) throw new Error(res.status===401?'401 — signed out':res.status===404?'404 — no such investigation':'HTTP '+res.status);
    body=await res.json();
  }catch(e){
    if(EXPLAIN!==id || OPEN!==id) return;
    box.innerHTML=`<div class="xerr" role="alert"><span style="flex:1 1 240px">Could not load the steps${e&&e.message?' ('+esc(e.message)+')':''}. The rest of the drawer is unaffected.</span>
      <button type="button" class="chip" onclick="EXPLAIN=null;toggleExplain(${Number(id)})">Retry</button></div>`;
    return;
  }
  if(EXPLAIN!==id || OPEN!==id) return;
  const steps=Array.isArray(body.steps)?body.steps:[];
  const head=`<div class="xhead"><h3>How it got there</h3>${steps.length?'<button type="button" class="xlink" onclick="explainAll(true)">Expand all</button><button type="button" class="xlink" onclick="explainAll(false)">Collapse all</button>':''}</div>`;
  if(!steps.length){
    const msg=body.reason==='pruned'
      ? `<b>Steps pruned</b><div class="muted">Steps are kept for ${Number(body.retention_days)||30} days (investigations.trace_retention_days). The findings and any cockpit sessions stay.</div>`
      : `<b>Not recorded</b><div class="muted">This investigation ran before its steps were recorded. Only its conclusion was kept: see the recommendation and the full report.</div>`;
    box.innerHTML=head+`<div class="none">${msg}</div>`;
    return;
  }
  box.innerHTML=head+explainSummary(steps)+`<ol>${steps.map(explainStep).join('')}</ol>`;
}

// Inbound only: a pasted or edited URL, and the reload case. detail() keeps
// the hash in step from the other direction without coming through here.
function openFromHash(){
  const m=location.hash.match(/^#(\d+)(\/explain)?$/); if(!m) return;
  if(+m[1]!==OPEN) detail(+m[1], {explain:!!m[2]});
  else if(m[2] && EXPLAIN!==OPEN) toggleExplain(OPEN);
}
window.addEventListener('hashchange', openFromHash);

load().then(openFromHash); setInterval(load, 20000);
// load() skips a hidden tab; catch up the moment it is looked at again rather
// than up to 20 s later.
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) load(); });
</script>
</body>
