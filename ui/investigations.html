<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CFOperator · Investigations</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<!-- The browser cockpit (CFOP-59): xterm.js, vendored — the console reaches no CDN. -->
<link rel="stylesheet" href="/vendor/xterm.css">
<script src="/vendor/xterm.js" defer></script>
<script src="/vendor/xterm-addon-fit.js" defer></script>
<style>
  :root {
    --bg-primary:#0a0a0f; --bg-secondary:#12121a; --bg-tertiary:#1a1a26; --bg-hover:#22222e;
    --border:#2a2a3a; --border-subtle:#1e1e2e;
    --text-primary:#e0e0e8; --text-secondary:#8888a0; --text-muted:#555566;
    --accent:#22c55e; --cyan:#06b6d4; --orange:#f59e0b; --red:#ef4444; --purple:#a371f7;
    --radius:10px; --radius-sm:6px; --header-height:56px;
  }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:var(--bg-primary); color:var(--text-primary);
    font-family:'Inter',-apple-system,sans-serif; font-size:14px; }
  header { height:var(--header-height); background:var(--bg-secondary); border-bottom:1px solid var(--border);
    display:flex; align-items:center; padding:0 20px; gap:16px; position:sticky; top:0; z-index:10; }
  .logo { font-family:'JetBrains Mono',monospace; font-size:18px; font-weight:700; color:var(--accent);
    letter-spacing:-0.5px; display:flex; align-items:center; gap:10px; }
  .logo svg { width:24px; height:24px; opacity:.9; }
  .logo .sub { color:var(--text-secondary); font-weight:500; font-size:14px; }
  .right { margin-left:auto; display:flex; align-items:center; gap:14px; }
  .muted { color:var(--text-secondary); font-size:12px; }
  a { color:var(--cyan); text-decoration:none; } a:hover { text-decoration:underline; }
  .filters { padding:14px 20px 12px; display:flex; gap:8px; flex-wrap:wrap; }
  /* Chips are <button>s (CFOP-94): font-family:inherit is the reset that keeps
     them looking like the spans they replaced. */
  .chip { background:var(--bg-tertiary); border:1px solid var(--border); color:var(--text-primary);
    border-radius:999px; padding:5px 12px; cursor:pointer; font-size:13px; font-family:inherit; }
  .chip:focus-visible { outline:2px solid var(--cyan); outline-offset:2px; }
  .chip.active { background:var(--accent); border-color:var(--accent); color:#0a0a0f; font-weight:600; }
  table { width:100%; border-collapse:collapse; }
  th,td { text-align:left; padding:9px 12px; border-bottom:1px solid var(--border-subtle); vertical-align:top; }
  th { color:var(--text-secondary); font-weight:600; font-size:11px; text-transform:uppercase;
    letter-spacing:.04em; position:sticky; top:var(--header-height); background:var(--bg-primary); }
  td { font-size:13px; } .mono { font-family:'JetBrains Mono',monospace; }
  tbody tr { cursor:pointer; } tbody tr:hover { background:var(--bg-hover); }
  tbody tr:focus-visible { outline:2px solid var(--cyan); outline-offset:-2px; background:var(--bg-hover); }
  .badge { display:inline-block; padding:2px 8px; border-radius:var(--radius-sm); font-size:12px;
    font-weight:600; white-space:nowrap; font-family:'JetBrains Mono',monospace; }
  .trig { max-width:560px; }
  #backdrop { position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:40; opacity:0;
    pointer-events:none; transition:opacity .15s; }
  #backdrop.open { opacity:1; pointer-events:auto; }
  #detail { position:fixed; top:0; right:0; width:min(620px,94vw); height:100%; z-index:50;
    background:var(--bg-secondary); border-left:1px solid var(--border); padding:20px; overflow:auto;
    transform:translateX(100%); transition:transform .15s; box-shadow:-8px 0 24px #0008; }
  #detail.open { transform:translateX(0); }
  #detail h2 { font-family:'JetBrains Mono',monospace; }
  #detail pre { background:var(--bg-primary); border:1px solid var(--border-subtle); border-radius:var(--radius-sm);
    padding:10px; overflow:auto; white-space:pre-wrap; word-break:break-word; font-size:12px; }
  .kv { margin:4px 0; } .kv b { color:var(--text-secondary); font-weight:600; }
  .x { float:right; cursor:pointer; color:var(--text-secondary); font-size:20px;
    background:none; border:0; padding:0 2px; font-family:inherit; line-height:1; }
  .x:focus-visible { outline:2px solid var(--cyan); outline-offset:2px; }
  .empty { padding:40px; text-align:center; color:var(--text-muted); }
  /* The handoff command. user-select:all so a double-click takes the whole
     line — the Copy button is the convenience, not the only way out. */
  .cmd { background:var(--bg-primary); border:1px solid var(--border-subtle); border-radius:var(--radius-sm);
    padding:3px 7px; user-select:all; font-size:12px; }
  #toasts { position:fixed; bottom:20px; right:20px; display:flex; flex-direction:column; gap:8px; z-index:60; }
  .toast { background:var(--bg-tertiary); border:1px solid var(--border); border-left:3px solid var(--cyan);
    color:var(--text-primary); padding:10px 14px; border-radius:var(--radius-sm); box-shadow:0 4px 16px #0008;
    font-size:13px; min-width:200px; transition:opacity .2s; }
  .toast.ok { border-left-color:var(--accent); }
  .toast.err { border-left-color:var(--red); }
  /* The cockpit (CFOP-59). The drawer widens while a terminal is open so 80
     columns fit beside the finding; it is still the drawer — the finding stays
     in view, which is the reason this is not a new tab. */
  #detail.wide { width:min(1100px,96vw); }
  #cockpit { margin:12px 0 16px; }
  .cp-head { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:8px; }
  .cp-head .chips { display:flex; gap:6px; flex-wrap:wrap; font-family:'JetBrains Mono',monospace; font-size:12px; }
  .cp-head .chips span { background:var(--bg-tertiary); border:1px solid var(--border); border-radius:999px; padding:2px 9px; }
  .cp-head .chips .ttl.low { color:var(--orange); border-color:var(--orange); }
  .cp-head .chips .ttl.out { color:var(--red); border-color:var(--red); }
  .cp-head .actions { margin-left:auto; display:flex; gap:6px; }
  .cp-head .chip.danger { border-color:var(--red); color:var(--red); }
  #term { background:#0a0a0f; border:1px solid var(--border); border-radius:var(--radius-sm); padding:6px; height:min(62vh,560px); overflow:hidden; }
  .cp-status { font-size:12px; color:var(--text-secondary); margin-top:6px; min-height:16px; }
  .cp-status.err { color:var(--red); }
  .cp-note { font-size:12px; color:var(--text-muted); margin-left:6px; }
</style>
</head>
<body>
<header>
  <a href="/" class="logo" style="text-decoration:none" title="Back to console">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>
    </svg>
    CFOperator <span class="sub">/ Investigations</span>
  </a>
  <div class="right"><span class="muted" id="updated"></span></div>
  <!-- Section nav, identity and logout — see ui/nav.js -->
  <div id="cfop-nav"></div>
</header>
<script src="/nav.js" defer></script>
<div class="filters" id="filters"></div>
<table>
  <thead><tr><th>ID</th><th>Outcome</th><th>Trigger</th><th>Remediation</th><th>Duration</th><th>Started</th></tr></thead>
  <tbody id="rows"></tbody>
</table>
<div id="empty" class="empty" hidden>No investigations match this filter.</div>
<div id="backdrop" onclick="closeDetail()" aria-hidden="true"></div>
<!-- A dialog (CFOP-94): inert while closed so its off-screen controls are not in the tab
     order; detail() lifts it, closeDetail() restores it. Labelled by the h2 detail() paints. -->
<div id="detail" role="dialog" aria-modal="true" aria-labelledby="detail-title" inert></div>
<div id="toasts"></div>

<!-- esc/badge/color/age/toast/trapFocus — one copy, see ui/common.js. Not deferred:
     the script below calls them at top level. -->
<script src="/common.js"></script>
<script>
const OUTCOMES = ['resolved','needs_action','monitoring','escalated','escalate','failed','in_progress','retry'];
const OC = {resolved:'--accent',needs_action:'--orange',monitoring:'--cyan',escalated:'--red',
  escalate:'--red',failed:'--red',in_progress:'--text-muted',retry:'--purple'};
let filter='', ALL=[], REMS={}, REMID={};

// A poll that brought nothing new does not rebuild the table (CFOP-95). The
// rows were replaced by innerHTML every 20 s regardless, which shifted them
// under the pointer and dropped focus mid-Tab for no reason. The signature is
// every field a row paints from — including the linked remediation, which can
// change while the investigation does not; the age column is refreshed in
// place instead of by repaint.
let LAST_SIG=null;
function signature(){
  return ALL.map(r=>{ const m=REMS[r.id]||(r.remediation_id?REMID[r.remediation_id]:null)||{};
    return [r.id,r.outcome,r.triage_action,r.trigger,r.duration_seconds,r.completed_at,m.id,m.status,r.remediation_id,r.remediation_pr_url].join('\u0001'); }).join('\n');
}
async function load(){
  // A hidden tab has nobody looking; the visibilitychange hook below catches up.
  if(document.hidden) return;
  try{ ALL=(await (await fetch('/api/investigations?limit=80')).json()).investigations||[]; }catch(e){ return; }
  // Linked remediation rows (CFOP-46): map investigation_id -> newest row so a
  // needs_action investigation shows where its recommendation went — or,
  // explicitly, that it went nowhere. Server-side filter was rejected in
  // CFOP-29; the list is newest-first, so first-seen wins.
  try{
    const rows=(await (await fetch('/api/remediations?limit=500')).json()).remediations||[];
    REMS={}; REMID={};
    rows.forEach(r=>{ if(r.investigation_id!=null && !(r.investigation_id in REMS)) REMS[r.investigation_id]=r; REMID[r.id]=r; });
  }catch(e){ /* linkage is enhancement — the table still renders without it */ }
  const sig=signature();
  if(sig!==LAST_SIG){ LAST_SIG=sig; paint(); } else refreshAges();
  document.getElementById('updated').textContent='updated '+new Date().toLocaleTimeString();
}
// LLM-adjacent URLs: only http(s) reaches href (same posture as
// remediations.html). Empty/null must return '' — new URL('', base) resolves
// to the page itself and rendered phantom links (CFOP-52).
function safeUrl(u){ const s=String(u==null?'':u).trim(); if(!s) return '';
  try{ const p=new URL(s, window.location.href);
  return (p.protocol==='http:'||p.protocol==='https:')?p.href:''; }catch(e){ return ''; } }
function remLink(r){
  // Deduped repeats carry only the id (the map keys the row under the FIRST
  // investigation); resolve through REMID so they still get a status chip.
  const m=REMS[r.id] || (r.remediation_id ? (REMID[r.remediation_id]||{id:r.remediation_id,status:''}) : null);
  if(m) return `<a href="/remediations#${m.id}" onclick="event.stopPropagation()">#${m.id}${m.status?' '+esc(m.status):''}</a>`;
  const pr=safeUrl(r.remediation_pr_url);
  if(pr) return `<a href="${esc(pr)}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">PR ↗</a>`;
  return r.outcome==='needs_action' ? '<span class="muted">none</span>' : '';
}
// Drawer line: on needs_action, "no remediation" must be stated, not inferred
// from absence. findings.remediation_id covers rows newer than the 500-row map;
// an inline-proposer PR (findings.remediation_proposal.remediation_pr) counts
// as a remediation too — that path deliberately bypasses the queue.
function remDrawerLine(r){
  const f=r.findings||{};
  const m=REMS[r.id] || (f.remediation_id ? (REMID[f.remediation_id]||{id:f.remediation_id, status:''}) : null);
  if(m) return `<div class="kv"><b>remediation</b> <a href="/remediations#${m.id}">#${m.id}${m.status?' ('+esc(m.status)+')':''}</a></div>`;
  const pr=(f.remediation_proposal||{}).remediation_pr||{};
  const prUrl=pr.status==='opened'?safeUrl(pr.html_url):'';
  if(prUrl) return `<div class="kv"><b>remediation</b> <a href="${esc(prUrl)}" target="_blank" rel="noopener noreferrer">PR opened ↗</a></div>`;
  return r.outcome==='needs_action' ? `<div class="kv"><b>remediation</b> <span class="muted">none proposed</span></div>` : '';
}
// Institutional-memory citations (CFOP-31): findings.similar_past records the
// past investigations the orient phase actually fed into the prompt — a fact
// about this run, not the LLM's prose. Ids link back into this page's drawer.
function similarBlock(f){
  const s=f.similar_past||[];
  if(!s.length) return '';
  return `<h3>Similar past investigations</h3>`+s.map(p=>
    `<div class="kv">${p.id!=null?`<a href="#" onclick="event.preventDefault();detail(${Number(p.id)})">#${Number(p.id)}</a> `:''}`+
    `${badge(p.outcome,OC[p.outcome]||'--text-muted')} ${esc((p.trigger||'').slice(0,110))}`+
    `<span class="muted"> (similarity ${Number(p.similarity||0).toFixed(2)})</span></div>`).join('');
}
function paint(){
  const c={}; ALL.forEach(r=>c[r.outcome]=(c[r.outcome]||0)+1);
  const tri=ALL.filter(r=>r.triage_action).length;
  const seen=OUTCOMES.filter(o=>c[o]);
  document.getElementById('filters').innerHTML =
    chip('', `all (${ALL.length})`)+
    seen.map(o=>chip(o, `${o} (${c[o]})`)).join('')+
    (tri?chip('__triaged', `triaged (${tri})`):'');
  const rows=filter==='__triaged'?ALL.filter(r=>r.triage_action)
           :filter==='__untriaged'?ALL.filter(r=>!r.triage_action)
           :filter?ALL.filter(r=>r.outcome===filter):ALL;
  document.getElementById('empty').hidden=rows.length>0;
  const focused=focusedRow();
  document.getElementById('rows').innerHTML=rows.map(r=>`
    <tr id="row-${r.id}" tabindex="0" onclick="detail(${r.id})" onkeydown="rowKey(event,${r.id})">
      <td class="mono">#${r.id}</td>
      <td>${badge(r.outcome, OC[r.outcome]||'--text-muted')}${r.triage_action?' '+badge(r.triage_action,'--accent'):''}</td>
      <td class="trig">${esc(r.trigger||'').slice(0,140)}</td>
      <td>${remLink(r)}</td>
      <td class="muted">${r.duration_seconds?Math.round(r.duration_seconds)+'s':'—'}</td>
      <td class="muted" data-age="${esc(r.started_at||'')}">${age(r.started_at)}</td></tr>`).join('');
  refocusRow(focused);
}
function setF(o){ filter=o; paint(); }
// Filter chips are buttons with aria-pressed (CFOP-94): the active filter is
// not signalled by colour alone, and a button is reachable by Tab where the
// span it replaced was not.
function chip(value, label){
  const on=filter===value;
  return `<button type="button" class="chip ${on?'active':''}" aria-pressed="${on}" onclick="setF('${value}')">${label}</button>`;
}
// Rows are focusable rather than links (CFOP-94): a fragment link would push a
// history entry per row, which the replaceState decision below exists to
// avoid. Enter and Space open, as on a button; a key pressed on a link inside
// the row is the link's own.
function rowKey(e,id){
  if(e.target!==e.currentTarget) return;
  if(e.key==='Enter'||e.key===' '){ e.preventDefault(); detail(id); }
}
// The poll repaints the table by replacing innerHTML, which drops focus from
// the row you were on — every 20 s, mid-Tab. Remember it by id and put it back.
function focusedRow(){ const a=document.activeElement; return (a&&a.id&&a.id.indexOf('row-')===0)?a.id:null; }
function focusDetailClose(){ const x=document.getElementById('detail-close'); if(x&&x.focus) x.focus(); }
function refocusRow(id){ if(!id) return; const el=document.getElementById(id); if(el&&el.focus) el.focus(); }
// The open drawer names itself in the URL (CFOP-73): /investigations#2272 is
// what you paste to someone and what a reload comes back to. replaceState
// rather than assigning location.hash — assigning fires hashchange, which
// would re-enter detail() and refetch, and would fill the back button with
// every row you merely glanced at.
let OPEN=null;
// The element that opened the drawer, so closing can hand focus back (CFOP-94).
// Held only while open: Escape with nothing open must not move focus.
let OPENER=null;
function closeDetail(){ const d=document.getElementById('detail'); disconnectCockpit(); d.classList.remove('open'); d.inert=true; document.getElementById('backdrop').classList.remove('open');
  OPEN=null; history.replaceState(null,'',location.pathname+location.search); restoreFocus(); }
function restoreFocus(){
  const o=OPENER; OPENER=null; if(!o) return;
  // The poll may have replaced the row since; the same id is the same row.
  const t=(o.isConnected===false && o.id)?document.getElementById(o.id):o;
  if(t&&t.focus) t.focus();
}
// Escape closes the drawer — unless a terminal is open, in which case the key
// belongs to whatever is running in it (a TUI, a pager). Disconnect first.
document.addEventListener('keydown',e=>{ if(e.key==='Escape' && !COCKPIT.ws) closeDetail(); });
// Tab stays inside the open drawer (CFOP-95); a Tab the terminal consumed is left to it.
trapFocus(document.getElementById('detail'));

async function detail(id){
  // Tear any open terminal down FIRST, unconditionally. detail() replaces the
  // drawer's innerHTML below, which orphans the xterm node; and a same-id
  // re-entry — re-clicking the open row, or triage() ending in detail(id) —
  // would otherwise leave COCKPIT.ws connected against a DOM that no longer
  // holds it, one leaked bridge slot (of two) at a time. Reattach is another
  // /open, so there is nothing to preserve by keeping it alive.
  const d=document.getElementById('detail'); disconnectCockpit(); d.innerHTML='<span class="muted">loading…</span>';
  // First open records where focus came from; a re-entry from inside the
  // drawer (a similar-past link, triage) would record an element about to be
  // painted over.
  if(OPEN===null) OPENER=document.activeElement||null;
  d.classList.add('open'); d.inert=false; document.getElementById('backdrop').classList.add('open');
  OPEN=id; history.replaceState(null,'','#'+id);
  let r; try{ r=await (await fetch('/api/investigations/'+id)).json(); }catch(e){
    if(OPEN===id){ d.innerHTML='<button type="button" class="x" id="detail-close" onclick="closeDetail()" aria-label="Close">×</button><span class="muted">error loading #'+id+'</span>'; focusDetailClose(); } return; }
  await learnRole();
  // Two clicks in quick succession race: a slow response for the row you left
  // would otherwise paint over the row you are on, while the URL still names
  // the newer one. Last click wins, and a stale response is dropped.
  if(OPEN!==id) return;
  const f=r.findings||{};
  d.innerHTML=`
    <button type="button" class="x" id="detail-close" onclick="closeDetail()" aria-label="Close">×</button>
    <h2 id="detail-title" style="margin:0 0 8px">Investigation #${r.id}</h2>
    <div class="kv">${badge(r.outcome,OC[r.outcome]||'--text-muted')}
      <span class="muted">${r.duration_seconds?Math.round(r.duration_seconds)+'s':''} · ${r.tool_calls_count||0} tool calls</span></div>
    <div class="kv"><b>trigger</b> ${esc(r.trigger)}</div>
    <div class="kv"><b>started</b> ${esc(r.started_at)}${r.completed_at?' · <b>completed</b> '+esc(r.completed_at):''}</div>
    ${f.host?`<div class="kv"><b>host</b> ${esc(f.host)}</div>`:''}
    ${attachBlock(r)}
    <div id="cockpit"></div>
    ${remDrawerLine(r)}
    ${triageBlock(r)}
    ${sessionsBlock(r)}
    ${similarBlock(f)}
    ${f.recommendation?`<h3>Recommendation</h3><pre>${esc(f.recommendation)}</pre>`:''}
    ${f.fix?`<h3>FIX</h3><pre>${esc(JSON.stringify(f.fix,null,2))}</pre>`:''}
    ${f.response?`<h3>Findings</h3><pre>${esc(f.response)}</pre>`:''}
    <h3>Raw findings</h3><pre>${esc(JSON.stringify(f,null,2))}</pre>`;
  focusDetailClose();
}
// The handoff (CFOP-73). Slack, Discord and ntfy all end a notification with
// this line; the console is where you are actually looking at the
// investigation, so it offers it too rather than making you carry the id to a
// terminal in your head. The string is the server's — see web_server.py — so
// it cannot drift from the command the shipped binary implements.
function attachBlock(r){
  const cmd=r.attach_command;
  if(!cmd) return '';
  // "Open cockpit" is spawn plus a terminal, and spawn is the admin's: the
  // button is drawn for admins only, and the endpoint refuses everyone else
  // anyway. Members keep the attach line.
  const open=ADMIN?` <button type="button" class="chip" id="open-cockpit" onclick="openCockpit(${Number(r.id)})">Open cockpit</button><span class="cp-note" id="cockpit-note"></span>`:'';
  return `<div class="kv"><b>take over</b> <code class="mono cmd" id="attach-cmd">${esc(cmd)}</code>
    <button type="button" class="chip" onclick="copyAttach()">Copy</button>${open}</div>`;
}
// navigator.clipboard is a secure-context API, and this console is normally
// reached over plain HTTP on the LAN — so the execCommand path is the one that
// actually runs for most operators here, not a legacy branch. Either way the
// result is stated: a copy that silently did nothing is worse than no button.
function copyAttach(){
  const el=document.getElementById('attach-cmd');
  const text=el?(el.textContent||''):'';
  if(!text) return;
  // Copy the element the operator can actually see (it is user-select:all, so
  // the selection reads as one deliberate act) rather than an off-screen
  // textarea — a detached node is the flakier thing to ask execCommand to copy,
  // and this leaves the command visibly selected if the copy fails anyway.
  const fallback=()=>{
    let ok=false;
    try{
      const sel=window.getSelection(), range=document.createRange();
      range.selectNodeContents(el); sel.removeAllRanges(); sel.addRange(range);
      ok=document.execCommand('copy');
    }catch(e){ ok=false; }
    toast(ok?'attach command copied':'copy failed — select the command and copy manually', ok?'ok':'err');
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>toast('attach command copied','ok')).catch(fallback);
  } else { fallback(); }
}
// Cockpit sessions (CFOP-37) — what humans worked out against this
// investigation, appended beside it rather than merged into `findings`. Placed
// above the agent's own recommendation on purpose: someone reading this drawer
// wants "has a person already been here, and what did they find" before they
// read what the model proposed.
function sessionsBlock(r){
  const rows=r.sessions||[];
  if(!rows.length) return '';
  return `<h3>Cockpit sessions (${rows.length})</h3>`+rows.map(s=>{
    const d=s.detail||{};
    const where=[d.tier?'tier '+esc(d.tier):'', d.host?esc(d.host):''].filter(Boolean).join(' · ');
    const meta=[where, d.duration_seconds?Math.round(d.duration_seconds)+'s':'',
                d.exchanges?d.exchanges+' exchanges':'', d.model?esc(d.model):'']
               .filter(Boolean).join(' · ');
    // A degraded row is a raw transcript tail, not a summary. Labelled so it is
    // never read as a conclusion the session actually reached.
    const warn=s.degraded?' '+badge('raw tail','--orange'):'';
    const learn=d.learning_id?` <span class="muted">→ learning #${d.learning_id}</span>`:'';
    const cmds=(d.commands||[]).length
      ? `<pre>${(d.commands||[]).map(c=>'$ '+esc(c)).join('\n')}</pre>` : '';
    return `<div class="kv">${badge(s.outcome||'unrecorded','--accent')}${warn}
        <span class="muted">${esc(s.actor||'')}${meta?' · '+meta:''}${s.recorded_at?' · '+esc(s.recorded_at):''}</span>${learn}</div>
      <pre>${esc(s.summary||'')}</pre>${cmds}`;
  }).join('');
}
// Operator triage (CFOP-65). Records the human's verdict in triage_action;
// the agent's own `outcome` is deliberately left alone, because that is what
// the similar-investigation search cites as precedent to future triage.
function triageBlock(r){
  const act=r.triage_action;
  const state=act?`${badge(act,'--accent')}${r.operator_notes?' <span class="muted">'+esc(r.operator_notes)+'</span>':''}`
                 :'<span class="muted">not triaged</span>';
  return `<div class="kv"><b>operator</b> ${state}</div>
    <div class="kv" style="gap:6px;flex-wrap:wrap">
      <input id="tn-${r.id}" placeholder="note (optional)" style="flex:1;min-width:180px">
      <button type="button" class="chip" onclick="triage(${r.id},'resolved')">resolve</button>
      <button type="button" class="chip" onclick="triage(${r.id},'ack')">ack</button>
    </div>`;
}
async function triage(id, action){
  const el=document.getElementById('tn-'+id);
  const note=el?el.value:'';
  try{
    const res=await fetch(`/api/investigations/${id}/triage`,{
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({action, note})});
    if(!res.ok){ toast('triage failed: '+res.status+(res.status===403?' (admin only)':''),'err'); return; }
  }catch(e){ toast('triage failed','err'); return; }
  await detail(id); load();
}
// ---- the browser cockpit (CFOP-59) ------------------------------------
// One click on the investigation → a briefed session on the affected host, in
// this drawer. The agent's bridge (CFOP-75) carries the bytes; the console's
// /open hands back a live session, the websocket URL and a one-shot ticket
// that is spent the moment the bridge verifies it. The page never keeps a
// credential: a reconnect is another /open.
let ADMIN=false, ROLE_KNOWN=false;
async function learnRole(){
  if(ROLE_KNOWN) return;
  try{ const who=await window.CFOP.me(); ADMIN=!!(who && (who.role==='admin' || who.auth_disabled)); }
  catch(e){ ADMIN=false; }
  ROLE_KNOWN=true;
}
// What the bridge's close code means for the person reading it. Each code is a
// different next action, which is why the bridge spends five of them rather
// than one 1008 — a single shrug would make "sign in again" and "this one is
// in the cluster" the same sentence.
function closeReason(code, reason){
  const why=reason?(' — '+reason):'';
  switch(Number(code)){
    case 4401: return 'the ticket was not accepted'+why+'. Reopen to get a fresh one; if that fails, sign in again.';
    case 4403: return 'refused'+why+'. Either this console is not in cockpit.bridge_origins, or the token lacks investigate scope.';
    case 4404: return 'no live session on the host'+why+'. Reopen to start one.';
    case 4409: return 'this cockpit is a pod'+why+'. The browser terminal serves host tiers only — use the attach line.';
    case 4429: return 'the bridge is carrying its maximum terminals'+why+'. Close one, or wait.';
    case 1000: case 1005: return 'session ended'+why+'.';
    case 1006: return 'connection dropped'+why+'. Reopen to reconnect.';
    default: return 'closed ('+code+')'+why+'.';
  }
}
// m:ss until the host's deadline; the chip turns amber under five minutes and
// red at zero, because the session dies at the deadline whether or not you
// were typing.
function fmtTTL(seconds){
  const s=Math.max(0, Math.floor(Number(seconds)||0));
  return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
}
function ttlClass(seconds){ const s=Number(seconds)||0; return s<=0?'ttl out':(s<300?'ttl low':'ttl'); }
// The bridge's wire protocol, kept in two small functions so a test can hold
// them still: text frames are control, binary frames are terminal bytes.
function authFrame(ticket){ return JSON.stringify({type:'auth', token:ticket}); }
function resizeFrame(cols, rows){ return JSON.stringify({type:'resize', cols:cols, rows:rows}); }

// var, not const: the console tests read this state through the page's global
// scope, and a top-level const is not a property of it.
var COCKPIT={id:null, ws:null, term:null, fit:null, timer:null, expires:null, lastError:''};

async function openCockpit(id){
  const btn=document.getElementById('open-cockpit'), note=document.getElementById('cockpit-note');
  if(btn) btn.textContent='opening…';
  if(note) note.textContent='';
  let res, body;
  try{ res=await fetch(`/api/cockpit/${id}/open`,{method:'POST', headers:{'Content-Type':'application/json'}, body:'{}'});
       body=await res.json(); }
  catch(e){ if(btn) btn.textContent='Open cockpit'; toast('could not reach the console','err'); return; }
  if(btn) btn.textContent='Open cockpit';
  if(!res.ok){
    // A refusal says why, next to the button, and the attach line is still
    // right there — the fallback is the copy button, not an error page.
    const msg=body&&body.error?body.error:('open failed: '+res.status+(res.status===403?' (admin only)':''));
    if(note) note.textContent=msg; toast(msg,'err'); return;
  }
  if(OPEN!==id) return;
  mountCockpit(id, body);
}

function mountCockpit(id, s){
  disconnectCockpit();
  const b=s.bridge||{};
  const where=(s.tier||'?')+'@'+(s.host||'?');
  const el=document.getElementById('cockpit'); if(!el) return;
  el.innerHTML=`
    <div class="cp-head">
      <div class="chips"><span>#${Number(id)}</span><span>${esc(where)}</span><span>scope: ${esc(b.scope||'investigate')}</span><span class="ttl" id="cp-ttl">TTL —</span></div>
      <div class="actions">
        <button type="button" class="chip" onclick="openCockpit(${Number(id)})" title="reconnect to the session on the host">reattach</button>
        <button type="button" class="chip danger" onclick="killCockpit(${Number(id)})" title="remove the session from the host and revoke its tokens">kill</button>
        <button type="button" class="chip" onclick="disconnectCockpit()" title="close this terminal; the session stays until its TTL">disconnect</button>
      </div>
    </div>
    <div id="term"></div>
    <div class="cp-status" id="cp-status">connecting…</div>`;
  document.getElementById('detail').classList.add('wide');
  COCKPIT.id=id; COCKPIT.expires=s.expires_at||null; COCKPIT.lastError='';
  startCountdown();

  // The vendored library loads deferred; a click cannot beat it in practice,
  // but a page served with the vendor files missing would throw here, and a
  // thrown error is a blank box with "connecting…" under it forever.
  if(!window.Terminal || !window.FitAddon){ setStatus('terminal library not loaded (/vendor/xterm.js) — reload the page, or use the attach line', true); return; }
  const term=new window.Terminal({cursorBlink:true, fontFamily:"'JetBrains Mono',monospace", fontSize:13, scrollback:5000,
    theme:{background:'#0a0a0f', foreground:'#e0e0e8', cursor:'#22c55e'}});
  const fit=new window.FitAddon.FitAddon();
  term.loadAddon(fit); term.open(document.getElementById('term')); fit.fit();
  COCKPIT.term=term; COCKPIT.fit=fit;

  const ws=new WebSocket(b.url); ws.binaryType='arraybuffer'; COCKPIT.ws=ws;
  const enc=new TextEncoder();
  ws.onopen=()=>{ ws.send(authFrame(b.ticket)); ws.send(resizeFrame(term.cols, term.rows)); setStatus('connected — '+where); term.focus(); };
  ws.onmessage=ev=>{
    if(typeof ev.data==='string'){
      let f=null; try{ f=JSON.parse(ev.data); }catch(e){ return; }
      if(f && f.type==='error') COCKPIT.lastError=f.reason||'';
      return;
    }
    term.write(new Uint8Array(ev.data));
  };
  ws.onclose=ev=>{ if(COCKPIT.ws!==ws) return; COCKPIT.ws=null; setStatus('disconnected: '+closeReason(ev.code, COCKPIT.lastError), true); stopCountdown(); };
  ws.onerror=()=>{ /* onclose follows with the code; nothing useful to say here */ };
  term.onData(d=>{ if(ws.readyState===1) ws.send(enc.encode(d)); });
  term.onResize(sz=>{ if(ws.readyState===1) ws.send(resizeFrame(sz.cols, sz.rows)); });
  window.addEventListener('resize', refit);
}
function refit(){ if(COCKPIT.fit){ try{ COCKPIT.fit.fit(); }catch(e){} } }
function setStatus(text, isErr){ const s=document.getElementById('cp-status'); if(s){ s.textContent=text; s.className='cp-status'+(isErr?' err':''); } }
function startCountdown(){
  stopCountdown();
  const tick=()=>{ const c=document.getElementById('cp-ttl'); if(!c) return;
    if(!COCKPIT.expires){ c.textContent='TTL —'; return; }
    const left=COCKPIT.expires-Math.floor(Date.now()/1000);
    c.textContent='TTL '+fmtTTL(left); c.className=ttlClass(left);
    if(left<=0) stopCountdown(); };
  tick(); COCKPIT.timer=setInterval(tick, 1000);
}
function stopCountdown(){ if(COCKPIT.timer){ clearInterval(COCKPIT.timer); COCKPIT.timer=null; } }
// Disconnect closes the socket and the terminal; the session on the host is
// left to its TTL (and, once tmux is in play, to be reattached). Kill is the
// other button.
function disconnectCockpit(){
  const ws=COCKPIT.ws; COCKPIT.ws=null;
  if(ws){ try{ ws.close(1000); }catch(e){} }
  if(COCKPIT.term){ try{ COCKPIT.term.dispose(); }catch(e){} }
  COCKPIT.term=null; COCKPIT.fit=null; stopCountdown();
  window.removeEventListener('resize', refit);
  const d=document.getElementById('detail'); if(d) d.classList.remove('wide');
  const el=document.getElementById('cockpit'); if(el && COCKPIT.id!==null) el.innerHTML='';
  COCKPIT.id=null;
}
async function killCockpit(id){
  if(!confirm(`Remove the cockpit for #${id} from the host and revoke its tokens?`)) return;
  let res, body;
  try{ res=await fetch(`/api/cockpit/${id}/close`,{method:'POST', headers:{'Content-Type':'application/json'}, body:'{}'});
       body=await res.json(); }
  catch(e){ toast('could not reach the console','err'); return; }
  if(!res.ok){ toast(body&&body.error?body.error:('kill failed: '+res.status),'err'); return; }
  disconnectCockpit();
  toast(`cockpit removed from ${body.host} · ${body.tokens_revoked||0} token(s) revoked`,'ok');
}

// Inbound only: a pasted or edited URL, and the reload case. detail() keeps
// the hash in step from the other direction without coming through here.
function openFromHash(){ const m=location.hash.match(/^#(\d+)$/); if(m && +m[1]!==OPEN) detail(+m[1]); }
window.addEventListener('hashchange', openFromHash);

load().then(openFromHash); setInterval(load, 20000);
// load() skips a hidden tab; catch up the moment it is looked at again rather
// than up to 20 s later.
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) load(); });
</script>
</body>
</html>
