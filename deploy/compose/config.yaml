# Starter config for the docker-compose trial.
#
# Everything not named here comes from the default schema in cfshared/config.py
# and is merged under this file, so what remains is exactly the endpoints and
# choices that are specific to running under compose. No host inventory, no
# container runtime (the trial is not in-cluster, so autodetection stays off),
# no ooda block — those all default correctly now.
#
# Values arrive as environment variables from docker-compose.yml / .env; an
# empty variable leaves that feature off rather than half-configured.

# Read-only by default: observe, triage, investigate, notify, never propose a
# change. Switch to `remediate` to let the queue/executor/PR flags take effect.
profile: investigate

llm:
  backend: ollama
  url: ${OLLAMA_URL}
  model: ${OLLAMA_MODEL}

prometheus:
  url: ${PROMETHEUS_URL}

alertmanager:
  url: ${ALERTMANAGER_URL}

loki:
  url: ${LOKI_URL}

notify:
  slack_webhook: ${SLACK_WEBHOOK_URL}
  discord_webhook: ${DISCORD_WEBHOOK_URL}

# Named explicitly rather than left to the postgres:5432/cfoperator defaults,
# because the compose file lets POSTGRES_DB / POSTGRES_USER be overridden in
# .env and the loader only env-fills the password.
database:
  host: ${POSTGRES_HOST}
  database: ${POSTGRES_DB}
  user: ${POSTGRES_USER}
  password: ${POSTGRES_PASSWORD}
