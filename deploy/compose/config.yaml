# Starter config for the docker-compose trial (CFOP-25).
#
# Deliberately tiny: every value arrives as an environment variable from
# docker-compose.yml / .env, and only the sections a k8s-free trial needs are
# present — no host inventory, no SSH, no container-runtime section. The full
# reference lives in config.yaml.example and docs/infrastructure-config.md.
#
# INTERIM ARTIFACT: CFOP-26 (config collapse) will teach the loader to merge a
# partial file over complete defaults, at which point this file shrinks further
# or disappears. Until then, what is listed here is the effective config —
# absent sections stay absent.

observability:
  metrics:
    backend: prometheus
    url: ${PROMETHEUS_URL}

  logs:
    backend: loki
    url: ${LOKI_URL}

  alerts:
    backend: alertmanager
    url: ${ALERTMANAGER_URL}

  notifications:
    - backend: slack
      webhook_url: ${SLACK_WEBHOOK_URL}
    - backend: discord
      webhook_url: ${DISCORD_WEBHOOK_URL}

llm:
  primary:
    provider: ollama
    url: ${OLLAMA_URL}
    model: ${OLLAMA_MODEL}
    timeout: 180

  # Optional paid fallbacks — skipped when the key is empty.
  fallback:
    - provider: anthropic
      model: claude-sonnet-5
      api_key: ${ANTHROPIC_API_KEY}
    - provider: groq
      model: llama-3.3-70b-versatile
      api_key: ${GROQ_API_KEY}

  embeddings:
    provider: ollama
    url: ${OLLAMA_URL}
    model: nomic-embed-text

database:
  host: ${POSTGRES_HOST}
  port: 5432
  database: ${POSTGRES_DB}
  user: ${POSTGRES_USER}
  password: ${POSTGRES_PASSWORD}

# Required until CFOP-26: agent.py reads `config['ooda']['sweep']` with hard
# indexing, and a config file that exists suppresses the built-in defaults
# entirely — so omitting this section does not fall back, it crash-loops the
# main loop with KeyError: 'ooda'. Found by booting the stack, not by tests.
ooda:
  alert_check_interval: 30
  sweep_interval: 1800
  sweep:
    metrics: true
    logs: true
    containers: false        # no container backend configured in the trial
    baseline_drift: true
    learning_consolidation: true
