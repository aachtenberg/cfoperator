name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # The code-review plugin stops on a draft, so a run on a draft only spends
    # subscription usage. cursor opens its PRs as drafts; ready_for_review is
    # the event that actually gets reviewed.
    if: github.event.pull_request.draft == false

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # cursor[bot] pushes the commits that address a review. The action
          # refuses any non-human actor unless it is named here, and the check
          # stays red. cursor only: '*' would let any app invoke the review,
          # and claude[bot] is omitted so a review that commits cannot retrigger
          # this job.
          allowed_bots: 'cursor'
          # Temporary: runs finish green with permission denials and no review
          # posted, and the log only carries the denial count. Turn off once the
          # denied tool is on the allowlist below.
          show_full_output: true
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # The code-review plugin fans out to subagents (Agent, formerly Task)
          # and reads the PR through gh. Any tool missing here is denied, and
          # the job still reports success without posting anything.
          claude_args: '--allowedTools "Agent,Task,mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr list:*),Bash(gh pr comment:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*)"'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

