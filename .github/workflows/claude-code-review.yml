name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    # A draft has nothing to review yet. Marking it ready fires
    # ready_for_review, which is the run that posts. A PR opened ready
    # reviews on opened — nobody has to comment @claude. That mention is
    # claude.yml, a different workflow, and it is not the review.
    if: github.event.pull_request.draft == false

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      # gh pr comment writes an issue comment. pull-requests: write does
      # not cover that endpoint.
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # cursor[bot] pushes the commits that address a review. The action
          # refuses any non-human actor unless it is named here, and the check
          # stays red. cursor only: '*' would let any app invoke the review,
          # and claude[bot] is omitted so a review that commits cannot retrigger
          # this job.
          allowed_bots: 'cursor'
          # The job goes green either way. This is how a run that posted
          # nothing is distinguishable from a review in the log.
          show_full_output: true
          # Not the code-review plugin. That plugin launches background
          # subagents and then ends the turn to wait for a notification.
          # This action never resumes the session, so the check is green
          # and the PR has no review (anthropics/claude-code-action#1087).
          # @claude still works, because claude.yml has no plugin and
          # finishes in the same session — which is why a mention posted
          # and the automatic run did not. Do the review here, in this
          # session, and post it before stopping.
          prompt: |
            Review pull request ${{ github.event.pull_request.number }} in ${{ github.repository }}.
            Do the review in this session. Do not launch a subagent, a background task, or a skill. Those end this job before anything is posted, and the check still goes green.
            The checkout is a detached merge commit, so gh will not infer the pull request. Pass the number and the repo on every command.
            Read the description with `gh pr view ${{ github.event.pull_request.number }} --repo ${{ github.repository }}` and the diff with `gh pr diff ${{ github.event.pull_request.number }} --repo ${{ github.repository }}`.
            Review for bugs and for conflicts with CLAUDE.md.
            Before you stop, post the review with `gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --body "..."`. Findings go in that comment. If there are none, the comment says so. Stopping without that comment is a failed review.
          # No Agent, Task, or Skill. Those are the tools that background
          # the review. Read, search, and gh are enough to post one.
          claude_args: '--allowedTools "Read,Grep,Glob,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh pr review:*)"'
