name: Build cfoperator on main

# On every push to main, build the cfoperator image, push to ghcr.io,
# and open a PR on homelab-infra bumping the kustomize image override to
# the new immutable sha-tag. Same cross-repo PR pattern as
# .github/workflows/mirror-freshet-public.yml in homelab-infra
# (MIRROR_PAT → here INFRA_PAT).
#
# The cfoperator pod is pinned to headless-gpu (amd64); single-arch build.
# Add arm64 if scheduling ever changes.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'benchmarks/**'
      - 'cfassist/**'
      - 'cfassist-go/**'
      - 'cfshared/**'
      - 'llm-gateway/**'
      - 'grafana/**'
      - 'observability/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tag
        id: tag
        run: echo "tag=main-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ github.repository_owner }}/cfoperator:main
            ghcr.io/${{ github.repository_owner }}/cfoperator:${{ steps.tag.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  open-bump-pr:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout homelab-infra
        uses: actions/checkout@v4
        with:
          repository: aachtenberg/homelab-infra
          token: ${{ secrets.INFRA_PAT }}
          path: homelab-infra

      - name: Install kustomize
        run: |
          curl -sL "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" \
            | bash -s 5.4.3
          sudo mv kustomize /usr/local/bin/

      - name: Bump cfoperator image override
        working-directory: homelab-infra/k3s/overlays/production
        run: |
          kustomize edit set image \
            ghcr.io/aachtenberg/cfoperator=ghcr.io/aachtenberg/cfoperator:${{ needs.build-and-push.outputs.image-tag }}
          echo "--- diff ---"
          git -C ../../.. diff k3s/overlays/production/kustomization.yml

      - name: Open PR
        uses: peter-evans/create-pull-request@v6
        with:
          path: homelab-infra
          token: ${{ secrets.INFRA_PAT }}
          branch: auto/bump-cfoperator-image
          delete-branch: true
          commit-message: "chore(deploy): bump cfoperator to ${{ needs.build-and-push.outputs.image-tag }}"
          title: "chore(deploy): bump cfoperator to ${{ needs.build-and-push.outputs.image-tag }}"
          body: |
            Auto-generated by cfoperator [build-cfoperator-main](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).

            **Image**: `ghcr.io/aachtenberg/cfoperator:${{ needs.build-and-push.outputs.image-tag }}`
            **Source commit**: ${{ github.repository }}@${{ github.sha }}

            ArgoCD will roll the cfoperator deployment once this is merged.
          labels: |
            deploy
            automated
