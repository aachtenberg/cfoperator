name: Build cfoperator on main

# On every push to main, build the cfoperator image, push to ghcr.io, and
# commit the new immutable sha-tag straight to the PRIVATE deploy repo
# aachtenberg/cfoperator-deploy (ArgoCD's standalone `cfoperator` Application
# syncs that repo). No cross-repo PR / manual merge: the bump is a mechanical
# one-liner, so it lands directly on the deploy repo's main and ArgoCD rolls
# the pod automatically.
#
# (Previously this opened a PR on homelab-infra via INFRA_PAT. The manifests
# moved out of that monorepo so the public code repo could stay public while
# the topology-bearing config stays private.)
#
# Requires repo secret DEPLOY_PAT: a token with contents:write on
# aachtenberg/cfoperator-deploy.
#
# The cfoperator pod is pinned to headless-gpu (amd64), so main builds are
# single-arch. v* tag builds add arm64 (CFOP-273): a release is what
# scripts/install.sh installs, and the trial is often run on a Pi. QEMU makes
# that build slow, which a release can afford and every merge cannot.
#
# v* tag pushes also build here (CFOP-56): they publish the version as the
# image tag so the Helm chart can pin a release instead of floating :main.
# Tag builds do NOT move :main and do NOT bump the deploy repo — the homelab
# deploy path stays main-push-only.

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'benchmarks/**'
      # cfassist-go/** used to be ignored here — correctly, while the Go tree
      # shipped only as a release binary. CFOP-35 bakes it into the cockpit
      # image (cockpit/Dockerfile builds it from source), so ignoring it would
      # mean a cfassist fix never reaches the cockpit pods. The cost is that a
      # CLI-only change now rebuilds the other three images too.
      # Only paths that are NOT baked into the image belong here. A path the
      # Dockerfile COPYs must trigger a rebuild, or a change to it silently
      # never deploys. test_dockerfile_image.py enforces this.
      - 'llm-gateway/**'
      - 'grafana/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.tag.outputs.tag }}
      # The pushed manifest's digest (the multi-arch index on a tag). The
      # release bundle pins it beside the tag, so a re-pushed tag cannot change
      # what a checksum-verified install runs (CFOP-273, CodeRabbit).
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      # Only a tag build is multi-arch (see the header), so only it needs QEMU.
      - uses: docker/setup-qemu-action@v3
        if: github.ref_type == 'tag'

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tag
        # Branch build: floating :main + immutable :main-<sha7> (deploy bump
        # consumes the latter). Tag build: the version only — :main must not
        # move on a release, or a rollback tag would silently roll the fleet.
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/cfoperator
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
            echo "tags=$IMAGE:$tag" >> "$GITHUB_OUTPUT"
          else
            tag="main-${GITHUB_SHA::7}"
            echo "tags=$IMAGE:main,$IMAGE:$tag" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # What the image reports as its version (CFOP-92): the same tag,
          # minus the leading v that the health body, the agent_info metric
          # label and Chart.yaml appVersion have never carried. Derived from
          # the tag rather than typed anywhere, so a release cannot show a
          # stale one. test_console_version.py pins this build-arg.
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: ${{ github.ref_type == 'tag' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          build-args: |
            CFOP_VERSION=${{ steps.tag.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.tag.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  # Worker image for deep-investigation Jobs (worker/). Multi-arch because
  # Jobs schedule on any node (Pis are arm64). Referenced by the floating
  # :main tag from CFOP_DEEP_WORKER_IMAGE — the kustomize images transformer
  # can't rewrite env-var image refs, so there's no bump step for it.
  build-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tag
        # Same branch/tag split as build-and-push above.
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/cfoperator-worker
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "tags=$IMAGE:$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "tags=$IMAGE:main,$IMAGE:main-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push worker
        uses: docker/build-push-action@v5
        with:
          context: worker/
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker
          tags: ${{ steps.tag.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  # cfoperator-executor: ephemeral remediation Job image. Like the worker, its
  # ref is a floating :main tag carried in agent code (not a kustomize image),
  # so there's no bump step for it.
  build-executor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tag
        # Same branch/tag split as build-and-push above.
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/cfoperator-executor
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "tags=$IMAGE:$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "tags=$IMAGE:main,$IMAGE:main-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push executor
        uses: docker/build-push-action@v5
        with:
          context: executor/
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=executor
          cache-to: type=gha,mode=max,scope=executor
          tags: ${{ steps.tag.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  # cfoperator-cockpit: the ephemeral interactive Job image (CFOP-35). Derives
  # FROM the worker image, so it must build after it — `needs` rather than a
  # parallel stanza, or a cockpit build would silently pin whichever worker
  # :main happened to be published last.
  build-cockpit:
    needs: build-worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tag
        # Same branch/tag split as build-and-push above, and the base worker
        # image is resolved to the *same* tag: a release cockpit built on a
        # floating :main base would not be a release.
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/cfoperator-cockpit
          WORKER: ghcr.io/${{ github.repository_owner }}/cfoperator-worker
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "tags=$IMAGE:$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "worker=$WORKER:$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "tags=$IMAGE:main,$IMAGE:main-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "worker=$WORKER:main-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push cockpit
        uses: docker/build-push-action@v5
        with:
          # Repo root, not cockpit/: the image builds cfassist from
          # cfassist-go/ (no published cfassist release implements `attach`),
          # so the Go tree has to be in the build context.
          context: .
          file: cockpit/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            WORKER_IMAGE=${{ steps.tag.outputs.worker }}
          cache-from: type=gha,scope=cockpit
          cache-to: type=gha,mode=max,scope=cockpit
          tags: ${{ steps.tag.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  # cfoperator-changerecord: change-record microservice for the node-action
  # lane (changerecord/, github recorder image). Long-running Deployment behind
  # the cfop-changerecord Service; referenced by a floating :main tag in the
  # private deploy repo, so no bump step. Dormant until the deploy repo wires
  # CFOP_EXEC_CHANGE_URL + CFOP_CHANGERECORD_SHARED_SECRET.
  build-changerecord:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tag
        # Same branch/tag split as build-and-push above.
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/cfoperator-changerecord
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "tags=$IMAGE:$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "tags=$IMAGE:main,$IMAGE:main-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push changerecord
        uses: docker/build-push-action@v5
        with:
          context: changerecord/
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=changerecord
          cache-to: type=gha,mode=max,scope=changerecord
          tags: ${{ steps.tag.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  # cfoperator-tracker: hands needs-human rows to an issue tracker (tracker/,
  # one image, CFOP_TRACKER_BACKEND=plane|github|jira). Long-running
  # Deployment behind the cfop-tracker Service; referenced by a floating :main
  # tag in the private deploy repo, so no bump step. Inert until the deploy
  # repo wires CFOP_TRACKER_URL into the agent and the console flag is on.
  build-tracker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tag
        # Same branch/tag split as build-and-push above.
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/cfoperator-tracker
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "tags=$IMAGE:$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "tags=$IMAGE:main,$IMAGE:main-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push tracker
        uses: docker/build-push-action@v5
        with:
          context: tracker/
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=tracker
          cache-to: type=gha,mode=max,scope=tracker
          tags: ${{ steps.tag.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  # The deploy gate for the database (CFOP-249). The image just built must
  # boot every database layer — knowledge base and its schema migrations,
  # auth store, event_runtime's store, the timescale tool — against a
  # Postgres like production's before the bump below may deploy it. On
  # 2026-10-01 a rebuild pulled SQLAlchemy 2.1, whose default driver was not
  # installed, and the agent crash-looped on boot: CI's tests ran in their own
  # virtualenv and nothing had started the built image against a database.
  # A failure here leaves the image pushed but undeployed.
  db-smoke:
    needs: build-and-push
    runs-on: ubuntu-latest
    services:
      postgres:
        # Production's knowledge-base database image (sre-postgres).
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_PASSWORD: cfop-smoke
          POSTGRES_DB: cfop_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run the database smoke inside the built image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/cfoperator:${{ needs.build-and-push.outputs.image-tag }}
        run: |
          docker run --rm --network host "$IMAGE" \
            python scripts/db_smoke.py postgresql://postgres:cfop-smoke@localhost:5432/cfop_smoke

      # A tag's image is also arm64, and release-stack publishes it to every
      # Pi install once this job passes — so the arm64 variant has to pass the
      # same smoke, under emulation (CFOP-273). Main builds are amd64-only.
      - uses: docker/setup-qemu-action@v3
        if: github.ref_type == 'tag'

      - name: Run the database smoke inside the arm64 image
        if: github.ref_type == 'tag'
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/cfoperator:${{ needs.build-and-push.outputs.image-tag }}
        run: |
          docker run --rm --platform linux/arm64 --network host "$IMAGE" \
            python scripts/db_smoke.py postgresql://postgres:cfop-smoke@localhost:5432/cfop_smoke

  # The compose bundle scripts/install.sh downloads (CFOP-273). Tag builds
  # only, and only after the image is pushed AND has passed db-smoke: the
  # bundle pins this tag's image, so publishing earlier could hand out a
  # compose file that cannot pull, or one whose agent cannot reach its
  # database. tests/test_install_stack.py pins both the `needs` and the order
  # of the pointer refresh below.
  release-stack:
    needs: [build-and-push, db-smoke]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Tags too: the pointer step compares this tag against every v* tag.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build the bundle
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/cfoperator:${{ needs.build-and-push.outputs.image-tag }}@${{ needs.build-and-push.outputs.image-digest }}
        run: |
          pip install pyyaml
          python scripts/release_bundle.py --image "$IMAGE" --out dist
          cd dist && sha256sum cfoperator-compose.tar.gz > checksums.txt

      - name: Version number for the pin
        id: version
        run: echo "number=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # The one release the repo's landing page shows is the Latest-badged
      # one, and a repo has one badge. This is the product, so this release
      # keeps it; release-cfassist.yml sets make_latest: false, and
      # tests/test_workflows.py allows exactly one claimant (CFOP-281).
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: "cfoperator ${{ github.ref_name }}"
          # v1.3.0-rc1 and friends: published for whoever pins them, never
          # badged Latest and never behind the pointer below.
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          body: |
            ## Install

            ```
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/install.sh | sh
            ```

            Needs Docker with the compose plugin. Verifies the bundle's SHA-256, asks the setup questions from inside the stack's own network, and starts Postgres, the agent, the event runtime and the console on :8083. Re-running it upgrades and keeps your `.env`.

            Pin this exact release with `CFOP_VERSION=${{ steps.version.outputs.number }}`. Helm: `helm install cfoperator oci://ghcr.io/${{ github.repository_owner }}/charts/cfoperator --version ${{ steps.version.outputs.number }}`.

            The `cfassist` CLI installs separately, with or without this stack: `curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/install-cfassist.sh | sh`.
          files: |
            dist/cfoperator-compose.tar.gz
            dist/checksums.txt

      # The moving pointer scripts/install.sh downloads from, so the one-liner
      # carries no version. Same reasoning and same order as cfassist-latest in
      # release-cfassist.yml: never delete first — ensure it exists, move the
      # tag, clobber the assets, rewrite the notes — so a failed refresh leaves
      # a stale pointer rather than a 404. The bundle inside always names its
      # real image tag; only the release tag says "latest".
      - name: Refresh the cfoperator-latest pointer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Only the newest final release moves the pointer: a pre-release
          # (v1.3.0-rc1) would make the one-liner install a candidate, and a
          # re-run of an older tag would move it backwards (claude-review).
          if ! python scripts/release_bundle.py --should-move-pointer "${GITHUB_REF_NAME}"; then
            echo "cfoperator-latest stays where it is: ${GITHUB_REF_NAME} is not the newest final release"
            exit 0
          fi
          NOTES="Moving pointer to **${GITHUB_REF_NAME}**, for the install one-liner:

          \`\`\`
          curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/scripts/install.sh | sh
          \`\`\`

          The bundle here is the one built by ${GITHUB_REF_NAME} and pins that image. Pin an exact release with \`CFOP_VERSION=x.y.z\`."

          if ! gh release view cfoperator-latest --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create cfoperator-latest \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --latest=false \
              --title "cfoperator latest (${GITHUB_REF_NAME})" \
              --notes "${NOTES}"
          fi

          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/cfoperator-latest" \
            -f sha="${GITHUB_SHA}" -F force=true >/dev/null || \
            echo "warning: could not move the cfoperator-latest tag; assets below are still current"

          gh release upload cfoperator-latest \
            dist/cfoperator-compose.tar.gz dist/checksums.txt \
            --clobber --repo "${GITHUB_REPOSITORY}"

          gh release edit cfoperator-latest \
            --repo "${GITHUB_REPOSITORY}" \
            --latest=false \
            --title "cfoperator latest (${GITHUB_REF_NAME})" \
            --notes "${NOTES}"

  bump-deploy-repo:
    # db-smoke gates the deploy: an image that cannot talk to its database is
    # never bumped (CFOP-249). tests/test_db_rollout.py pins this.
    needs: [build-and-push, db-smoke]
    # Homelab deploys follow main pushes only. A v* tag build publishes images
    # for the chart/demo audience and must not touch the deploy repo — pointing
    # ArgoCD at a release tag would freeze the fleet on it.
    if: github.ref_type == 'branch'
    # The homelab's own runner (homelab-infra deploy-github-runner.yml): it is
    # registered to this repo, carries kustomize, and has no shared egress IP.
    # What keeps forks off it is this workflow's trigger — on.push.branches:
    # [main] and no pull_request — not the job `if` above, which only skips
    # the v* tag builds. test_workflows.py pins both. The repo's fork-PR
    # approval policy is "all external contributors" (CFOP-114) besides. The
    # image builds stay on hosted runners: public-repo minutes are free and
    # the runner user is in the docker group. If itx-01 is down the bump
    # waits; the revert is this one line. Because the work dir outlives the
    # job here, nothing below leaves a credential or the private checkout
    # behind (persist-credentials: false, per-command auth, the cleanup step).
    runs-on: [self-hosted, linux, x64, ubuntu-itx-01]
    # Serialize bumps so two quick pushes can't race on the deploy repo's main.
    concurrency:
      group: cfoperator-deploy-bump
      cancel-in-progress: false
    steps:
      - name: Checkout cfoperator-deploy
        uses: actions/checkout@v4
        with:
          repository: aachtenberg/cfoperator-deploy
          token: ${{ secrets.DEPLOY_PAT }}
          path: cfoperator-deploy
          # Not written into .git: the token rides each git command below as
          # a header instead. On a persistent runner .git would outlive the job.
          persist-credentials: false

      - name: Ensure kustomize 5.4.3
        # The playbook's /usr/local/bin copy is used only if it is the exact
        # binary (sha256 of the file, not "kustomize version says 5.4.3" — a
        # persistent runner's PATH is not a trust boundary). Anywhere else,
        # fetch the release tarball straight from releases/download/ into the
        # job-scoped $RUNNER_TEMP, checksum the tarball and the binary, no
        # sudo. Never the upstream install_kustomize.sh: it resolves the
        # version through api.github.com anonymously, hosted runners' shared
        # IPs trip that rate limit, and it reports "Version v5.4.3 does not
        # exist" — what stalled the d328a0c deploy (2026-08-28, run 33135088528).
        env:
          KUSTOMIZE_SHA256: 1d6bae90ee8591f7a4ed5b75be3f9bf80b7609f0c785921320827cd93e7c3a9a
          KUSTOMIZE_TGZ_SHA256: 3669470b454d865c8184d6bce78df05e977c9aea31c30df3c669317d43bcc7a7
        run: |
          if echo "$KUSTOMIZE_SHA256  /usr/local/bin/kustomize" | sha256sum -c - >/dev/null 2>&1; then
            echo "KUSTOMIZE=/usr/local/bin/kustomize" >> "$GITHUB_ENV"; exit 0
          fi
          cd "$RUNNER_TEMP"
          curl -fsSL -o kustomize.tgz \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz"
          echo "$KUSTOMIZE_TGZ_SHA256  kustomize.tgz" | sha256sum -c -
          tar -xzf kustomize.tgz kustomize
          echo "$KUSTOMIZE_SHA256  kustomize" | sha256sum -c -
          echo "KUSTOMIZE=$RUNNER_TEMP/kustomize" >> "$GITHUB_ENV"

      - name: Bump image tag and push
        working-directory: cfoperator-deploy
        env:
          DEPLOY_PAT: ${{ secrets.DEPLOY_PAT }}
        run: |
          "$KUSTOMIZE" edit set image \
            ghcr.io/aachtenberg/cfoperator=ghcr.io/aachtenberg/cfoperator:${{ needs.build-and-push.outputs.image-tag }}
          if git diff --quiet -- kustomization.yml; then
            echo "Image tag already ${{ needs.build-and-push.outputs.image-tag }}; nothing to commit."
            exit 0
          fi
          git config user.name "cfoperator-ci"
          git config user.email "cfoperator-ci@users.noreply.github.com"
          git add kustomization.yml
          git commit -m "deploy: bump cfoperator to ${{ needs.build-and-push.outputs.image-tag }}" \
                     -m "Source: ${{ github.repository }}@${{ github.sha }}" \
                     -m "Build: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          # Rebase-pull in case a concurrent bump landed first, then push. The
          # token goes on each command as a header (what actions/checkout does
          # when it persists credentials) and never into .git.
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$DEPLOY_PAT" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=$auth" pull --rebase --autostash origin main
          git -c "http.https://github.com/.extraheader=$auth" push origin main
          echo "Pushed bump → ArgoCD will roll the cfoperator deployment."

      - name: Remove the deploy checkout
        # The runner's work dir persists between jobs: nothing of the private
        # repo stays behind, whichever way the job ended.
        if: always()
        run: rm -rf cfoperator-deploy
