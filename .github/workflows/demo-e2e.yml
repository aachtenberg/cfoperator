name: Demo e2e (kind)

# CFOP-31: one fault, end to end, on a real kind cluster — per release, not
# per PR (a ~20-minute job would double every PR's wall clock; tests.yml
# stays the fast gate). The LLM is demo/ci/llm_stub.py: this job asserts
# pipeline mechanics (fault -> firing alert -> Alertmanager poll -> triage ->
# investigation recorded -> second investigation cites the first), which must
# be deterministic; model quality has its own harness (benchmarks/).
#
# CFOP-315 adds the leg after that: taint fault -> needs_action FIX ->
# remediation row -> approve -> executor Job in kind (built from this
# checkout) -> PR on demo/ci/github_stub.py -> completion callback -> the PR
# URL on the row.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kind-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install kind
        uses: helm/kind-action@v1
        with:
          install_only: true

      - name: Install helm
        # kind-action's install_only puts kind + kubectl on PATH but NOT helm,
        # and ubuntu-latest doesn't ship it — up.sh's binary preflight would
        # die after the cluster half already ran.
        uses: azure/setup-helm@v4

      - name: Start the scripted LLM and the GitHub stub
        # The compose default OLLAMA_URL is host.docker.internal:11434, which
        # host-gateway maps to this runner — so the stub needs no compose
        # changes, only the model name. The executor reaches both stubs
        # through kind's network gateway instead (setup_pr_leg.sh).
        run: |
          python3 demo/ci/llm_stub.py 11434 &
          python3 demo/ci/github_stub.py 9300 &
          echo "OLLAMA_MODEL=demo-stub" >> "$GITHUB_ENV"
          echo "CFOP_ADMIN_PASSWORD=$(openssl rand -hex 16)" >> "$GITHUB_ENV"
          for i in $(seq 1 10); do
            curl -fsS http://localhost:11434/api/tags >/dev/null \
              && curl -fsS http://localhost:9300/_stub/pulls >/dev/null && break
            sleep 1
          done

      - name: Prepare the PR leg (kind cluster, executor image, stub addresses)
        run: demo/ci/setup_pr_leg.sh 11434 9300 >> "$GITHUB_ENV"

      - name: Stand up the demo (kind + kube-prometheus-stack + compose)
        run: demo/up.sh --remediate

      - name: 'Fault 1: crashloop -> investigation'
        run: |
          demo/fault.sh crashloop
          demo/ci/assert_pipeline.sh first 900

      - name: 'Fault 2: same class -> cites the first (memory beat)'
        run: |
          demo/fault.sh clear
          sleep 30
          demo/fault.sh crashloop
          demo/ci/assert_pipeline.sh cited 900

      - name: 'Fault 3: unschedulable -> remediation -> executor -> PR'
        run: |
          demo/fault.sh clear
          demo/fault.sh taint
          python3 demo/ci/assert_pr.py 1200

      - name: Dump state on failure
        if: failure()
        run: |
          docker compose -f docker-compose.yml -f demo/docker-compose.demo.yml logs --tail 300 agent event-runtime || true
          KUBECONFIG=demo/.kube/host-config kubectl get pods -A || true
          KUBECONFIG=demo/.kube/host-config kubectl -n demo-faults describe pods || true
          KUBECONFIG=demo/.kube/host-config kubectl -n cfop-demo get jobs,pods -o wide || true
          KUBECONFIG=demo/.kube/host-config kubectl -n cfop-demo logs -l cfop.dev/role=remediation-executor --tail 200 || true
          curl -fsS http://localhost:9300/_stub/pulls || true

      - name: Tear down
        if: always()
        run: demo/down.sh
