name: LLM Review

# The PR review: Reflection AI's Beam over its OpenAI-compatible API
# (CFOP-400), and when Beam cannot answer (its beta allowance is small and
# daily, CFOP-403) Claude Haiku 5.5 through OpenRouter in the same run
# (CFOP-404); the comment's footer says which one served. Same script and
# pipeline as the local-LLM review that preceded it (CFOP-236, dropped in
# CFOP-402; homelab-infra still runs that one); only the transport differs.
# It is advisory: the job fails only if neither could produce a review.
#
# A hosted runner, so nothing here protects the homelab, which is what the
# fence was first cut for. The same fence still applies, for the key: under plain
# pull_request the PR's own copy of the script would run with
# REFLECTION_API_KEY and a write token, and a same-repo PR could swap the
# reviewer out. So pull_request_target (the base branch's workflow and
# script run, whatever the PR changes), same-repo PRs only, a base-only
# checkout that keeps no credential, and a token that can at most comment.
# tests/test_workflows.py judges this job by fence_violations. The cost: a PR that changes the script is reviewed with
# the base's copy, and this workflow only starts running once it is on main.
on:
  pull_request_target:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  # A push while a review runs makes that review stale; replace it.
  group: llm-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  llm-review:
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # Four model calls (two per backend, primary then fallback) at their
    # timeout plus their 429 pauses, with room to post the comment after
    # (tests/test_local_llm_review.py checks the sum).
    timeout-minutes: 50
    permissions:
      contents: read
      # The review is an issue comment on a PR; that endpoint wants both.
      pull-requests: write
      issues: write

    steps:
      - name: Checkout the reviewer (base branch only)
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/local_llm_review.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW_BACKEND: openai
          REVIEW_NAME: LLM
          REVIEW_API_URL: https://api.reflection.ai/openai/v1
          REVIEW_API_KEY: ${{ secrets.REFLECTION_API_KEY }}
          # Repo variables override the defaults; unset ones arrive empty.
          REVIEW_MODEL: ${{ vars.LLM_REVIEW_MODEL || 'Beam-1.0-501B-A23B' }}
          # Beam always reasons (the API says the setting is mandatory, with
          # its own default of max). Lower is faster, and a review is not
          # where the last few percent of effort pay for themselves.
          REVIEW_REASONING_EFFORT: ${{ vars.LLM_REVIEW_EFFORT || 'high' }}
          # defects: only what the model is sure is a bug. thorough: also
          # concrete risks a maintainer would raise, as low severity
          # (CFOP-403). Flip the variable once thorough is measured.
          REVIEW_SCOPE: ${{ vars.LLM_REVIEW_SCOPE || 'defects' }}
          # When Beam cannot answer. Haiku 5.5 found both bugs planted in a
          # real 15-file diff in 16 s for about a third of a cent; DeepSeek
          # V4 Flash merged them into one finding and Qwen 3.7 Flash found
          # neither (CFOP-404).
          REVIEW_FALLBACK_API_URL: https://openrouter.ai/api/v1
          REVIEW_FALLBACK_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          REVIEW_FALLBACK_MODEL: ${{ vars.LLM_REVIEW_FALLBACK_MODEL || 'anthropic/claude-haiku-5.5' }}
          REVIEW_FALLBACK_REASONING_EFFORT: ${{ vars.LLM_REVIEW_FALLBACK_EFFORT || 'medium' }}
          # 262k-token window: the whole of most PRs. Still a budget, so one
          # vast generated file cannot push everything else out.
          REVIEW_MAX_DIFF_CHARS: '200000'
        run: python3 scripts/local_llm_review.py
