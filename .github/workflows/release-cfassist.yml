name: Release cfassist

on:
  push:
    tags:
      - 'cfassist-v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
          - goos: linux
            goarch: arm64
            suffix: linux-arm64
          - goos: linux
            goarch: arm
            goarm: "7"
            suffix: linux-arm
          - goos: darwin
            goarch: amd64
            suffix: darwin-amd64
          - goos: darwin
            goarch: arm64
            suffix: darwin-arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: cfassist-go/go.mod

      - name: Build
        working-directory: cfassist-go
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          VERSION="${GITHUB_REF_NAME#cfassist-v}"
          LDFLAGS="-s -w -X github.com/aachtenberg/cfoperator/cfassist-go/internal/config.Version=${VERSION}"
          go build -ldflags "${LDFLAGS}" -o cfassist-${{ matrix.suffix }} ./cmd/cfassist

      - uses: actions/upload-artifact@v4
        with:
          name: cfassist-${{ matrix.suffix }}
          path: cfassist-go/cfassist-${{ matrix.suffix }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create checksums
        working-directory: artifacts
        run: sha256sum cfassist-* > checksums.txt

      # The numbered tag is what GitHub badges Latest. generate_release_notes
      # alone is a changelog with no install — the page people actually land
      # on. The one-liner on cfassist-latest does not help: --latest=false
      # keeps that release off the badge. body is prepended to the generated
      # notes, so both survive. The pin is the version number, not the tag:
      # CFASSIST_VERSION=cfassist-v0.11.0 404s.
      - name: Version number for the pin
        id: version
        run: echo "number=${GITHUB_REF_NAME#cfassist-v}" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: "cfassist ${{ github.ref_name }}"
          generate_release_notes: true
          body: |
            ## Install

            ```
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/install-cfassist.sh | sh
            ```

            Detects OS and CPU, verifies the SHA-256, installs to `/usr/local/bin` (or `~/.local/bin` if there is no sudo). No `gh` required. First run writes `~/.cfassist/config.yaml` with every setting stubbed.

            Pin this exact release with `CFASSIST_VERSION=${{ steps.version.outputs.number }}`. Or download an asset below, `chmod +x`, and put it on your PATH.
          files: |
            artifacts/cfassist-*
            artifacts/checksums.txt

      # The moving pointer scripts/install-cfassist.sh downloads from, so the
      # install one-liner carries no version number and does not go stale.
      #
      # A dedicated tag rather than GitHub's own /releases/latest: that returns
      # the newest release across ALL tag series in this repo (cfassist-v*,
      # llm-gateway-v*, v*), so it would hand out the wrong artifact the first
      # time a non-cfassist release is cut.
      #
      # Updated in place, never deleted first. A delete-then-create leaves a
      # window where cfassist-latest does not exist, and if the create then
      # fails — a bad glob, a notes parse error, a permissions blip — the
      # documented one-liner 404s for everyone until the next version tag
      # succeeds. A failed refresh must not be worse than a stale pointer, so
      # the order is: ensure it exists, move the tag, clobber the assets,
      # rewrite the notes. Every step is survivable on its own.
      #
      # The uploaded binaries are the ones this version tag just built, so a
      # cfassist installed from cfassist-latest still reports its real version —
      # the *tag* is a pointer, the *binary* never says "latest".
      # `--latest=false` keeps the pointer from stealing the Latest badge from
      # the numbered releases.
      - name: Refresh the cfassist-latest pointer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES="Moving pointer to **${GITHUB_REF_NAME}**, for the install one-liner:

          \`\`\`
          curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/scripts/install-cfassist.sh | sh
          \`\`\`

          The binaries here are the ones built by ${GITHUB_REF_NAME} and report that version. Pin an exact release with \`CFASSIST_VERSION=x.y.z\`."

          if ! gh release view cfassist-latest --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create cfassist-latest \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --latest=false \
              --title "cfassist latest (${GITHUB_REF_NAME})" \
              --notes "${NOTES}"
          fi

          # Move the tag onto this release's commit. Done through the API
          # because this job has no checkout. Non-fatal: a pointer whose tag
          # lags is cosmetic, while a failed release job is not.
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/cfassist-latest" \
            -f sha="${GITHUB_SHA}" -F force=true >/dev/null || \
            echo "warning: could not move the cfassist-latest tag; assets below are still current"

          gh release upload cfassist-latest \
            artifacts/cfassist-* artifacts/checksums.txt \
            --clobber --repo "${GITHUB_REPOSITORY}"

          gh release edit cfassist-latest \
            --repo "${GITHUB_REPOSITORY}" \
            --latest=false \
            --title "cfassist latest (${GITHUB_REF_NAME})" \
            --notes "${NOTES}"
