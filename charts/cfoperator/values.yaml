# CFOperator chart values.
#
# Three values matter (same contract as the docker-compose trial): an LLM,
# your Prometheus URL, and optionally a notify webhook. Everything else
# defaults. A getting-started values file:
#
#   llm:
#     url: http://ollama.example:11434
#     model: llama3.1:8b
#   prometheus:
#     url: http://kps-kube-prometheus-stack-prometheus.monitoring:9090
#   alertmanager:
#     url: http://kps-kube-prometheus-stack-alertmanager.monitoring:9093
#   notify:
#     slackWebhook: https://hooks.slack.com/services/...

# investigate (default): observe, triage, investigate, notify — read-only
# RBAC, every remediation flag hard-ceilinged off by the profile.
# remediate: adds the remediation queue, executor Jobs, and the PR loop —
# requires remediate.gitRepo + remediate.githubToken.
profile: investigate

image:
  repository: ghcr.io/aachtenberg/cfoperator
  # The build workflow publishes :main and :main-<sha> — release-versioned
  # image tags don't exist yet, so the appVersion is NOT a valid default here.
  tag: main
  # Always because the default tag floats: IfNotPresent would pin whichever
  # :main a node pulled first, and `helm upgrade` would silently never move.
  # Pin tag to a :main-<sha> and set IfNotPresent for reproducible installs.
  pullPolicy: Always

llm:
  # ollama (any OpenAI-compat endpoint the agent's ollama backend reaches) or
  # a hosted key below. REQUIRED: llm.url for the ollama backend, or an API key.
  backend: ollama
  url: ""
  model: llama3.1:8b
  anthropicApiKey: ""
  groqApiKey: ""
  xaiApiKey: ""
  geminiApiKey: ""

prometheus:
  url: ""            # REQUIRED

# Optional — blank leaves the feature off rather than half-configured.
alertmanager:
  url: ""
loki:
  url: ""

notify:
  slackWebhook: ""
  discordWebhook: ""

admin:
  username: admin
  # Empty: the bootstrap Job generates one and prints it ONCE in its log
  # (kubectl logs job/<release>-cfoperator-bootstrap).
  password: ""

postgres:
  # Bundled pgvector StatefulSet (default). Set bundled: false and fill
  # external.* to bring your own — it must allow CREATE EXTENSION vector,
  # or embeddings stay off.
  bundled: true
  image: pgvector/pgvector:pg16
  storage: 5Gi
  storageClassName: ""
  database: cfoperator
  username: cfoperator
  password: ""       # generated once and kept across upgrades when empty
  external:
    host: ""
    port: 5432
    database: cfoperator
    username: cfoperator
    password: ""

console:
  service:
    type: ClusterIP
    port: 8083

# Only read when profile: remediate.
remediate:
  gitRepo: ""        # owner/repo the executor opens PRs against — REQUIRED
  githubToken: ""    # PR credential — REQUIRED (or pre-create the secret)
  executorImage: ghcr.io/aachtenberg/cfoperator-executor:main
  # Executor Jobs also read ANTHROPIC_API_KEY from the remediate secret when
  # set; llm.anthropicApiKey is reused for it automatically.

# Incident cockpit (CFOP-35): `cfassist attach <id> --spawn` launches an
# ephemeral, read-only pod on the affected node and drops the operator into a
# briefed session inside it. Off by default because spawning is a cluster
# write — a Job plus a short-lived token Secret in the release namespace — and
# the investigate profile's claim is that it makes none. The pod's own identity
# (cfoperator-cockpit) is read-only whether or not this is on.
cockpit:
  enabled: false
  # Tiers 2/3 of the ladder (CFOP-36): a cockpit on a host that is not in the
  # cluster — a docker container, or the released cfassist under a transient
  # systemd unit. Both are reached by ssh from the agent, so unlike tier 1 they
  # need a key in the agent pod. Separate from `enabled` because it is a
  # different grant: `enabled` lets the agent create Jobs in its own namespace,
  # this one gives it a credential to log in to machines with. Off unless a
  # secret is named.
  #
  # The secret holds the private key (any filename; the first key in the secret
  # is used, matching the executor's `cfop-forensics-ssh` convention). The user
  # is the fallback for hosts whose infrastructure.hosts entry does not set one.
  ssh:
    secretName: ""
    user: sre

agent:
  resources: {}
eventRuntime:
  resources: {}
