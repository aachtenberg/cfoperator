{{- include "cfoperator.validate" . -}}
{{- $completion := include "cfoperator.keptSecretValue" (list . "completion-secret" "") -}}
{{/* Generated credentials, kept stable across upgrades via lookup (see
     cfoperator.keptSecretValue). Normal Kubernetes Secrets on purpose —
     no SealedSecrets, no external tooling in the getting-started path.

     One secret holds every generated/operator credential because the executor
     Job manifest (agent/agent.py _build_executor_manifest) reads GITHUB_TOKEN,
     ANTHROPIC_API_KEY, and CFOP_COMPLETION_SHARED_SECRET from a single secret
     named by remediation.executor.secrets_name — and the completion secret
     must be byte-identical between the agent that verifies it and the Job
     that presents it, which one template render of one file guarantees. */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cfoperator.fullname" . }}-generated
  labels:
{{ include "cfoperator.labels" . | indent 4 }}
type: Opaque
stringData:
  postgres-password: {{ include "cfoperator.keptSecretValue" (list . "postgres-password" (or .Values.postgres.password .Values.postgres.external.password)) | quote }}
  # Signs console session cookies; unset would make every login a 500.
  session-secret: {{ include "cfoperator.keptSecretValue" (list . "session-secret" "") | quote }}
  # Service token for event-runtime -> agent calls. The compose trial mints a
  # DB-backed token onto a shared volume; pods share no volume, so the chart
  # uses the still-supported CFOP_API_TOKEN service-token path instead.
  # KNOWN TRADE-OFF: the legacy identity carries EVERY scope (read+investigate
  # +remediate, which collapses to admin at the HTTP API) — broader than the
  # read+investigate token compose mints, and revocable only by rotating this
  # Secret. Anyone who can read Secrets/pod env in this namespace holds it.
  # The investigate profile's tameness is therefore cluster RBAC + the profile
  # flag ceiling, NOT this bearer. Every use is audited as token.legacy_used;
  # minting a DB-backed scoped token into this Secret is the follow-up that
  # retires the trade-off. Documented in docs/HELM.md.
  api-token: {{ include "cfoperator.keptSecretValue" (list . "api-token" "") | quote }}
  # Authenticates completion callbacks (agent -> event-runtime, executor Job
  # -> agent). Unset would mean "accept anything" — set it always.
  completion-secret: {{ $completion | quote }}
  CFOP_COMPLETION_SHARED_SECRET: {{ $completion | quote }}
{{- if eq .Values.profile "remediate" }}
  GITHUB_TOKEN: {{ required "profile: remediate requires remediate.githubToken" .Values.remediate.githubToken | quote }}
  ANTHROPIC_API_KEY: {{ .Values.llm.anthropicApiKey | quote }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cfoperator.fullname" . }}-llm
  labels:
{{ include "cfoperator.labels" . | indent 4 }}
type: Opaque
stringData:
  ANTHROPIC_API_KEY: {{ .Values.llm.anthropicApiKey | quote }}
  GROQ_API_KEY: {{ .Values.llm.groqApiKey | quote }}
  XAI_API_KEY: {{ .Values.llm.xaiApiKey | quote }}
  GEMINI_API_KEY: {{ .Values.llm.geminiApiKey | quote }}
