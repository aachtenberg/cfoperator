{{/* The values-level expression of the scope ladder (CFOP-30):
     investigate = read-only, cluster-wide observation; remediate adds write
     access to exactly one resource — batch Jobs in the release namespace
     (create for the drainer's spawn, delete for the reaper). GitOps-class
     executor Jobs themselves need no RBAC: their only output is a GitHub PR
     and a completion POST back to the agent. */}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cfoperator.fullname" . }}
  labels:
{{ include "cfoperator.labels" . | indent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "cfoperator.fullname" . }}-read
  labels:
{{ include "cfoperator.labels" . | indent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, services, endpoints, events, nodes, namespaces, persistentvolumeclaims, persistentvolumes]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, daemonsets, statefulsets, replicasets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    resources: [pods, nodes]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "cfoperator.fullname" . }}-read
  labels:
{{ include "cfoperator.labels" . | indent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "cfoperator.fullname" . }}-read
subjects:
  - kind: ServiceAccount
    name: {{ include "cfoperator.fullname" . }}
    namespace: {{ .Release.Namespace }}
{{- if eq .Values.profile "remediate" }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "cfoperator.fullname" . }}-executor-spawn
  labels:
{{ include "cfoperator.labels" . | indent 4 }}
rules:
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create, get, list, watch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "cfoperator.fullname" . }}-executor-spawn
  labels:
{{ include "cfoperator.labels" . | indent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "cfoperator.fullname" . }}-executor-spawn
subjects:
  - kind: ServiceAccount
    name: {{ include "cfoperator.fullname" . }}
    namespace: {{ .Release.Namespace }}
---
{{/* The SA executor Jobs run as. No RBAC on purpose (see header comment). */}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cfoperator-executor
  labels:
{{ include "cfoperator.labels" . | indent 4 }}
{{- end }}
{{- if .Values.cockpit.enabled }}
---
{{/* Incident cockpit (CFOP-35): an ephemeral interactive Job the operator
     attaches to with their own kubectl.

     Two identities, deliberately unequal:

     * cfoperator-cockpit — what the POD runs as. Read-only, cluster-wide,
       mirroring the deep-investigation worker: NO exec, NO write verbs, NO
       secrets, NO configmaps. A cockpit is a place to look from, and the write
       path stays the PR/console gate even from a pod on the affected node.
     * the agent's own SA — gains exactly what launching one needs: Jobs in the
       release namespace, plus `create` (only) on secrets for the short-lived
       token the pod reads its briefing with. No `get` on secrets, so under THIS
       chart the launcher is not a way to read anything already there, and no
       `delete` either: the Secret is owned by the Job, so Kubernetes GC removes
       it. (That first clause is a property of the chart, not of the grant. An
       install whose agent already reads secrets cluster-wide — the homelab
       deploy repo does — gets the narrowness of `create` without the
       conclusion; see docs/DEPLOYMENT.md "Agent secrets read".)

     Off by default (cockpit.enabled) because spawning is a cluster write, and
     the investigate profile's whole claim is that it makes none. */}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cfoperator-cockpit
  labels:
{{ include "cfoperator.labels" . | indent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "cfoperator.fullname" . }}-cockpit-readonly
  labels:
{{ include "cfoperator.labels" . | indent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, services, endpoints, events, nodes, namespaces, persistentvolumeclaims]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, daemonsets, statefulsets, replicasets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    resources: [pods, nodes]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "cfoperator.fullname" . }}-cockpit-readonly
  labels:
{{ include "cfoperator.labels" . | indent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "cfoperator.fullname" . }}-cockpit-readonly
subjects:
  - kind: ServiceAccount
    name: cfoperator-cockpit
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "cfoperator.fullname" . }}-cockpit-spawn
  labels:
{{ include "cfoperator.labels" . | indent 4 }}
rules:
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create, get, list, watch, delete]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
{{- if .Values.cockpit.bridgePodAttach }}
  {{/* CFOP-59 Phase B: the ONE grant that lets the agent open a terminal into
       a cockpit pod, for the browser bridge. `create` on the attach subresource and
       nothing else — never the exec subresource (an arbitrary command, not the session the
       Job already runs), and namespaced to the release/cockpit namespace, not
       cluster-wide. Off by default and separate from `cockpit.enabled`: this
       is the deliberate act test_cockpit_attach_contract.py exists to make
       conscious. It pairs with the runtime `cockpit.bridge_pod_tier` — the
       chart grant without the flag is unused; the flag without the grant is a
       readable "forbidden" at attach time, never a silent one. */}}
  - apiGroups: [""]
    resources: [pods/attach]
    verbs: [create]
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "cfoperator.fullname" . }}-cockpit-spawn
  labels:
{{ include "cfoperator.labels" . | indent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "cfoperator.fullname" . }}-cockpit-spawn
subjects:
  - kind: ServiceAccount
    name: {{ include "cfoperator.fullname" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
