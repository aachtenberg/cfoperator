{{- if .Values.postgres.bundled }}
{{/* Bundled pgvector Postgres — the zero-decision default. Bring your own by
     setting postgres.bundled: false + postgres.external.* (it must allow
     CREATE EXTENSION vector, or knowledge-base embeddings stay off). */}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cfoperator.fullname" . }}-postgres
  labels:
{{ include "cfoperator.labels" . | indent 4 }}
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: cfoperator
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: postgres
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "cfoperator.fullname" . }}-postgres
  labels:
{{ include "cfoperator.labels" . | indent 4 }}
spec:
  serviceName: {{ include "cfoperator.fullname" . }}-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cfoperator
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cfoperator
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: postgres
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.username | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "cfoperator.fullname" . }}-generated
                  key: postgres-password
            # Data one level below the mount so the PVC's lost+found does not
            # trip initdb's empty-directory check.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.username | quote }}, "-d", {{ .Values.postgres.database | quote }}]
            initialDelaySeconds: 5
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.postgres.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
{{- end }}
